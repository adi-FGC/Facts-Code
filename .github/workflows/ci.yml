name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      # pnpm version comes from package.json "packageManager" (pnpm@12.8.1).
      # Do NOT also set `version:` here — action-setup errors on a dual spec.
      # v6.1.0 is the first release that supports pnpm 12.
      - uses: pnpm/action-setup@v6

      # Node 24 = the root engines floor (>=24.3.0), which Remix 3 (ui-remix)
      # requires; netlify.toml and cve-refresh.yml build on the same major.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Lint, tier boundaries and formatting are OS-independent — run once.
      # Without this, format:check / lint:boundaries were promised in package.json
      # but never enforced, and a formatter pass could land unchecked.
      # `lint:boundaries` (eslint) fails on C1/C2 violations and on the
      # error-level rules of js/typescript-eslint recommended; the style rules
      # listed in eslint.config.mjs are downgraded to warnings. It then runs
      # test/boundaries.test.mjs, which proves the gate CAN fail: known-bad
      # probe imports (static, import(), require(), relative) must be reported.
      - name: Lint + boundaries + format
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm lint
          pnpm lint:boundaries
          pnpm format:check
          pnpm format:md:check

      - name: Typecheck
        run: pnpm turbo typecheck

      # --continue: one failing suite no longer cancels the other ~10, so a run
      # reports every failure at once (run 37140061604 showed only the first).
      # --concurrency=2: the default fan-out put ~10 vitest pools on a 3-4
      # vCPU runner and slowed CPU-bound tests 10-20x past their budgets.
      - name: Tests
        run: pnpm turbo test --continue=dependencies-successful --concurrency=2

      # The CLI's local UI (the hardened legacy prototype behind `factstack ui`,
      # `export` and `quick`) rendered in headless Chromium with a dataset whose
      # every string is a markup payload (security#3). `pnpm turbo test` above
      # runs before any browser is installed, so there the suite SKIPS; here it
      # gets Chromium and FACTS_UI_DOM_TEST=1 turns a missing browser into a
      # failure instead of a skip. BLOCKING — no continue-on-error. Chromium is
      # installed by apps/cli's OWN `playwright` devDependency (pinned 1.60.0).
      # The test file still loads Playwright through ui-remix's @playwright/test,
      # which finds this browser only while the lockfile resolves ONE playwright
      # version; test/workflows.test.mjs fails if it resolves more than one.
      # The guard steps below do not depend on the unit tests, so they run even
      # when the Tests step failed (`!cancelled()`): a red test must not hide a
      # broken build or CSP guard.
      - name: Legacy UI — DOM XSS regression (headless Chromium)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        env:
          FACTS_UI_DOM_TEST: '1'
        run: |
          pnpm --filter @factstack/cli exec playwright install --with-deps chromium
          pnpm --filter @factstack/cli exec vitest run scripts/test/legacy-ui-dom.test.ts

      # Smoke: the CLI should analyze itself and produce valid artifacts.
      # Golden-master fixture: re-run and diff against committed summary.
      - name: Smoke — analyze self
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # cwd-relative path, not /tmp: bash's `> /tmp/x` and Node's
          # readFileSync('/tmp/x') disagree on the Windows runner (Node maps
          # /tmp to D:\tmp → ENOENT). A relative file resolves identically for
          # both. Cleaned up after so no later tree-clean step sees it.
          ./apps/cli/node_modules/.bin/tsx apps/cli/src/cli.ts analyze . --json > smoke.json
          node -e "
            const j = JSON.parse(require('fs').readFileSync('smoke.json','utf8'));
            if (!j.ok) throw new Error('analyze failed');
            if (!j.stats || j.stats.fileCount < 10) throw new Error('fileCount too low: ' + j.stats?.fileCount);
            if (typeof j.agentPath !== 'string') throw new Error('agentPath missing');
            console.log('[smoke] files=' + j.stats.fileCount + ' loc=' + j.stats.loc + ' risks=' + j.risks);
          "
          rm -f smoke.json

      # Repo-root tests (test/): the deploy scripts, the Cloudflare _headers
      # model, the strict-CSP page guard, the public-bake scrub (end to end
      # over the .facts/ the smoke step just wrote), the evaluator hardening
      # and the root scripts. Every OS: several of them are about paths.
      - name: Root tests (deploy tooling + boundary probes)
        if: ${{ !cancelled() }}
        run: pnpm test:root

      # OPD-2: build the web dashboard in CI so bundler errors AND the
      # CSP-hash/connect-src drift guard (check-bundle-size.mjs) run pre-deploy
      # — not silently first on Netlify/Cloudflare. That script also prints the
      # bundle report, but no longer caps size (removed 2026-09-23: first-paint
      # time is measured directly instead). Runs after
      # Smoke so the `analyze .` above has populated .facts/ for inject-data to
      # bake. Uses build:static to mirror the production (map-free) deploy.
      - name: Build web dashboard (bundle + CSP guards)
        if: ${{ !cancelled() }}
        run: pnpm --filter @factstack/ui-remix build:static

      # First paint on the build above, under Lighthouse's mobile Slow 4G +
      # 4x CPU (scripts/perf-report.mjs). REPORT-ONLY for now: the numbers go to
      # the job summary and the step can never turn the job red. Once they are
      # stable, set PERF_WARN_LCP_MS (a warning) or make it a budget.
      - name: First-paint report (report-only)
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pnpm --filter @factstack/ui-remix exec playwright install --with-deps chromium
          pnpm --filter @factstack/ui-remix perf:report

      # The dashboard in Chromium under its production CSP (vite preview sends
      # dist/_headers), with the console guard that fails on errors and on
      # Remix runtime warnings (test/e2e/fixtures.ts). After the first-paint
      # report: the e2e web server runs `pnpm build`, which replaces the
      # build:static dist that report measures. Before CLI bundle, which
      # rewrites the .facts/ the build bakes.
      - name: Dashboard e2e (Chromium, production CSP)
        id: e2e
        if: ${{ !cancelled() && matrix.os == 'ubuntu-latest' }}
        timeout-minutes: 20
        run: |
          pnpm --filter @factstack/ui-remix exec playwright install --with-deps chromium
          pnpm --filter @factstack/ui-remix test:e2e

      - name: Upload e2e report
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/ui-remix/playwright-report
          retention-days: 14
          # "Re-run failed jobs" uploads again under the same name.
          overwrite: true

      # Determinism gate (F13): re-run the benchmark over the committed corpus and
      # fail if the byte output drifts from bench/expected.json. Runs on every OS in
      # the matrix, which also verifies the corpus .gitattributes LF pinning keeps
      # the numbers byte-identical across platforms. Repin via `pnpm bench:update`
      # after an intentional corpus/task change. (Honors bench/README.md.)
      - name: Bench — determinism gate
        if: ${{ !cancelled() }}
        shell: bash
        run: ./apps/cli/node_modules/.bin/tsx apps/cli/src/cli.ts bench --check

      # deploy-infra#7: prove the distributable, not just the source. The
      # bundle test inside `pnpm turbo test` builds a bundle into a temp dir and
      # runs it on a small fixture; this builds the real publish folder
      # (apps/cli/publish/, gitignored), runs it with plain Node over this repo
      # and lists what `npm pack` would ship. NEVER publishes: publishing is the
      # owner's (apps/cli/PUBLISHING.md). Last, so its .facts/ rewrite cannot
      # change what the dashboard build above baked.
      - name: CLI bundle — build, run, pack (dry run)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          pnpm --filter @factstack/cli pack:dry-run
          node apps/cli/publish/dist/cli.js --version
          # cwd-relative output file, not /tmp — see the Smoke step.
          node apps/cli/publish/dist/cli.js analyze . --no-progress --json > bundle-smoke.json
          node -e "
            const j = JSON.parse(require('fs').readFileSync('bundle-smoke.json','utf8'));
            if (!j.ok) throw new Error('bundled analyze failed');
            if (!j.stats || j.stats.fileCount < 10) throw new Error('fileCount too low: ' + j.stats?.fileCount);
            console.log('[bundle] analyzed files=' + j.stats.fileCount);
          "
          rm -f bundle-smoke.json
