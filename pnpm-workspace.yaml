packages:
  - 'packages/*'
  - 'apps/*'
  - 'plugins/*'
  - 'examples/*'
  - 'prototype'
  - 'legacy/prototype'

allowBuilds:
  # @tailwindcss/cli's file watcher (only used by --watch); its prebuilt
  # platform binary covers the one-shot builds, so no install script runs.
  '@parcel/watcher': false
  esbuild: true

# Remix 3.0.0 (published 2026-10-01) and its @remix-run/* 1.0.0 set are
# younger than pnpm's default release-age gate; these exact versions are
# exempt so the stable release installs now. Once they age past the gate the
# list can be emptied.
minimumReleaseAgeExclude:
  - '@remix-run/assert@1.0.0'
  - '@remix-run/assets@1.0.0'
  - '@remix-run/async-context-middleware@1.0.0'
  - '@remix-run/auth-middleware@1.0.0'
  - '@remix-run/auth@1.0.0'
  - '@remix-run/cli@1.0.0'
  - '@remix-run/component-hmr@1.0.0'
  - '@remix-run/component@1.0.0'
  - '@remix-run/compression-middleware@1.0.0'
  - '@remix-run/cookie@1.0.0'
  - '@remix-run/cop-middleware@1.0.0'
  - '@remix-run/cors-middleware@1.0.0'
  - '@remix-run/csrf-middleware@1.0.0'
  - '@remix-run/data-schema@1.0.0'
  - '@remix-run/data-table-mysql@1.0.0'
  - '@remix-run/data-table-postgres@1.0.0'
  - '@remix-run/data-table-sqlite@1.0.0'
  - '@remix-run/data-table@1.0.0'
  - '@remix-run/fetch-proxy@1.0.0'
  - '@remix-run/fetch-router@1.0.0'
  - '@remix-run/file-storage-s3@1.0.0'
  - '@remix-run/file-storage@1.0.0'
  - '@remix-run/form-data-middleware@1.0.0'
  - '@remix-run/form-data-parser@1.0.0'
  - '@remix-run/fs@1.0.0'
  - '@remix-run/headers@1.0.0'
  - '@remix-run/html-template@1.0.0'
  - '@remix-run/lazy-file@5.0.8'
  - '@remix-run/logger-middleware@1.0.0'
  - '@remix-run/method-override-middleware@1.0.0'
  - '@remix-run/mime@1.0.0'
  - '@remix-run/multipart-parser@1.0.0'
  - '@remix-run/multiple-import-maps-polyfill@1.0.0'
  - '@remix-run/node-fetch-server@1.0.0'
  - '@remix-run/node-hmr@1.0.0'
  - '@remix-run/node-tsx@1.0.0'
  - '@remix-run/render-middleware@1.0.0'
  - '@remix-run/response@1.0.0'
  - '@remix-run/route-pattern@1.0.0'
  - '@remix-run/session-middleware@1.0.0'
  - '@remix-run/session-storage-memcache@1.0.0'
  - '@remix-run/session-storage-redis@1.0.0'
  - '@remix-run/session@1.0.0'
  - '@remix-run/spa@1.0.0'
  - '@remix-run/static-middleware@1.0.0'
  - '@remix-run/tar-parser@1.0.0'
  - '@remix-run/terminal@1.0.0'
  - '@remix-run/test@1.0.0'
  - remix@3.0.0

overrides:
  # GHSA-g7r4-m6w7-qqqr (esbuild dev server reads arbitrary files on Windows,
  # >=0.27.3 <0.28.1). vite 8 already accepts ^0.28; only remix's own
  # @remix-run/test caps it at ^0.27.1, and this repo never runs that runner
  # (tests are vitest). Drop this once remix ships a release that allows 0.28.
  'esbuild@<0.28.1': '^0.28.2'

# better-sqlite3 removed in favor of node:sqlite (Node 22+ built-in, no native compile).
# Keep this allowBuilds block if you ever add a native module; pnpm 10 gates build scripts by default.

# Supply-chain defense for exotic git-resolved subdeps lives in
# .pnpmfile.cjs at the repo root. See that file for the rationale.
