packages:
  - "packages/*"
  - "apps/*"
  - "plugins/*"
  - "examples/*"
  - "prototype"

allowBuilds:
  esbuild: true

# scheduleUpdate queue-fix: the default #scheduleUpdate in @remix-run/ui
# throws 'scheduleUpdate not implemented', which surfaces as an unhandled
# rejection when a component calls handle.update() synchronously from its
# setup body (before renderComponent wires the real scheduler). The patch
# makes the default queue the request and replay it once setScheduleUpdate
# installs the real one. Still required as of 0.3.0 (remix beta.3) — the fix
# was NOT adopted upstream. Re-roll via `pnpm patch @remix-run/ui@<ver>` on
# the next bump if the throw is still present.
patchedDependencies:
  '@remix-run/ui@0.3.0': patches/@remix-run__ui@0.3.0.patch

# better-sqlite3 removed in favor of node:sqlite (Node 22+ built-in, no native compile).
# Keep this allowBuilds block if you ever add a native module; pnpm 10 gates build scripts by default.

# Supply-chain defense for exotic git-resolved subdeps lives in
# .pnpmfile.cjs at the repo root. See that file for the rationale.
