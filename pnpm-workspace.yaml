packages:
  - "packages/*"
  - "apps/*"
  - "plugins/*"
  - "examples/*"
  - "prototype"

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@remix-run/assert@0.3.0'
  - '@remix-run/assets@0.4.3'
  - '@remix-run/async-context-middleware@0.3.3'
  - '@remix-run/auth-middleware@0.2.3'
  - '@remix-run/auth@0.2.5'
  - '@remix-run/cli@0.3.3'
  - '@remix-run/compression-middleware@0.1.11'
  - '@remix-run/cop-middleware@0.1.6'
  - '@remix-run/cors-middleware@0.1.6'
  - '@remix-run/csrf-middleware@0.1.6'
  - '@remix-run/fetch-router@0.20.0'
  - '@remix-run/form-data-middleware@0.3.3'
  - '@remix-run/logger-middleware@0.3.3'
  - '@remix-run/method-override-middleware@0.1.11'
  - '@remix-run/render-middleware@0.1.3'
  - '@remix-run/route-pattern@0.22.1'
  - '@remix-run/session-middleware@0.3.3'
  - '@remix-run/static-middleware@0.4.12'
  - '@remix-run/test@0.5.0'
  - remix@3.0.0-beta.6

patchedDependencies:
  '@remix-run/ui@0.5.0': patches/@remix-run__ui@0.5.0.patch

# scheduleUpdate queue-fix: @remix-run/ui throws 'scheduleUpdate not
# implemented' when a component calls handle.update() synchronously from its
# setup body — setScheduleUpdate is only wired AFTER handle.render() returns
# (reconcile.ts). The patch makes the pre-wire default remember the request
# and replay it once setScheduleUpdate installs the real target. Verified
# still required at 0.5.0 (remix beta.6): the runtime moved to field-based
# scheduling (#updateQueue/#updateVNode/#updateDomParent) but kept the throw
# and the after-render wiring, so the patch is re-rolled against the new
# shape rather than dropped. Re-verify on every @remix-run/ui bump.

# better-sqlite3 removed in favor of node:sqlite (Node 22+ built-in, no native compile).
# Keep this allowBuilds block if you ever add a native module; pnpm 10 gates build scripts by default.

# Supply-chain defense for exotic git-resolved subdeps lives in
# .pnpmfile.cjs at the repo root. See that file for the rationale.
