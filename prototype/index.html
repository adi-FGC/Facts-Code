<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>FACTS · AI Coding Tracker Stack</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234ade80'/%3E%3Cpath d='M5.5 8.5l2 2 3-4' stroke='white' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- No-flash theme boot — light is default; dark is opt-in. Also applies
         saved font-size + body-font preferences pre-paint. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem('facts-theme') || 'light';
          var d = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = d ? 'dark' : 'light';
          document.documentElement.style.colorScheme = d ? 'dark' : 'light';
          var fs = localStorage.getItem('facts-font') || '1';
          document.documentElement.style.setProperty('--fs-mult', fs);
          var bodyFont = localStorage.getItem('facts-body-font') || 'inter';
          document.documentElement.dataset.bodyFont = bodyFont;
        } catch (_) {}
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts:
      - Urbanist (display)    — SIL OFL, free for commercial use. Headings / chips / tabs.
      - Inter (body default)  — SIL OFL, free for commercial use. Paragraphs / dense text.
      - JetBrains Mono (code) — SIL OFL, free for commercial use. Paths / numbers.
      - Google Sans (body alt, opt-in) — Google's proprietary UI typeface. Google does NOT
        serve this font publicly via the Google Fonts API in most cases; the request below
        will silently fall back to system-ui on non-Google origins. Shipping Google Sans
        commercially requires a license from Google. If your deployment needs a legally
        shippable near-equivalent, swap `Google Sans` for `Lexend` or `Public Sans`.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=Google+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,600..700;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style>
      /* ================================================================== */
      /* Design tokens                                                      */
      /* ================================================================== */
      :root {
        color-scheme: light dark;
        --fs-mult: 1;
        font-size: calc(16px * var(--fs-mult));

        /* Light theme — tinted warm off-white. oklch(99% 0.005 95) = paper-like.
           Replaces #ffffff (audit C1: pure white is an AI-slop tell). */
        --bg: oklch(99% 0.005 95);
        --bg-rgb: 253, 252, 248;
        --surface-1: oklch(100% 0 0);
        --surface-1-rgb: 255, 255, 255;
        --surface-2: color-mix(in oklab, black 4%, transparent);
        --surface-3: color-mix(in oklab, black 7%, transparent);
        --surface-glass-bg: color-mix(in oklab, black 5%, transparent);
        --surface-glass-border: color-mix(in oklab, black 12%, transparent);
        --surface-glass-highlight: color-mix(in oklab, white 70%, transparent);
        --fg: #0b0d10;
        --fg-muted: #3f434a;     /* was #4a4e55 — bumped for AA headroom */
        --fg-subtle: #5f646c;    /* was #7a7f86 (4.03:1 → FAIL) → now 5.6:1 ✓ AA */
        --border: color-mix(in oklab, black 10%, transparent);
        --border-strong: color-mix(in oklab, black 20%, transparent);
        --hairline: color-mix(in oklab, black 18%, transparent);  /* editorial rule */
        --accent: #08703f;         /* was #0a7f4a (4.93) → 5.82:1 headroom over AA */
        --accent-fg: #ffffff;
        --accent-soft: color-mix(in oklab, #08703f 15%, transparent);
        --ok: #0e6b32;             /* was #15803d (4.89) → 5.98:1 */
        --warn: #a3570a;
        --danger: #9a1515;
        --info: #1850b8;
        --code-bg: color-mix(in oklab, black 4%, transparent);
        --shadow-sm: 0 1px 2px color-mix(in oklab, black 4%, transparent);
        --shadow-md: 0 12px 40px -12px color-mix(in oklab, black 18%, transparent);

        /* Language palette — tokenized (audit H4). Dimmed for contrast on warm bg. */
        --lang-typescript: #2e6cb0;
        --lang-javascript: #b08d0f;
        --lang-python:     #2d6590;
        --lang-react:      #0a7ca5;
        --lang-json:       #6f7681;
        --lang-yaml:       #a32428;
        --lang-toml:       #8a3a1d;
        --lang-markdown:   #1850b8;
        --lang-html:       #9a4214;
        --lang-css:        #1466a5;
        --lang-folder:     #2f72d4;

        /* Warm gradient washes (inspired by design-ref) — two large soft blobs */
        --blob-a-start: #ff3b86; /* pink */
        --blob-a-mid:   #ff7a1a; /* orange */
        --blob-a-end:   #ffd21a; /* yellow */
        --blob-b-start: #d83333; /* red */
        --blob-b-mid:   #ff2d7a; /* magenta */
        --blob-b-end:   #8b4dff; /* purple */

        --blob-opacity: 0.18;
        --blob-blur: 100px;
      }

      :root[data-theme='dark'] {
        /* Midnight base — mirrors the full light-mode token structure so the
           editorial redesign (hairlines, stacked bar legend, language dots,
           focus rings) read correctly in both themes. Contrast checked AA+. */
        --bg: oklch(13% 0.02 250);
        --bg-rgb: 8, 11, 22;
        --surface-1: color-mix(in oklab, white 3%, transparent);
        --surface-1-rgb: 24, 27, 38;
        --surface-2: color-mix(in oklab, white 5%, transparent);
        --surface-3: color-mix(in oklab, white 8%, transparent);
        --surface-glass-bg: color-mix(in oklab, white 4%, transparent);
        --surface-glass-border: color-mix(in oklab, white 12%, transparent);
        --surface-glass-highlight: color-mix(in oklab, white 10%, transparent);
        --fg: #eef1f8;
        --fg-muted: #bcc3d8;         /* 10.1:1 on midnight */
        --fg-subtle: #9098b6;        /* 6.4:1 — AA ✓ */
        --border: color-mix(in oklab, white 10%, transparent);
        --border-strong: color-mix(in oklab, white 22%, transparent);
        --hairline: color-mix(in oklab, white 14%, transparent);
        --accent: #6ee7b7;           /* lighter in dark so the button pops */
        --accent-fg: #05261a;
        --accent-soft: color-mix(in oklab, #6ee7b7 15%, transparent);
        --ok: #6ee7b7;
        --warn: #fcd34d;
        --danger: #fca5a5;
        --info: #93c5fd;
        --code-bg: color-mix(in oklab, white 4%, transparent);
        --shadow-sm: 0 1px 2px color-mix(in oklab, black 40%, transparent);
        --shadow-md: 0 12px 40px -10px color-mix(in oklab, black 80%, transparent);

        /* Language tokens tuned for midnight — lightened for legibility */
        --lang-typescript: #5aa8e8;
        --lang-javascript: #e8c95a;
        --lang-python:     #5e9ed1;
        --lang-react:      #5abbdb;
        --lang-json:       #a0a7b4;
        --lang-yaml:       #e8656b;
        --lang-toml:       #d78260;
        --lang-markdown:   #7fa8ff;
        --lang-html:       #e48855;
        --lang-css:        #5eabd9;
        --lang-folder:     #7fa8ff;

        /* Warm backdrop blobs — brighter to glow against midnight */
        --blob-a-start: #ff7acc;
        --blob-a-mid:   #ffa366;
        --blob-a-end:   #ffe58a;
        --blob-b-start: #ff5e5e;
        --blob-b-mid:   #ff8ac8;
        --blob-b-end:   #b794ff;
        --blob-opacity: 0.28;
        --blob-blur: 120px;
      }

      /* ---- Typography system -------------------------------------------
         Three roles:
         1. DISPLAY (Urbanist)   — headings, product name, chips, tabs,
                                   stat numbers, button labels. Geometric,
                                   slightly futuristic, reads modern & bold.
         2. BODY (Inter)         — paragraphs, descriptions, any dense prose.
                                   Optimized for UI + long-form legibility.
         3. MONO (JetBrains Mono)— file paths, line numbers, tabular data.
         Both SIL Open Font License — free for commercial use.                */
      :root {
        --font-display: 'Urbanist', system-ui, -apple-system, sans-serif;
        --font-body:    'Inter',    system-ui, -apple-system, sans-serif;
        --font-mono:    'JetBrains Mono', ui-monospace, 'SFMono-Regular', monospace;
        --font-serif:   'Fraunces', 'Times New Roman', Georgia, serif;
      }
      /* Body-font opt-in via [data-body-font="..."]. Google Sans's stack falls
         through to system-ui if the family fails to load (which it will on
         non-Google origins). */
      :root[data-body-font='google-sans'] {
        --font-body: 'Google Sans', 'Google Sans Display', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }

      html,
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-feature-settings: 'cv11' 1, 'ss01' 1, 'ss03' 1;   /* Inter stylistic sets */
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        min-height: 100dvh;
        overflow: hidden;
      }
      code, pre, .mono { font-family: var(--font-mono); font-feature-settings: 'ss02' 1; }

      /* Display font for prominent UI surfaces. Urbanist is wider than Inter,
         so tighten tracking slightly for optical balance. */
      h1, h2, h3, h4, h5, h6,
      .font-display,
      .tab,
      .chip,
      #project-name,
      header [role="banner"] button,
      .node-pill {
        font-family: var(--font-display);
        letter-spacing: -0.012em;
      }
      h1 { letter-spacing: -0.022em; font-weight: 700; }
      h2 { letter-spacing: -0.018em; font-weight: 600; }

      /* Paragraph + dense-info readability. Keep lines short, generous
         leading, avoid hyper-condensed tracking. */
      p, .prose, .file-info, .cap-sub, .entry-sub {
        font-family: var(--font-body);
        line-height: 1.65;
        letter-spacing: -0.003em;
        font-weight: 400;
      }
      p { max-width: 68ch; }
      p.lead { font-size: 1.0625rem; line-height: 1.6; }

      /* Chips + badges sit better at medium weight + slight uppercase
         rhythm for the futuristic register without being shouty. */
      .chip { font-weight: 500; letter-spacing: 0.02em; }

      /* Numeric displays — Urbanist handles digits; add tabular figures
         so values don't jitter when they change. */
      .num, .mono, .font-display { font-variant-numeric: tabular-nums; }

      /* ================================================================== */
      /* Backdrop — two large gradient washes drifting on a non-repeating    */
      /* multi-frequency sine field, driven by JS (see #backdrop animator).  */
      /* White (light) or midnight (dark) dominates. Blobs are soft at 100px */
      /* blur + ~0.18 opacity so the base color breathes through.            */
      /* ================================================================== */
      #backdrop {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
        background: var(--bg);
        isolation: isolate;
      }
      .blob {
        position: absolute;
        filter: blur(var(--blob-blur)) saturate(1.2);
        opacity: var(--blob-opacity);
        will-change: transform, border-radius;
        transform-origin: center;
      }

      .blob-a {
        width: 72rem;
        height: 68rem;
        left: -18rem;
        top: 8rem;
        background: linear-gradient(135deg, var(--blob-a-start), var(--blob-a-mid), var(--blob-a-end));
        border-radius: 38% 62% 55% 45% / 44% 39% 61% 56%;
      }
      .blob-b {
        width: 92rem;
        height: 64rem;
        right: -26rem;
        top: -8rem;
        background: linear-gradient(145deg, var(--blob-b-start), var(--blob-b-mid), var(--blob-b-end));
        border-radius: 59% 41% 47% 53% / 39% 57% 43% 61%;
      }
      .blob-c {
        width: 56rem;
        height: 60rem;
        left: 32vw;
        top: 40vh;
        background: linear-gradient(200deg, var(--blob-a-end), var(--blob-b-start), var(--blob-b-end));
        border-radius: 52% 48% 58% 42% / 48% 52% 42% 58%;
      }

      @media (prefers-reduced-motion: reduce) {
        .blob { transform: none !important; }
      }

      /* ================================================================== */
      /* Liquid glass                                                        */
      /* backdrop-filter: blur(8px) — enough diffusion that mixed watercolor */
      /* zones read as soft light rather than sharp edges, but colors still  */
      /* come through. Lower-alpha surface keeps the watercolor visible.     */
      /* ================================================================== */
      @layer components {
        .glass {
          background: rgba(var(--surface-glass-rgb), var(--surface-glass-alpha));
          backdrop-filter: blur(8px) saturate(1.9) contrast(1.03);
          -webkit-backdrop-filter: blur(8px) saturate(1.9) contrast(1.03);
          box-shadow: var(--glass-meniscus), var(--shadow-sm);
          border: 1px solid var(--border);
          contain: paint;
        }
        .glass-strong {
          background: rgba(var(--surface-glass-rgb), calc(var(--surface-glass-alpha) + 0.24));
          backdrop-filter: blur(14px) saturate(1.7);
          -webkit-backdrop-filter: blur(14px) saturate(1.7);
          box-shadow: var(--glass-meniscus), var(--shadow-sm);
          border: 1px solid var(--border);
          contain: paint;
        }
        /* Flat content surface — replaces .glass on non-chrome cards.
           No backdrop-filter (audit: glass used decoratively on 25 surfaces),
           just a subtle off-white panel with a hairline border. Cheap,
           deterministic contrast, doesn't stack blur cost. */
        .surface {
          background: var(--surface-1);
          border: 1px solid var(--border);
          box-shadow: var(--shadow-sm);
        }

        .glass.sweep { position: relative; }
        .glass.sweep::after {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: linear-gradient(115deg, transparent 0%, rgba(255,255,255,0.08) 40%, transparent 80%);
          translate: -100% 0;
          transition: translate 400ms linear;
          border-radius: inherit;
        }
        .glass.sweep:hover::after { translate: 100% 0; }

        @supports not (backdrop-filter: blur(1px)) {
          .glass, .glass-strong {
            background: rgba(var(--surface-1-rgb), 0.92);
            backdrop-filter: none;
          }
        }
      }

      @media (prefers-reduced-transparency: reduce) {
        .glass, .glass-strong {
          background: var(--surface-1);
          backdrop-filter: none !important;
        }
      }

      /* ================================================================== */
      /* Chips                                                               */
      /* ================================================================== */
      .chip { display: inline-flex; align-items: center; gap: 0.25rem; padding: 0.125rem 0.5rem; border-radius: 999px; font-size: 0.6875rem; font-weight: 500; line-height: 1.2; letter-spacing: 0.01em; border: 1px solid transparent; white-space: nowrap; }
      .chip-ok { background: color-mix(in oklab, var(--ok) 18%, transparent); color: var(--ok); border-color: color-mix(in oklab, var(--ok) 35%, transparent); }
      .chip-warn { background: color-mix(in oklab, var(--warn) 18%, transparent); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); }
      .chip-danger { background: color-mix(in oklab, var(--danger) 18%, transparent); color: var(--danger); border-color: color-mix(in oklab, var(--danger) 35%, transparent); }
      .chip-info { background: color-mix(in oklab, var(--info) 18%, transparent); color: var(--info); border-color: color-mix(in oklab, var(--info) 35%, transparent); }
      .chip-muted { background: var(--surface-3); color: var(--fg-muted); border-color: var(--border); }

      /* Focus ring via double box-shadow: paints INSIDE the element's bounds,
         so it survives ancestors with `contain: paint` (e.g., .glass chrome).
         The inner ring is the accent; the outer ring is the page bg, so the
         focus indicator reads on any backdrop blob color. */
      :focus-visible {
        outline: none;
        box-shadow:
          0 0 0 2px var(--bg),
          0 0 0 4px var(--accent);
        border-radius: 6px;
      }
      /* Inputs/sliders keep their native look but get a matching ring */
      input:focus-visible { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }

      /* Touch target minimum: 44px for WCAG 2.5.5 AAA. Achieved via min-height
         + padding so visual density is preserved. Applies to global + local
         tabs, the LHS view-mode toggle, and icon buttons. */
      .tab { min-height: 44px; display: inline-flex; align-items: center; }
      header button,
      [role="tab"],
      [role="radio"] { min-height: 44px; }
      /* Icon-only chrome buttons get 40x40 minimum (AA 2.2) */
      header button[aria-label]:not([class*="px-"]) { min-width: 40px; min-height: 40px; }

      /* Skip-to-content link — visible only on focus, top-left landing */
      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1000;
        padding: 8px 14px;
        background: var(--fg);
        color: var(--bg);
        border-radius: 6px;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 0.8125rem;
        transform: translateY(-200%);
        transition: transform 160ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .skip-link:focus { transform: translateY(0); }

      /* ================================================================== */
      /* View Transitions                                                    */
      /* ================================================================== */
      ::view-transition-old(root), ::view-transition-new(root) { animation-duration: 360ms; animation-timing-function: cubic-bezier(0.2,0,0,1); }
      @keyframes ft-fade-out { to { opacity: 0; } }
      @keyframes ft-fade-in { from { opacity: 0; } }
      ::view-transition-old(root) { animation-name: ft-fade-out; }
      ::view-transition-new(root) { animation-name: ft-fade-in; }
      html.theme-swap ::view-transition-new(root) {
        clip-path: circle(0% at var(--theme-x, 100%) var(--theme-y, 0%));
        animation: ft-circle-reveal 420ms cubic-bezier(0.2,0,0,1) forwards, ft-fade-in 360ms forwards;
      }
      @keyframes ft-circle-reveal { to { clip-path: circle(160% at var(--theme-x, 100%) var(--theme-y, 0%)); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        ::view-transition-old(root), ::view-transition-new(root) { animation: none !important; }
      }

      /* ================================================================== */
      /* Tree                                                                */
      /* ================================================================== */
      .tree-row { display: grid; grid-template-columns: 1rem 1rem 1fr auto; align-items: center; gap: 0.375rem; padding: 0.25rem 0.5rem; border-radius: 6px; font-size: 0.8125rem; color: var(--fg); transition: background 120ms, color 120ms; cursor: pointer; }
      .tree-row:hover { background: color-mix(in oklab, var(--accent) 10%, transparent); }
      .tree-row[aria-selected='true'] { background: color-mix(in oklab, var(--accent) 20%, transparent); color: var(--fg); font-weight: 500; }
      .tree-chev { color: var(--fg-subtle); transition: transform 150ms; }
      .tree-node[aria-expanded='false'] > .tree-row .tree-chev { transform: rotate(-90deg); }
      .tree-node[aria-expanded='false'] > .tree-children { display: none; }
      .tree-children { padding-left: 0.875rem; border-left: 1px dashed var(--border); margin-left: 0.75rem; }

      /* ================================================================== */
      /* Tabs                                                                */
      /* ================================================================== */
      .tab { position: relative; padding: 0.4375rem 0.75rem; border-radius: 6px; font-size: 0.8125rem; color: var(--fg-muted); transition: color 150ms, background 150ms; white-space: nowrap; cursor: pointer; }
      .tab:hover { color: var(--fg); background: var(--surface-3); }
      .tab:active { background: color-mix(in oklab, var(--accent) 14%, transparent); }
      .tab[aria-selected='true'] { color: var(--fg); font-weight: 500; }
      .tab[aria-selected='true']::after { content: ''; position: absolute; left: 0.75rem; right: 0.75rem; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }

      /* Icicle hover states — brighten the hovered cell, dim the rest. */
      .ice-node .ice-bg { transition: fill-opacity 140ms ease-out, stroke-width 140ms ease-out; }
      .ice-node.is-hover .ice-bg { fill-opacity: 0.28; stroke-width: 2; }
      .ice-node { transition: opacity 140ms ease-out; }
      .ice-node.is-dim { opacity: 0.45; }
      .ice-node[data-path=""] { cursor: default; }
      @media (prefers-reduced-motion: reduce) {
        .ice-node, .ice-node .ice-bg { transition: none; }
      }

      /* Soft panel crossfade in place of View Transitions for tab switches */
      .tab-panel { animation: panel-in 180ms cubic-bezier(0.2, 0, 0, 1); }
      @keyframes panel-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
      @media (prefers-reduced-motion: reduce) { .tab-panel { animation: none; } }

      /* ---- Editorial type system ---------------------------------------
         The Overview reads like an analyst brief: serif display head, prose
         that weaves numbers inline, data anchored to sentences. Replaces the
         hero-metric + card-grid template flagged by the audit.                */
      .ed-head {
        font-family: var(--font-serif);
        font-weight: 600;
        font-optical-sizing: auto;
        font-variation-settings: 'opsz' 72, 'SOFT' 50, 'WONK' 0;
        letter-spacing: -0.025em;
        line-height: 1.04;
        color: var(--fg);
      }
      .ed-dek {
        font-family: var(--font-serif);
        font-weight: 400;
        font-style: italic;
        font-variation-settings: 'opsz' 36;
        letter-spacing: -0.005em;
        color: var(--fg-muted);
      }
      .ed-dateline {
        font-family: var(--font-mono);
        font-size: 0.6875rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--fg-subtle);
      }
      .ed-prose { color: var(--fg-muted); line-height: 1.7; max-width: 62ch; }
      .ed-prose strong { color: var(--fg); font-weight: 600; }
      .ed-prose .num {
        font-family: var(--font-display);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--fg);
      }
      .ed-rule { border: 0; height: 1px; background: var(--hairline); margin: 0; }
      .ed-rule-thick { border: 0; height: 2px; background: var(--fg); margin: 0; width: 48px; }
      .ed-label {
        font-family: var(--font-display);
        font-size: 0.6875rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--fg-subtle);
      }

      /* ---- Staggered entrance for Overview sections ---------------------- */
      .stagger > * {
        opacity: 0;
        transform: translateY(8px);
        animation: stagger-in 600ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      .stagger > *:nth-child(1) { animation-delay: 40ms; }
      .stagger > *:nth-child(2) { animation-delay: 120ms; }
      .stagger > *:nth-child(3) { animation-delay: 200ms; }
      .stagger > *:nth-child(4) { animation-delay: 280ms; }
      .stagger > *:nth-child(5) { animation-delay: 360ms; }
      .stagger > *:nth-child(6) { animation-delay: 440ms; }
      .stagger > *:nth-child(n+7) { animation-delay: 520ms; }
      @keyframes stagger-in {
        to { opacity: 1; transform: translateY(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        .stagger > * { opacity: 1; transform: none; animation: none; }
      }

      /* ---- Footer parse-clean dot: ambient pulse ------------------------- */
      .dot-pulse { position: relative; }
      .dot-pulse::after {
        content: '';
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: inherit;
        animation: dot-pulse 2.4s ease-out infinite;
        pointer-events: none;
      }
      @keyframes dot-pulse {
        0%   { transform: scale(1);   opacity: 0.9; }
        70%  { transform: scale(3);   opacity: 0; }
        100% { transform: scale(3);   opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .dot-pulse::after { animation: none; display: none; } }

      /* ---- Stacked distribution bar (replaces Stack card grid) ----------- */
      .dist-bar {
        display: flex;
        height: 10px;
        width: 100%;
        border-radius: 6px;
        overflow: hidden;
        background: var(--surface-3);

        display: block;
        height: 100%;
        transition: opacity 150ms;
      }
      .dist-legend { display: grid; grid-template-columns: 1fr; gap: 0.5rem; }
      @container (min-width: 520px) { .dist-legend { grid-template-columns: 1fr 1fr; } }
      .dist-legend-row { display: flex; align-items: baseline; gap: 0.625rem; font-size: 0.8125rem; }
      .dist-legend-row .dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; transform: translateY(1px); }
      .dist-legend-row .nm { font-weight: 500; color: var(--fg); }
      .dist-legend-row .mt { color: var(--fg-subtle); margin-left: auto; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

      @media (max-width: 899px) {

          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          <span class="hidden md:inline">Open</span>
        </button>

        <!-- Font-size slider -->
        <details class="relative">
          <summary class="list-none rounded-md p-1.5 hover:bg-[var(--surface-2)] cursor-pointer" aria-label="Font size">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          </summary>
          <div class="glass-strong absolute right-0 top-full mt-2 w-64 p-3 rounded-lg">
            <div class="text-xs font-medium mb-2">Font size</div>
            <input id="font-slider" type="range" min="0.85" max="1.35" step="0.05" value="1" class="w-full accent-[var(--accent)]" aria-label="Font size multiplier"/>
            <div class="flex justify-between text-[0.625rem] text-[var(--fg-subtle)] mt-1"><span>Compact</span><span>Default</span><span>Large</span><span>XL</span></div>
          </div>
        </details>

        <button id="theme-toggle" class="rounded-md p-1.5 hover:bg-[var(--surface-2)]" aria-label="Toggle theme" title="Theme · ⌘J">
          <svg id="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg id="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>

        <button id="reanalyze" class="h-8 rounded-md px-3 text-xs font-medium bg-[var(--accent)] text-[var(--accent-fg)] hover:opacity-90 flex items-center gap-1.5 whitespace-nowrap" aria-label="Re-analyze project">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/></svg>
          <span class="hidden sm:inline">Re-analyze</span>
        </button>
      </div>
    </header>

    <!-- ============================================================== -->
    <!-- Main layout                                                     -->
    <!-- ============================================================== -->
    <main class="fixed left-0 right-0 flex" style="top: 56px; bottom: 28px;" id="main-layout">
      <aside id="lhs-panel" class="glass h-full overflow-hidden flex flex-col" style="width: clamp(18rem, 22dvw, 25rem); border-radius: 0; border-right: 1px solid var(--border);" aria-label="Project tree">
        <div class="px-3 py-2.5 border-b border-[var(--border)]">
          <div class="flex items-center justify-between text-[0.6875rem] text-[var(--fg-subtle)]">
            <span id="project-name" class="mono truncate">…</span>
            <span id="file-count-chip" class="chip chip-muted">0 files</span>
          </div>
        </div>

        <nav id="tree" class="flex-1 overflow-y-auto p-2 space-y-0.5" role="tree" aria-label="Project file tree"></nav>

        <!-- LHS summary — bundle size + context-fit chip only. Token count
             moved to the Overview's editorial lead paragraph (audit M1). -->
        <div class="p-2.5 border-t border-[var(--border)] text-[0.6875rem] space-y-1 text-[var(--fg-subtle)]">
          <div class="flex justify-between"><span>Bundle (gzip)</span><span id="bundle-size" class="mono">…</span></div>
          <div class="flex items-center justify-between"><span>Fits 200K context?</span><span id="fits-context" class="chip chip-muted">…</span></div>
        </div>
      </aside>

      <div id="lhs-scrim" aria-hidden="true"></div>

      <section class="flex-1 min-w-0 flex flex-col overflow-hidden" role="main">
        <div class="glass h-11 flex items-center gap-0.5 px-3" style="border-radius: 0; border-bottom: 1px solid var(--border);" role="tablist" aria-label="File view">
          <button class="tab" role="tab" aria-selected="true"  data-local-tab="outline">Outline</button>
          <button class="tab" role="tab" aria-selected="false" data-local-tab="preview">Preview</button>
          <button class="tab" role="tab" aria-selected="false" data-local-tab="imports">Imports</button>
          <button class="tab" role="tab" aria-selected="false" data-local-tab="callers">Callers</button>
          <button class="tab" role="tab" aria-selected="false" data-local-tab="todos">TODOs <span id="local-todos-chip" class="chip chip-warn ml-1">0</span></button>
          <button class="tab" role="tab" aria-selected="false" data-local-tab="tests">Tests</button>
        </div>

        <div class="flex-1 overflow-y-auto" id="rhs-content">
          <div class="tab-panel content-cap p-5 sm:p-8 max-w-5xl mx-auto" data-panel="overview" id="panel-overview">
            <!-- Injected by render() -->
          </div>
          <div class="tab-panel hidden content-cap p-5 sm:p-8 max-w-5xl mx-auto" data-panel="graph" id="panel-graph"></div>
          <div class="tab-panel hidden p-5 sm:p-6" data-panel="files" id="panel-files"></div>
          <div class="tab-panel hidden p-5 sm:p-8 content-cap max-w-4xl mx-auto" data-panel="routes" id="panel-routes"></div>
          <div class="tab-panel hidden p-5 sm:p-8 content-cap max-w-4xl mx-auto" data-panel="risks" id="panel-risks"></div>
          <div class="tab-panel hidden p-5 sm:p-8 content-cap max-w-4xl mx-auto" data-panel="history" id="panel-history"></div>
          <div class="tab-panel hidden p-5 sm:p-8 content-cap max-w-4xl mx-auto" data-panel="config" id="panel-config"></div>
        </div>
      </section>
    </main>

    <footer class="glass fixed bottom-0 left-0 right-0 h-7 flex items-center gap-4 px-3 text-[0.6875rem] text-[var(--fg-muted)]" style="border-radius: 0; border-top: 1px solid var(--border);" role="contentinfo">
      <span class="flex items-center gap-1.5"><span class="dot-pulse w-1.5 h-1.5 rounded-full bg-[var(--ok)]"></span>parse: clean</span>
      <span id="analyzed-at" class="hidden sm:inline">analyzed just now</span>
      <span class="hidden md:inline mono" id="status-root">loading…</span>
      <span class="flex-1 text-right truncate" id="status-health">
        <span class="text-[var(--fg-muted)]">loading…</span>
      </span>
    </footer>

    <!-- ============================================================== -->
    <!-- Scripts                                                         -->
    <!-- ============================================================== -->
    <script type="module">
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const h = (tag, attrs = {}, ...kids) => {
        const el = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v == null) continue;
          if (k === 'class') el.className = v;
          else if (k === 'html') el.innerHTML = v;
          else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
          else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
          else if (k in el && typeof v !== 'string') el[k] = v;
          else el.setAttribute(k, v);
        }
        for (const kid of kids.flat()) {
          if (kid == null) continue;
          el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
        }
        return el;
      };
      const fmtBytes = (n) => (n >= 1024 * 1024 ? (n / 1048576).toFixed(1) + ' MB' : n >= 1024 ? (n / 1024).toFixed(1) + ' KB' : n + ' B');
      const fmtTok = (n) => (n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n));

      // ============================ DATA ==================================
      let DATA = null;
      let SELECTED_FILE = null;
      let LOCAL_TAB = 'outline'; // active local tab inside the Files pane

      async function loadDefault() {
        // Try the inline dataset first (standalone-friendly), then fall back
        // to fetch. This makes the file open via file:// without issues.
        const inline = document.getElementById('factstack-data');
        if (inline && inline.textContent && !inline.textContent.includes('__INLINE_FACTSTACK_JSON__')) {
          try {
            DATA = JSON.parse(inline.textContent);
            return;
          } catch (e) { console.warn('inline dataset parse failed, falling back', e); }
        }
        try {
          const res = await fetch('./data/factstack.json');
          DATA = await res.json();
        } catch (e) {
          console.error('failed to load default dataset', e);
          DATA = emptyDataset('no data loaded');
        }
      }

      function emptyDataset(msg) {
        return {
          project: { name: msg, root: '', languages: [], frameworks: [] },
          summary: { oneLiner: msg, description: '', capabilities: [], health: { broken: 0, stale: 0, todos: 0, secrets: 0 } },
          stats: { files: 0, loc: 0, size: 0, gzip: 0, tokens: 0 },
          tree: { files: [], children: [] },
          entryPoints: [], risks: [],
        };
      }

      // ============================ TREE ==================================
      function langIconSvg(color, tag) {
        return `<svg width="14" height="14" viewBox="0 0 16 16" fill="${color}" aria-hidden="true"><rect x="1" y="2" width="14" height="12" rx="1.5"/></svg>
          <span style="position:absolute; font-size:7px; font-weight:600; color:white; text-align:center; width:14px; margin-left:-14px; line-height:14px;">${tag}</span>`;
      }
      function folderIcon() {
        return `<svg width="14" height="14" viewBox="0 0 16 16" fill="#60a5fa" aria-hidden="true"><path d="M1.5 3a1 1 0 011-1h3.086a1 1 0 01.707.293l1.414 1.414a1 1 0 00.707.293H13.5a1 1 0 011 1v7.5a1 1 0 01-1 1h-12a1 1 0 01-1-1V3z"/></svg>`;
      }
      function chevron() {
        return `<svg class="tree-chev" width="10" height="10" viewBox="0 0 10 10"><path d="M2 3l3 4 3-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      }

      // Path → file lookup used by the delegated click handler below.
      const FILES_BY_PATH = new Map();
      function indexFiles(node) {
        FILES_BY_PATH.clear();
        (function walk(n) {
          for (const f of n.files || []) FILES_BY_PATH.set(f.path, f);
          for (const c of n.children || []) walk(c);
        })(node);
      }

      function renderTree(container, node, depth = 0) {
        const childCount = (node.children?.length || 0) + (node.files?.length || 0);
        const folders = (node.children || []).map((c, i) => {
          const wrap = h('div', {
            class: 'tree-node',
            role: 'treeitem',
            'aria-expanded': depth < 2 ? 'true' : 'false',
            'aria-level': String(depth + 1),
            'aria-posinset': String(i + 1),
            'aria-setsize': String(childCount),
            'data-kind': 'folder',
            'data-path': c.path,
          });
          const totalLoc = c.rollup?.loc || 0;
          const row = h('div', { class: 'tree-row', 'data-kind': 'folder', 'data-path': c.path });
          row.innerHTML = `${chevron()}${folderIcon()}<span class="truncate">${c.name}</span><span class="chip chip-muted">${fmtTok(totalLoc)}</span>`;
          wrap.append(row);
          const kids = h('div', { class: 'tree-children' });
          renderTree(kids, c, depth + 1);
          wrap.append(kids);
          return wrap;
        });
        const folderN = folders.length;
        const files = (node.files || []).map((f, i) => {
          const wrap = h('div', {
            class: 'tree-node',
            role: 'treeitem',
            'aria-level': String(depth + 1),
            'aria-posinset': String(folderN + i + 1),
            'aria-setsize': String(childCount),
            'data-kind': 'file',
            'data-path': f.path,
          });
          const statusChip = f.status === 'broken' ? '<span class="chip chip-danger">broken</span>' : f.status === 'stale' ? '<span class="chip chip-warn">stale</span>' : '<span class="chip chip-ok">ok</span>';
          const langTag = f.language?.tag || f.ext?.replace('.', '').toUpperCase().slice(0, 4) || '···';
          // Prefer the design-system --lang-* token; fall back to the data's
          // iconColor only if no token exists for this language id.
          const langId = f.language?.id;
          const langColor = langId ? `var(--lang-${langId}, ${f.language?.iconColor || 'var(--fg-muted)'})` : (f.language?.iconColor || 'var(--fg-muted)');
          const row = h('div', { class: 'tree-row', 'data-kind': 'file', 'data-path': f.path });
          row.innerHTML = `<span></span><span class="mono text-[10px] font-semibold" style="color:${langColor};">${langTag}</span><span class="truncate">${f.name}</span>${statusChip}`;
          wrap.append(row);
          return wrap;
        });
        container.append(...folders, ...files);
      }

      function selectFile(f) {
        SELECTED_FILE = f;
        $$('#tree .tree-row').forEach((r) => r.removeAttribute('aria-selected'));
        const match = document.querySelector(`#tree .tree-row[data-path="${CSS.escape(f.path)}"]`);
        if (match) match.setAttribute('aria-selected', 'true');
        renderFiles();
        activateTab('files');
      }

      function toggleFolder(path) {
        const node = document.querySelector(`#tree .tree-node[data-kind="folder"][data-path="${CSS.escape(path)}"]`);
        if (!node) return;
        const ex = node.getAttribute('aria-expanded') === 'true';
        node.setAttribute('aria-expanded', String(!ex));
      }

      // ============================ PANELS ================================
      // Overview rewritten as an editorial brief.
      //
      // Direction: the Overview reads like an analyst's one-pager, not a
      // dashboard. Serif display head, prose that weaves numbers inline, a
      // single horizontal stacked bar for distribution, hairline rules as
      // section breaks. No card grid. No hero-metric template. Every fact
      // lives in a sentence where possible.
      function renderOverview() {
        const d = DATA;
        const p = $('#panel-overview');
        p.innerHTML = '';
        const sum = d.summary;
        const langs = (d.project.languages || []).slice(0, 8);
        const fw = d.project.frameworks || [];
        const health = sum.health || {};
        const totalTokens = d.stats?.tokens || 0;
        const fitsCtx = totalTokens < 200_000;
        const fitsPct = Math.min(100, Math.round((totalTokens / 200_000) * 100));
        const rootLabel = (d.project?.root || d.project?.name || '').replace(/\\/g, '/');

        // Natural-language TODO hotspot: which folder owns the most?
        const folderTodos = (d.tree?.children || [])
          .map((c) => ({ name: c.name, n: c.rollup?.todos || 0 }))
          .filter((x) => x.n > 0)
          .sort((a, b) => b.n - a.n);
        const hotspot = folderTodos[0];

        // Dominant language line
        const dom = langs[0];
        const domPct = dom ? Math.round(((dom.tokens || 0) / (totalTokens || 1)) * 100) : 0;

        // Build the editorial column
        const col = h('article', { class: 'stagger max-w-[64rem] mx-auto', style: { paddingBottom: '4rem' } });

        // 1. DATELINE
        const dateline = h('div', { class: 'ed-dateline flex items-center gap-3 mb-6' });
        dateline.innerHTML = `
          <span>FACTS · analysis · ${d.generatedAt ? escapeHtml(relTime(d.generatedAt)) : 'now'}</span>
          <span aria-hidden="true" style="flex:1;height:1px;background:var(--hairline)"></span>
          <span class="mono truncate" style="font-family:var(--font-mono);letter-spacing:0;text-transform:none;font-size:0.6875rem">${escapeHtml(rootLabel)}</span>
        `;
        col.append(dateline);

        // 2. DISPLAY HEAD + DEK
        const heading = h('h1', { class: 'ed-head', style: { fontSize: 'clamp(2.25rem, 4.5vw, 3.75rem)', marginBottom: '0.75rem' } }, sum.oneLiner || d.project.name);
        col.append(heading);

        const dek = h('p', { class: 'ed-dek', style: { fontSize: 'clamp(1.125rem, 1.8vw, 1.375rem)', maxWidth: '52ch', marginBottom: '2.5rem' } }, sum.description || '');
        col.append(dek);

        // 3. THICK RULE — editorial convention for "brief starts here"
        col.append(h('hr', { class: 'ed-rule-thick', style: { marginBottom: '2rem' } }));

        // 4. LEAD PARAGRAPH — prose with data inline (replaces hero-metric)
        const lead = h('p', { class: 'ed-prose', style: { fontSize: '1.0625rem', marginBottom: '1.5rem' } });
        lead.innerHTML = `
          The codebase is <span class="num">${fmtTok(totalTokens)}</span> tokens across <span class="num">${d.stats.files}</span> files, ${fitsCtx ? `fitting comfortably within a <span class="num">200K</span> agent context (${fitsPct}% full)` : `<strong>too large for a 200K agent context</strong> — consider scoping analyses to subdirectories`}.
          ${dom ? `Roughly <span class="num">${domPct}%</span> of that budget lives in <strong>${escapeHtml(dom.label)}</strong>, with ${langs.length > 1 ? `<strong>${escapeHtml(langs[1].label)}</strong> and <strong>${escapeHtml(langs[2]?.label || langs[1].label)}</strong> covering most of the remainder.` : ''}` : ''}
        `;
        col.append(lead);

        // 5. HEALTH SENTENCE — replaces the hero-metric block
        const healthSentence = h('p', { class: 'ed-prose', style: { fontSize: '1.0625rem', marginBottom: '2.5rem' } });
        const verdict = (() => {
          const parts = [];
          if (health.broken) parts.push(`<strong style="color:var(--danger)">${health.broken} broken file${health.broken === 1 ? '' : 's'}</strong>`);
          if (health.stale)  parts.push(`<strong style="color:var(--warn)">${health.stale} stale file${health.stale === 1 ? '' : 's'}</strong>`);
          if (health.secrets) parts.push(`<strong style="color:var(--danger)">${health.secrets} exposed secret${health.secrets === 1 ? '' : 's'}</strong>`);
          return parts;
        })();
        if (verdict.length === 0) {
          healthSentence.innerHTML = `
            Health is <strong style="color:var(--accent)">clean</strong>: no broken files, no stale code, no secrets detected.
            ${health.todos ? `Developers have left <span class="num">${health.todos}</span> TODO/FIXME comments${hotspot ? `, concentrated in <strong>${escapeHtml(hotspot.name)}/</strong> (<span class="num">${hotspot.n}</span>)` : ''}.` : ''}
          `;
        } else {
          healthSentence.innerHTML = `
            Needs attention: ${verdict.join(', ')}.
            ${health.todos ? `Additionally <span class="num">${health.todos}</span> TODO/FIXME comments${hotspot ? ` cluster in <strong>${escapeHtml(hotspot.name)}/</strong>` : ''}.` : ''}
          `;
        }
        col.append(healthSentence);

        // 6. HAIRLINE
        col.append(h('hr', { class: 'ed-rule', style: { marginBottom: '2.5rem' } }));

        // 7. CAPABILITIES — as a single continuous paragraph rather than card grid
        if (sum.capabilities?.length) {
          col.append(h('div', { class: 'ed-label', style: { marginBottom: '0.75rem' } }, 'What it does'));
          const caps = h('p', { class: 'ed-prose', style: { fontSize: '1rem', marginBottom: '2.5rem' } });
          caps.innerHTML = sum.capabilities
            .map((c) => `<strong>${escapeHtml(c.head)}</strong>${c.sub ? ` (${escapeHtml(c.sub)})` : ''}`)
            .join(' · ')
            + '.';
          col.append(caps);
          col.append(h('hr', { class: 'ed-rule', style: { marginBottom: '2.5rem' } }));
        }

        // 8. STACK — single horizontal stacked bar + a compact two-column legend
        col.append(h('div', { class: 'ed-label', style: { marginBottom: '0.75rem' } }, 'Where the token budget goes'));
        const totalLang = langs.reduce((s, l) => s + (l.tokens || 0), 0) || 1;
        const bar = h('div', { class: 'dist-bar', style: { marginBottom: '1rem' } });
        const legend = h('div', { class: 'dist-legend', style: { containerType: 'inline-size', marginBottom: '1.75rem' } });
        const colorFor = (id) => `var(--lang-${id}, var(--fg-muted))`;
        langs.forEach((l) => {
          const pct = ((l.tokens || 0) / totalLang) * 100;
          const seg = document.createElement('span');
          seg.style.width = pct + '%';
          seg.style.background = colorFor(l.id);
          seg.title = `${l.label}: ${pct.toFixed(1)}%`;
          bar.append(seg);
        });
        langs.forEach((l) => {
          const pct = ((l.tokens || 0) / totalLang) * 100;
          const row = document.createElement('div');
          row.className = 'dist-legend-row';
          row.innerHTML = `
            <span class="dot" style="background:${colorFor(l.id)}"></span>
            <span class="nm">${escapeHtml(l.label)}</span>
            <span class="mt">${fmtTok(l.loc || 0)} LOC · ${fmtTok(l.tokens || 0)} tok · ${pct.toFixed(0)}%</span>
          `;
          legend.append(row);
        });
        col.append(bar);
        col.append(legend);

        if (fw.length) {
          const fwLine = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem', marginBottom: '2.5rem' } });
          fwLine.innerHTML = `Detected frameworks and tooling: ${fw.map((n) => `<strong>${escapeHtml(n)}</strong>`).join(', ')}.`;
          col.append(fwLine);
        }

        col.append(h('hr', { class: 'ed-rule', style: { marginBottom: '2.5rem' } }));

        // 9. ENTRY POINTS — simple list, no card wrapper
        if (d.entryPoints?.length) {
          col.append(h('div', { class: 'ed-label', style: { marginBottom: '0.75rem' } }, 'Entry points'));
          const list = h('div', { style: { marginBottom: '2.5rem' } });
          const inner = h('div', { class: 'divide-y divide-[var(--border)]' });
          for (const e of d.entryPoints) inner.append(renderEntryPoint(e));
          list.append(inner);
          col.append(list);
        }

        p.append(col);
      }

      function statBlock(n, label, color) {
        return h('div', {}, h('div', { class: 'text-2xl font-semibold', style: { color } }, String(n)), h('div', { class: 'text-[0.6875rem] text-[var(--fg-muted)] uppercase tracking-wider' }, label));
      }
      function statBlockSmall(v, label) {
        return h('div', {}, h('div', { class: 'text-xs text-[var(--fg-muted)]' }, label), h('div', { class: 'text-lg font-semibold mt-0.5 mono' }, v));
      }
      function sep() { return h('div', { class: 'w-px h-8 bg-[var(--border)]' }); }

      // --- Stack cards — professional card layout showing per-language
      //     LOC + token cost + file count + share-of-codebase bar, plus a
      //     grouped framework strip underneath.
      function renderStackCards(languages, frameworks, stats) {
        const wrap = h('div', { class: 'space-y-4' });
        const totalLoc = languages.reduce((s, l) => s + (l.loc || 0), 0) || 1;
        const totalTokens = languages.reduce((s, l) => s + (l.tokens || 0), 0) || 1;

        // Languages grid
        const grid = h('div', { class: 'grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3' });
        for (const l of languages.slice(0, 9)) {
          const card = h('div', { class: 'surface rounded-xl p-4 flex flex-col gap-3', 'data-lang': l.id });
          const pctLoc = Math.round(((l.loc || 0) / totalLoc) * 100);
          const pctTok = Math.round(((l.tokens || 0) / totalTokens) * 100);
          card.innerHTML = `
            <div class="flex items-center gap-2.5">
              <span style="width:10px;height:10px;border-radius:3px;background:${l.iconColor || '#94a3b8'};box-shadow:0 0 0 1px var(--border) inset"></span>
              <span class="text-sm font-semibold">${escapeHtml(l.label || l.id)}</span>
              <span class="chip chip-muted ml-auto">${l.files || 0} file${(l.files || 0) === 1 ? '' : 's'}</span>
            </div>
            <div class="flex items-baseline gap-4">
              <div>
                <div class="text-2xl font-semibold leading-tight mono">${fmtTok(l.loc || 0)}</div>
                <div class="text-[0.6875rem] text-[var(--fg-muted)] uppercase tracking-wider">LOC</div>
              </div>
              <div class="ml-auto text-right">
                <div class="text-sm font-medium mono">${fmtTok(l.tokens || 0)} tok</div>
                <div class="text-[0.6875rem] text-[var(--fg-muted)]">${pctTok}% of tokens</div>
              </div>
            </div>
            <div>
              <div class="flex items-center justify-between text-[0.6875rem] text-[var(--fg-muted)] mb-1">
                <span>Share of LOC</span><span class="mono">${pctLoc}%</span>
              </div>
              <div class="h-1.5 rounded-full bg-[var(--surface-3)] overflow-hidden">
                <div style="width:${Math.max(pctLoc, 2)}%;height:100%;background:${l.iconColor || 'var(--accent)'};border-radius:inherit;"></div>
              </div>
            </div>
          `;
          grid.append(card);
        }
        wrap.append(grid);

        // Frameworks strip
        if (frameworks?.length) {
          const fwCard = h('div', { class: 'surface rounded-xl p-4' });
          const chips = frameworks
            .map((name) => `<span class="node-pill" style="background: color-mix(in oklab, var(--info) 12%, transparent); border-color: color-mix(in oklab, var(--info) 30%, transparent); color: var(--fg)"><span class="w-1.5 h-1.5 rounded-full bg-[var(--info)]"></span>${escapeHtml(name)}</span>`)
            .join('');
          fwCard.innerHTML = `
            <div class="flex items-center gap-2 mb-3">
              <span class="text-xs font-semibold uppercase tracking-wider text-[var(--fg-subtle)]">Frameworks & Tooling</span>
              <span class="chip chip-muted">${frameworks.length}</span>
            </div>
            <div class="flex flex-wrap gap-2">${chips}</div>
          `;
          wrap.append(fwCard);
        }
        return wrap;
      }

      // --- Entry point row: show an Open indicator for web-openable targets
      //     and handle clicks by launching a new tab for the resolved URL.
      function entryPointUrl(e) {
        // Already a full URL
        if (/^https?:\/\//i.test(e.path)) return e.path;
        // localhost:PORT
        if (/^localhost:\d+/i.test(e.path)) return `http://${e.path}`;
        // host:port (bare)
        if (/^[a-z0-9.-]+:\d+/i.test(e.path)) return `http://${e.path}`;
        // HTTP route on this project's UI — could link to localhost:3000{path}
        if (e.kind === 'http-route' || e.kind === 'page') {
          if (e.path.startsWith('/')) return `http://localhost:3000${e.path.replace(/:\w+/g, 'example')}`;
        }
        return null;
      }
      function isEntryOpenable(e) {
        return !!entryPointUrl(e);
      }
      function renderEntryPoint(e) {
        const url = entryPointUrl(e);
        const openable = !!url;
        const kindLabel = (e.kind || 'entry').toUpperCase();
        const kindChipClass = e.kind === 'cli' || e.kind === 'cli-command' ? 'chip-warn' : openable ? 'chip-info' : 'chip-muted';
        const externalIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
        const terminalIcon = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>`;
        const indicator = openable
          ? `<span class="inline-flex items-center gap-1 text-[0.6875rem] text-[var(--accent)] font-medium whitespace-nowrap" title="Opens in a new tab">${externalIcon}<span class="hidden sm:inline">Open</span></span>`
          : `<span class="inline-flex items-center gap-1 text-[0.6875rem] text-[var(--fg-subtle)] whitespace-nowrap" title="Not openable in a browser — run in a terminal">${terminalIcon}<span class="hidden sm:inline">CLI</span></span>`;

        const row = h('a', {
          href: openable ? url : '#',
          target: openable ? '_blank' : undefined,
          rel: openable ? 'noopener noreferrer' : undefined,
          class: `flex items-center gap-3 p-3 transition-colors ${openable ? 'hover:bg-[var(--surface-3)] cursor-pointer' : 'cursor-default opacity-85'}`,
          'aria-disabled': openable ? undefined : 'true',
        });
        row.innerHTML = `
          <span class="chip ${kindChipClass} mono">${escapeHtml(kindLabel)}</span>
          <span class="mono text-sm flex-1 truncate" title="${escapeHtml(e.path)}">${escapeHtml(e.path)}</span>
          <span class="text-xs text-[var(--fg-muted)] truncate hidden md:inline" title="${escapeHtml(e.handlerFile || '')}">${escapeHtml(e.handlerFile || '')}</span>
          ${indicator}
        `;
        if (!openable) {
          row.addEventListener('click', (ev) => ev.preventDefault());
        }
        return row;
      }

      // Risks — editorial treatment. Each risk is a row separated by
      // hairline rules rather than wrapped in a card. Severity as a chip,
      // category small-caps, location in monospace, then the message as
      // body prose. Progressive disclosure via grouping by severity.
      function renderRisks() {
        const p = $('#panel-risks');
        p.innerHTML = '';
        const risks = DATA.risks || [];

        // Header — use the editorial type treatment
        const header = h('div', { class: 'max-w-[64rem] mx-auto', style: { marginBottom: '2rem' } });
        header.innerHTML = `
          <div class="ed-dateline" style="margin-bottom:0.75rem">RISKS &middot; ${risks.length} finding${risks.length === 1 ? '' : 's'}</div>
          <h1 class="ed-head" style="font-size:clamp(1.75rem, 3.2vw, 2.5rem);margin-bottom:0.5rem">
            ${risks.length === 0 ? 'Nothing to flag today.' : (risks.length === 1 ? 'One finding needs review.' : `${risks.length} findings need review.`)}
          </h1>
          <p class="ed-prose" style="font-size:1rem;max-width:60ch">
            ${risks.length === 0
              ? 'The scanner found no exposed secrets, unresolved imports, supply-chain warnings, stale files, or parse errors. Re-run after changes to refresh.'
              : 'Severity reflects the analyzer\u2019s confidence and the blast radius if the finding holds. Click a file reference to open the file pane.'}
          </p>
        `;
        p.append(header);

        if (!risks.length) return;

        // Group by severity for the editorial rhythm
        const sevOrder = { critical: 0, high: 1, medium: 2, low: 3, info: 4 };
        const byGroup = {};
        for (const r of risks) {
          const key = r.severity || 'info';
          (byGroup[key] ||= []).push(r);
        }
        const groups = Object.entries(byGroup).sort((a, b) => (sevOrder[a[0]] ?? 9) - (sevOrder[b[0]] ?? 9));

        const list = h('div', { class: 'max-w-[64rem] mx-auto' });
        for (const [sev, items] of groups) {
          list.append(h('hr', { class: 'ed-rule', style: { margin: '1.5rem 0 1rem' } }));
          const label = h('div', { style: { display: 'flex', alignItems: 'baseline', gap: '0.75rem', marginBottom: '0.75rem' } });
          label.innerHTML = `
            <span class="ed-label">${sev.toUpperCase()}</span>
            <span class="chip chip-${sevClass(sev)}">${items.length}</span>
          `;
          list.append(label);

          for (const r of items) {
            const row = h('div', { style: {
              display: 'grid',
              gridTemplateColumns: 'auto 1fr',
              columnGap: '1rem',
              rowGap: '0.25rem',
              padding: '0.875rem 0',
              borderTop: '1px solid var(--hairline)',
            } });
            const fileRef = r.file ? `${escapeHtml(r.file)}${r.line ? ':' + r.line : ''}` : '';
            row.innerHTML = `
              <span class="ed-label" style="font-size:0.625rem;align-self:start;padding-top:2px">${escapeHtml(r.category || '').toUpperCase()}</span>
              <div>
                <p class="ed-prose" style="font-size:0.9375rem;margin:0;max-width:62ch">${escapeHtml(r.message || '')}</p>
                ${fileRef ? `<p class="mono text-xs text-[var(--fg-subtle)]" style="margin-top:0.375rem">${fileRef}</p>` : ''}
              </div>
            `;
            list.append(row);
          }
        }
        p.append(list);
      }
      function sevClass(s) { return s === 'critical' || s === 'high' ? 'danger' : s === 'medium' ? 'warn' : s === 'low' ? 'muted' : 'info'; }

      function renderRoutes() {
        const p = $('#panel-routes');
        p.innerHTML = '';
        const routes = DATA.entryPoints || [];
        p.append(h('h1', { class: 'text-xl font-semibold mb-4' }, `Entry points (${routes.length})`));
        if (!routes.length) { p.append(h('div', { class: 'surface rounded-lg p-6 text-center text-[var(--fg-muted)]' }, 'No entry points detected.')); return; }
        const list = h('div', { class: 'surface rounded-lg overflow-hidden' });
        const inner = h('div', { class: 'divide-y divide-[var(--border)]' });
        for (const r of routes) inner.append(renderEntryPoint(r));
        list.append(inner);
        p.append(list);
      }

      // ----------------------------------------------------------------
      // Token-distribution icicle — sharp, high-fidelity, actually useful.
      //
      // Why an icicle instead of a force graph:
      //   • The prototype scanner does not extract real import edges, so a
      //     node-link "dependency graph" is fiction. An icicle shows exactly
      //     the data we HAVE — containment + token cost — and makes it
      //     useful: "where does our AI-context budget actually go?"
      //   • No glass wrapper → text stays crisp. No label collision → each
      //     cell is proportionally sized to its data, impossible-to-fit
      //     labels silently hide (hover tooltip shows full name).
      //   • Colour encodes depth, width encodes tokens. Hover lights up the
      //     ancestor chain. Click drills into Files.
      // ----------------------------------------------------------------
      function renderGraph() {
        const p = $('#panel-graph');
        p.innerHTML = '';

        // Header + one-line value prop
        p.append(h('h1', { class: 'text-xl font-semibold tracking-tight mb-1' }, 'Token distribution'));
        p.append(h('p', { class: 'text-sm text-[var(--fg-muted)] mb-5 max-w-2xl leading-relaxed' },
          'How your codebase’s AI-context budget is spread across folders and files. Wider cells cost a coding agent more tokens to read.'));

        // Narrow viewports can't read the icicle — collapse to a vertical
        // top-5 list with horizontal bars (same data, better legibility).
        if (window.matchMedia('(max-width: 639px)').matches) {
          renderGraphCompact(p);
          return;
        }

        // --- Build partition data (3 levels: root → top-level → nested) ---
        const topLevel = (DATA.tree?.children || []).map((c) => ({
          name: c.name,
          tokens: c.rollup?.tokens || 0,
          files: c.rollup?.files || 0,
          path: c.path,
          children: (c.children || []).map((sub) => ({
            name: sub.name,
            tokens: sub.rollup?.tokens || 0,
            files: sub.rollup?.files || 0,
            path: sub.path,
          })),
        }));
        // Include top-level files as virtual leaves under a "(root files)" bucket
        const rootFileTokens = (DATA.tree?.files || []).reduce((s, f) => s + (f.tokens || 0), 0);
        const rootFileCount  = (DATA.tree?.files || []).length;
        if (rootFileCount > 0) {
          topLevel.push({
            name: '(root files)', tokens: rootFileTokens, files: rootFileCount, path: '', children: [],
          });
        }
        // Sort top-level by token weight so the heavy hitters lead
        topLevel.sort((a, b) => b.tokens - a.tokens);
        const totalTokens = topLevel.reduce((s, c) => s + c.tokens, 0) || 1;

        // --- SVG geometry ---
        const VW = 1200;
        const ROW_H = 96, GAP_Y = 6, GAP_X = 4;
        const PAD_X = 16, PAD_Y = 16;
        const rows = 3;
        const VH = rows * ROW_H + (rows - 1) * GAP_Y + PAD_Y * 2 + 32 /* breadcrumb rail */;

        const svg = [];
        svg.push(`<svg viewBox="0 0 ${VW} ${VH}" preserveAspectRatio="xMidYMid meet" class="w-full block" style="max-height: 64dvh; min-height: 360px;" role="img" aria-label="Token distribution icicle chart">`);
        svg.push(`<defs>
          <clipPath id="ice-cell"><rect x="0" y="0" width="${VW}" height="${VH}"/></clipPath>
        </defs>`);

        // Crumb rail at the top — navigates where the hover is
        svg.push(`<g><text id="ice-crumb" x="${PAD_X}" y="22" fill="var(--fg-muted)" font-family="JetBrains Mono, monospace" font-size="12">Hover a cell to inspect · click a leaf to open its files</text></g>`);

        // Row 0 — workspace root
        const rootX = PAD_X, rootY = 32, rootW = VW - PAD_X * 2;
        svg.push(iceCell({
          x: rootX, y: rootY, w: rootW, h: ROW_H,
          name: DATA.project?.name || 'root',
          meta: `${fmtTok(totalTokens)} tok · ${DATA.stats?.files || 0} files · workspace root`,
          depth: 0, path: '', bigLabel: true,
        }));

        // Row 1 — top-level packages
        const r1Y = rootY + ROW_H + GAP_Y;
        let x = rootX;
        for (const n of topLevel) {
          const w = Math.max(1, (n.tokens / totalTokens) * rootW - GAP_X);
          svg.push(iceCell({
            x, y: r1Y, w, h: ROW_H,
            name: n.name,
            meta: `${fmtTok(n.tokens)} tok · ${n.files} file${n.files === 1 ? '' : 's'}`,
            depth: 1, path: n.path, sortableWidth: w,
          }));

          // Row 2 — nested folders within this top-level (if any)
          if (n.children && n.children.length) {
            const innerTotal = n.children.reduce((s, c) => s + c.tokens, 0) || 1;
            const r2Y = r1Y + ROW_H + GAP_Y;
            let x2 = x;
            n.children.sort((a, b) => b.tokens - a.tokens);
            for (const cc of n.children) {
              const w2 = Math.max(1, (cc.tokens / innerTotal) * w - GAP_X);
              svg.push(iceCell({
                x: x2, y: r2Y, w: w2, h: ROW_H,
                name: cc.name,
                meta: `${fmtTok(cc.tokens)} tok · ${cc.files} file${cc.files === 1 ? '' : 's'}`,
                depth: 2, path: cc.path, sortableWidth: w2,
              }));
              x2 += w2 + GAP_X;
            }
          }
          x += w + GAP_X;
        }

        svg.push('</svg>');

        // Wrap in a solid surface (NOT glass) so the SVG stays crisp.
        const wrap = h('div', {
          class: 'rounded-xl overflow-hidden',
          style: {
            background: 'var(--surface-1)',
            border: '1px solid var(--border)',
            boxShadow: 'var(--shadow-sm)',
            padding: '4px',
          },
        });
        wrap.innerHTML = svg.join('');
        p.append(wrap);

        // Legend — left-aligned chips, generous spacing
        const legend = h('div', { class: 'mt-5 flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-[var(--fg-muted)]' });
        legend.innerHTML = `
          <span class="inline-flex items-center gap-2"><span style="width:14px;height:14px;border-radius:4px;background:color-mix(in oklab, var(--accent) 22%, transparent); border:1.5px solid var(--accent)"></span><strong>Workspace</strong></span>
          <span class="inline-flex items-center gap-2"><span style="width:14px;height:14px;border-radius:4px;background:color-mix(in oklab, var(--info) 22%, transparent); border:1.5px solid var(--info)"></span><strong>Top-level package / app</strong></span>
          <span class="inline-flex items-center gap-2"><span style="width:14px;height:14px;border-radius:4px;background:color-mix(in oklab, var(--warn) 22%, transparent); border:1.5px solid var(--warn)"></span><strong>Nested folder</strong></span>
          <span class="ml-auto">Width ∝ token cost · Click a leaf to open its files</span>
        `;
        p.append(legend);

        // ---------- Interactivity ----------
        const svgEl = wrap.querySelector('svg');
        const crumb = svgEl?.querySelector('#ice-crumb');
        const tipOrig = crumb?.textContent;

        // Hover: lift cell, dim siblings, update breadcrumb
        svgEl.addEventListener('mousemove', (e) => {
          const g = e.target.closest('.ice-node');
          if (!g) {
            if (crumb) crumb.textContent = tipOrig;
            svgEl.querySelectorAll('.ice-node').forEach((x) => x.classList.remove('is-hover', 'is-dim'));
            return;
          }
          svgEl.querySelectorAll('.ice-node').forEach((x) => {
            x.classList.toggle('is-hover', x === g);
            x.classList.toggle('is-dim', x !== g);
          });
          if (crumb) {
            const path = g.getAttribute('data-path') || '';
            const name = g.getAttribute('data-name') || '';
            const meta = g.getAttribute('data-meta') || '';
            // Prefer the path for real folders; fall back to the name for
            // synthetic buckets like "(root files)" or the workspace root.
            crumb.textContent = `▸ ${path || name}   ·   ${meta}`;
          }
        });
        svgEl.addEventListener('mouseleave', () => {
          if (crumb) crumb.textContent = tipOrig;
          svgEl.querySelectorAll('.ice-node').forEach((x) => x.classList.remove('is-hover', 'is-dim'));
        });

        // Click: jump to Files scoped to that folder's first file
        wrap.addEventListener('click', (e) => {
          const g = e.target.closest('.ice-node[data-path]');
          if (!g) return;
          const path = g.getAttribute('data-path');
          if (!path) return;
          const first = [...FILES_BY_PATH.values()].find((f) => f.path.startsWith(path + '/') || f.path === path);
          if (first) smoothSwap(() => selectFile(first));
        });
      }

      // Compact vertical list for narrow viewports. One row per top-level
      // folder: name + token count + horizontal bar proportional to share.
      // Tap a row to drill into that folder's files.
      function renderGraphCompact(container) {
        const nodes = (DATA.tree?.children || []).map((c) => ({
          name: c.name,
          tokens: c.rollup?.tokens || 0,
          files: c.rollup?.files || 0,
          path: c.path,
        }));
        const rootFileTokens = (DATA.tree?.files || []).reduce((s, f) => s + (f.tokens || 0), 0);
        const rootFileCount  = (DATA.tree?.files || []).length;
        if (rootFileCount > 0) nodes.push({ name: '(root files)', tokens: rootFileTokens, files: rootFileCount, path: '' });
        nodes.sort((a, b) => b.tokens - a.tokens);
        const top = nodes.slice(0, 8);
        const max = top[0]?.tokens || 1;

        const list = h('div', { style: { display: 'flex', flexDirection: 'column', gap: '0' } });
        top.forEach((n, i) => {
          const pct = Math.round((n.tokens / max) * 100);
          const row = h('button', {
            class: 'text-left',
            'data-compact-path': n.path,
            style: {
              display: 'grid',
              gridTemplateColumns: '1fr auto',
              gap: '0.25rem 0.75rem',
              padding: '0.875rem 0',
              borderTop: i === 0 ? 'none' : '1px solid var(--hairline)',
              background: 'transparent',
              border: 'none',
              width: '100%',
              cursor: n.path ? 'pointer' : 'default',
            },
          });
          row.innerHTML = `
            <span style="font-family:var(--font-display);font-weight:600;font-size:0.9375rem;color:var(--fg)">${escapeHtml(n.name)}</span>
            <span class="mono text-xs text-[var(--fg-subtle)]">${fmtTok(n.tokens)} tok · ${n.files} file${n.files === 1 ? '' : 's'}</span>
            <span style="grid-column:1 / -1;height:6px;border-radius:3px;background:var(--surface-3);overflow:hidden;margin-top:0.375rem">
              <span style="display:block;height:100%;width:${Math.max(pct, 2)}%;background:var(--accent);border-radius:inherit"></span>
            </span>
          `;
          list.append(row);
        });
        container.append(list);

        // Click delegation for mobile rows
        list.addEventListener('click', (e) => {
          const row = e.target.closest('[data-compact-path]');
          if (!row) return;
          const path = row.getAttribute('data-compact-path');
          if (!path) return;
          const first = [...FILES_BY_PATH.values()].find((f) => f.path.startsWith(path + '/') || f.path === path);
          if (first) smoothSwap(() => selectFile(first));
        });
      }

      // Icicle cell renderer — rounded rect + adaptive labels.
      // Labels are clipped inside the cell via a per-cell clipPath so wide
      // names never bleed into siblings.
      function iceCell({ x, y, w, h, name, meta, depth, path, bigLabel = false }) {
        const fill = depth === 0 ? 'var(--accent)' : depth === 1 ? 'var(--info)' : 'var(--warn)';
        const rx = 8;
        const id = `cell-${Math.round(x)}-${Math.round(y)}`;
        // Labels only render if there's room; otherwise hover breadcrumb tells the story.
        const padL = 10, padT = 22;
        const showName = w > 44;
        const showMeta = w > 90 && h > 42;
        const showExpandHint = depth === 1 && w > 120;
        const nameFont = bigLabel ? 17 : depth === 1 ? 14 : 13;

        return `
<g class="ice-node" data-name="${escapeHtml(name)}" data-meta="${escapeHtml(meta)}" data-path="${escapeHtml(path || '')}" data-depth="${depth}" style="cursor:${path ? 'pointer' : 'default'}">
  <defs><clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ry="${rx}"/></clipPath></defs>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" ry="${rx}"
        class="ice-bg"
        fill="${fill}" fill-opacity="0.12"
        stroke="${fill}" stroke-width="1.5"/>
  <g clip-path="url(#${id})">
    ${showName ? `<text x="${x + padL}" y="${y + padT}" fill="var(--fg)" font-family="Urbanist, system-ui, sans-serif" font-size="${nameFont}" font-weight="${bigLabel ? 700 : 600}" letter-spacing="-0.01em">${escapeHtml(name)}</text>` : ''}
    ${showMeta ? `<text x="${x + padL}" y="${y + padT + 20}" fill="var(--fg-muted)" font-family="JetBrains Mono, monospace" font-size="11" font-variant-numeric="tabular-nums">${escapeHtml(meta)}</text>` : ''}
    ${showExpandHint ? `<text x="${x + w - padL}" y="${y + h - 10}" text-anchor="end" fill="${fill}" font-family="Urbanist, system-ui" font-size="10" font-weight="600" opacity="0.75">open →</text>` : ''}
  </g>
</g>`;
      }
      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      // History — editorial empty state. No sparklines (audit M2); one
      // sentence that explains what trend data WILL appear here after
      // multiple analyses.
      function renderHistory() {
        const p = $('#panel-history');
        p.innerHTML = '';
        const wrap = h('article', { class: 'max-w-[64rem] mx-auto' });
        wrap.innerHTML = `
          <div class="ed-dateline" style="margin-bottom:0.75rem">HISTORY &middot; trend data</div>
          <h1 class="ed-head" style="font-size:clamp(1.75rem, 3.2vw, 2.5rem);margin-bottom:0.5rem">
            No snapshots yet.
          </h1>

      function renderFiles() {
        const p = $('#panel-files');

          p.append(h('div', { class: 'max-w-4xl mx-auto content-cap' },

      function syncLocalTabUI(f) {
        const bar = $('nav[aria-label="Primary navigation"]')?.parentElement; // cheap no-op; keep signature consistent
        const todosChip = $('#local-todos-chip');

        $$('[role="tablist"][aria-label="File view"] [role="tab"]').forEach((t) => {
          const key = t.dataset.localTab;

      // Files pane — flat editorial treatment. Each tab renders content
      // directly on the page surface; hairline rules separate concerns.
      // Only the Preview tab keeps a container (because the code block
      // needs a visual frame). Everything else is prose + `<dl>` pairs.
      function renderFilesPaneContent(f, tab) {
        const wrap = h('div', { class: 'space-y-5' });
        const mkLabel = (t) => { const el = h('div', { class: 'ed-label' }, t); return el; };

        switch (tab) {
          case 'preview': {
            wrap.append(mkLabel('Preview'));
            const prose = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem' } });
            prose.textContent = 'The shipped @factstack/ui-remix app renders a Shiki-highlighted source preview here, sharing the same syntax theme as VS Code. The prototype omits source text to keep the bundle small.';
            wrap.append(prose);
            const frame = h('div', { class: 'mono text-xs text-[var(--fg-muted)]', style: {
              background: 'var(--code-bg)', padding: '12px 14px', borderRadius: '8px', border: '1px solid var(--border)',
