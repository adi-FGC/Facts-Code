<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>FactStack</title>

    <!-- Mona Sans (UI) + JetBrains Mono (data). No display face — the panel
         caps headings at ~24px (the broadsheet display sizes flatten anyway).
         Authorized via host_permissions in manifest.json. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..600&family=Mona+Sans:wght@400..700&display=swap"
    />

    <!-- External (MV3-clean) no-flash theme boot. -->
    <script src="./theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel/main.tsx"></script>
  </body>
</html>
