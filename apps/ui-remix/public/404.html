<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>404 — FACTS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230f0f0f'/%3E%3Cpath d='M7 9h18v3H11v4h11v3H11v6H7z' fill='%23f6f2e8'/%3E%3C/svg%3E" />
    <!-- Self-contained, no external/inline scripts — stays clean under the CSP.
         Served (with a 404 status) for missing /assets/* requests; client
         routes still resolve via the SPA fallback in _redirects. -->
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
        background: #fbfbf9; color: #1b1d21;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0f0f0f; color: #f6f2e8; }
        a { color: #9ecbb6; }
      }
      main { text-align: center; padding: 2rem; }
      h1 { font-size: 3rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
      p { color: #5b6470; margin: 0 0 1.25rem; }
      a { color: #2e5a4e; font-weight: 600; text-decoration: none; }
      a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>That resource isn’t here.</p>
      <a href="/">← Back to FACTS</a>
    </main>
  </body>
</html>
