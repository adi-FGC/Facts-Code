      function relTime(iso) {
        const diff = (Date.now() - new Date(iso).getTime()) / 1000;
        if (diff < 60) return Math.floor(diff) + 's ago';
        if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
        if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
        return Math.floor(diff / 86400) + 'd ago';
      }

      // ============================ TABS ==================================
      function activateTab(name) {
        $$('nav[aria-label="Primary navigation"] [role="tab"]').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
        $$('.tab-panel').forEach((p) => p.classList.toggle('hidden', p.dataset.panel !== name));
        const head = $('#rhs-content h1');
        if (head) { head.setAttribute('tabindex', '-1'); head.focus({ preventScroll: true }); }
      }

      // ============================ EVENT DELEGATION ======================
      // Single document-level click handler that survives re-renders, never
      // loses a listener to innerHTML swaps, and handles every interactive
      // region: global tabs, LHS view-mode toggle, tree rows (folder toggle
      // vs file select), and local tabs.
      //
      // Transition helper: wraps state swap in startViewTransition with a
      // hard fallback. If VT API is missing OR throws, we swap synchronously
      // so the user never sees a dead click.
      function smoothSwap(fn) {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) { fn(); return; }
        if (!('startViewTransition' in document)) { fn(); return; }
        try {
          const vt = document.startViewTransition(fn);
          // Safety net: if the VT hangs past 800ms (browser bug / conflicting
          // named element), force the swap anyway.
          setTimeout(() => { try { vt.skipTransition(); } catch (_) {} }, 800);
        } catch (_) {
          fn();
        }
      }

      document.addEventListener('click', (e) => {
        // 1. Global tabs
        const globalTab = e.target.closest('nav[aria-label="Primary navigation"] [role="tab"][data-tab]');
        if (globalTab) {
          e.preventDefault();
          smoothSwap(() => activateTab(globalTab.dataset.tab));
          return;
        }
        // 2. Tree folder toggle
        const folderRow = e.target.closest('#tree .tree-row[data-kind="folder"]');
        if (folderRow) {
          e.preventDefault();
          e.stopPropagation();
          toggleFolder(folderRow.dataset.path);
          return;
        }
        // 3. Tree file select → open file analysis
        const fileRow = e.target.closest('#tree .tree-row[data-kind="file"]');
        if (fileRow) {
          e.preventDefault();
          e.stopPropagation();
          const file = FILES_BY_PATH.get(fileRow.dataset.path);
          if (file) smoothSwap(() => selectFile(file));
          return;
        }
        // 4. File-view local tabs (RHS bar). These drive what's rendered
        //    in the Files pane — Outline, Preview, Imports, Callers, TODOs,
        //    Tests. We also auto-switch to the Files tab so users see the
        //    content they asked for.
        const fileLocalTab = e.target.closest('[role="tablist"][aria-label="File view"] [role="tab"][data-local-tab]');
        if (fileLocalTab) {
          e.preventDefault();
          const key = fileLocalTab.dataset.localTab;
          fileLocalTab.closest('[role="tablist"]').querySelectorAll('[role="tab"]')
            .forEach((t) => t.setAttribute('aria-selected', String(t === fileLocalTab)));
          LOCAL_TAB = key;
          smoothSwap(() => {
            // If the user clicks a local tab while the Files panel isn't
            // active, switch to it so they actually see the content.
            const filesPanel = document.querySelector('[data-panel="files"]');
            if (filesPanel && filesPanel.classList.contains('hidden')) activateTab('files');
            renderFiles();
          });
          return;
        }
        // 5. Other tablists (LHS view-mode toggle, etc.) — purely visual swap.
        const localTab = e.target.closest('[role="tab"]:not([data-tab]):not([data-local-tab])');
        if (localTab) {
          const bar = localTab.closest('[role="tablist"]');
          if (bar) {
            e.preventDefault();
            bar.querySelectorAll('[role="tab"]').forEach((t) => t.setAttribute('aria-selected', String(t === localTab)));
          }
          return;
        }
        // 6. Config pane — body-font radio selection.
        const fontOpt = e.target.closest('[role="radio"][data-body-font]');
        if (fontOpt) {
          e.preventDefault();
          const choice = fontOpt.dataset.bodyFont;
          setBodyFont(choice);
          renderConfig();
          return;
        }
        // 7. Config pane — theme radio selection.
        const themeOpt = e.target.closest('[role="radio"][data-theme-opt]');
        if (themeOpt) {
          e.preventDefault();
          const next = themeOpt.dataset.themeOpt;
          applyTheme(next === 'dark' ? 'dark' : 'light');
          renderConfig();
          return;
        }
      }, true);

      // WAI-ARIA tablist keyboard: ←/→ cycle focus between tabs in the same
      // tablist, Home/End jump to first/last. Activates the tab that receives
      // focus (follows-focus pattern) so arrow keys switch content too.
      document.addEventListener('keydown', (e) => {
        const t = e.target;
        if (!t || t.getAttribute?.('role') !== 'tab') return;
        const bar = t.closest('[role="tablist"]');
        if (!bar) return;
        const tabs = [...bar.querySelectorAll('[role="tab"]')];
        const i = tabs.indexOf(t);
        if (i < 0) return;
        let j = -1;
        if (e.key === 'ArrowRight' || e.key === 'ArrowDown') j = (i + 1) % tabs.length;
        else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') j = (i - 1 + tabs.length) % tabs.length;
        else if (e.key === 'Home') j = 0;
        else if (e.key === 'End') j = tabs.length - 1;
        else return;
        e.preventDefault();
        tabs[j].focus();
        tabs[j].click();
      });

      // Helper: apply + persist body-font choice.
      function setBodyFont(choice) {
        document.documentElement.dataset.bodyFont = choice;
        try { localStorage.setItem('facts-body-font', choice); } catch (_) {}
      }

      // Config font-size slider (re-uses the same persistence key as the top-nav popover).
      document.addEventListener('input', (e) => {
        if (e.target && e.target.id === 'config-font-slider') {
          const v = e.target.value;
          document.documentElement.style.setProperty('--fs-mult', v);
          try { localStorage.setItem('facts-font', v); } catch (_) {}
          const r = document.getElementById('fs-readout');
          if (r) r.textContent = (parseFloat(v) * 100).toFixed(0) + '%';
          // Keep the top-nav slider in sync
          const top = document.getElementById('font-slider');
          if (top) top.value = v;
        }
      });

      // ============================ THEME =================================
      const root = document.documentElement;
      const toggle = $('#theme-toggle');
      function syncIcons() { const dark = root.dataset.theme === 'dark'; $('#icon-sun').classList.toggle('hidden', dark); $('#icon-moon').classList.toggle('hidden', !dark); }
      syncIcons();

      function applyTheme(next, origin) {
        const run = () => { root.dataset.theme = next; root.style.colorScheme = next; localStorage.setItem('facts-theme', next); syncIcons(); };
        if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) { run(); return; }
        if (origin) { root.style.setProperty('--theme-x', `${origin.x}px`); root.style.setProperty('--theme-y', `${origin.y}px`); }
        root.classList.add('theme-swap');
        const vt = document.startViewTransition(run);
        vt.finished.finally(() => root.classList.remove('theme-swap'));
      }
      toggle.addEventListener('click', (e) => applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark', { x: e.clientX, y: e.clientY }));

      // ============================ MOBILE DRAWER =========================
      const hamburger = $('#hamburger'), lhs = $('#lhs-panel'), scrim = $('#lhs-scrim');
      function toggleDrawer(force) {
        const open = force !== undefined ? force : lhs.dataset.open !== 'true';
        lhs.dataset.open = String(open);
      }
      hamburger.addEventListener('click', () => toggleDrawer());
      scrim.addEventListener('click', () => toggleDrawer(false));

      // ============================ KEYBOARD ==============================
      // Guard against swallowing shortcuts while the user is typing: if
      // focus is inside a text-editing surface, we let the browser/OS
      // handle Ctrl+B/Ctrl+J (bookmarks, bold, downloads, etc.).
      function isEditing(target) {
        if (!target || target.nodeType !== 1) return false;
        const tag = target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
        return target.isContentEditable === true;
      }
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && lhs.dataset.open === 'true') toggleDrawer(false);
        if (isEditing(e.target)) return;
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'j') { e.preventDefault(); applyTheme(root.dataset.theme === 'dark' ? 'light' : 'dark'); }
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'b') { e.preventDefault(); toggleDrawer(); }
      });

      // ============================ FONT SLIDER ===========================
      const slider = $('#font-slider');
      const saved = localStorage.getItem('facts-font'); if (saved) slider.value = saved;
      slider.addEventListener('input', () => { root.style.setProperty('--fs-mult', slider.value); localStorage.setItem('facts-font', slider.value); });

      // ============================ RE-ANALYZE =============================
      // When the prototype is served by `factstack ui`, POST to /api/reanalyze
      // to re-run the Node analyzer. The server rebuilds its inlined data
      // AND serves fresh /data/factstack.json, so we reload the page to
      // pick it up.
      //
      // Two modes the prototype runs in:
      //   1. file://      — no server. Re-analyze tells the user to run
      //                     `factstack ui .` from a project directory.
      //   2. http(s)://   — but possibly a static host (Netlify) that
      //                     answers `/api/reanalyze` with the SPA-fallback
      //                     index.html instead of running the analyzer.
      //                     We detect this at startup via the global
      //                     STATIC_MODE flag set by detectStaticMode().
      const reanalyzeBtn = $('#reanalyze');
      if (reanalyzeBtn) {
        reanalyzeBtn.addEventListener('click', async () => {
          // Only works when served (origin is http/https; file:// has null origin).
          const served = location.protocol.startsWith('http');
          if (!served) {
            alert(
              'Re-analyze only works when the UI is served by the CLI.\n\n' +
              'Run this from the project directory:\n\n' +
              '    factstack ui .\n\n' +
              'The CLI will start a local server and re-run analysis on demand.',
            );
            return;
          }
          if (window.__STATIC_MODE === true) {
            alert(
              "This is the static demo — there's no analyzer server " +
              "behind it.\n\nRun this on your own project:\n\n" +
              "    factstack ui /path/to/your/project\n\n" +
              "The CLI starts a local server and re-runs analysis on demand.",
            );
            return;
          }
          const label = reanalyzeBtn.querySelector('span');
          const orig = label?.textContent;
          if (label) label.textContent = 'analyzing…';
          reanalyzeBtn.disabled = true;
          try {
            const res = await fetch('/api/reanalyze', { method: 'POST' });
            if (!res.ok) throw new Error('HTTP ' + res.status);
            const result = await res.json();
            if (!result.ok) throw new Error(result.error || 'reanalyze failed');
            // Fetch fresh viz JSON, replace DATA, re-render (no full page
            // reload so the user's pan/zoom / scroll stays put).
            const fresh = await fetch('/data/factstack.json', { cache: 'no-store' });
            DATA = await fresh.json();
            SELECTED_FILE = null;
            // Graph view: replay hero entry + auto-fit. DON'T wipe the
            // user's expand/collapse decisions (COLLAPSED has __EXPAND__
            // sentinels and explicit collapses the seed respects); the
            // original code cleared them wholesale, losing navigation state.
            GRAPH_VIEW.dirty = true;
            GRAPH_VIEW.entered = false;
            GRAPH_VIEW.focusedId = null;
            // DAG view: same — replay layout/fit, keep user intent.
            if (typeof DAG_STATE !== 'undefined') {
              DAG_STATE.dirty = true;
              DAG_STATE.hover = null;
              DAG_STATE.panX = 0;
              DAG_STATE.panY = 0;
              DAG_STATE.zoom = 1;
              // Drop collapse entries whose node path no longer exists
              // in the new tree so the layout doesn't anchor on ghosts.
              if (DAG_STATE.collapsed instanceof Set) {
                const alive = new Set();
                (function walk(n) {
                  for (const f of (n.files || [])) alive.add(f.path);
                  for (const c of (n.children || [])) { alive.add(c.path); walk(c); }
                })(DATA.tree);
                for (const id of [...DAG_STATE.collapsed]) {
                  if (!alive.has(id)) DAG_STATE.collapsed.delete(id);
                }
              }
            }
            smoothSwap(() => renderAll());
          } catch (e) {
            console.error(e);
            alert('Re-analyze failed: ' + (e?.message || e));
          } finally {
            reanalyzeBtn.disabled = false;
            if (label) label.textContent = orig || 'Re-analyze';
          }
        });
      }

      // ============================ STATIC MODE DETECTION =================
      /**
       * True when the prototype is loaded from a static host that has
       * no factstack analyzer behind it (Netlify, GitHub Pages, S3).
       *
       * Probe: GET /api/events. The CLI server responds with
       * `text/event-stream`. Netlify's SPA fallback serves the index.html
       * with `text/html`. We read the response headers ONLY (the body
       * is the long-lived SSE stream — we never read it). If the probe
       * fails entirely (network blip, CORS), we err on the side of the
       * REAL server and keep things alive — better to see a momentary
       * red banner than to hide live UI from a real CLI user.
       */
      async function detectStaticMode() {
        try {
          // AbortController so we don't hold the long-lived SSE stream open.
          const ac = new AbortController();
          const probe = fetch('/api/events', {
            method: 'GET',
            signal: ac.signal,
            cache: 'no-store',
          });
          // Tiny window to inspect headers, then bail. The CLI server
          // sets headers immediately; if we don't see them in 1500ms we
          // treat as static.
          const timeout = new Promise((resolve) => setTimeout(() => resolve('timeout'), 1500));
          const result = await Promise.race([probe, timeout]);
          if (result === 'timeout') {
            ac.abort();
            return true;
          }
          const ct = (result.headers.get('content-type') || '').toLowerCase();
          ac.abort(); // close the SSE stream — we don't actually want it open
          // CLI server: `text/event-stream`. Static host fallback to
          // index.html: `text/html`. Anything else (JSON error, plain
          // text) — assume static so the user sees the safe banner.
          return !ct.startsWith('text/event-stream');
        } catch (_) {
          // Network error before headers arrived — most likely static.
          return true;
        }
      }

      /**
       * Hide server-only controls and surface a one-line banner. Called
       * once at startup when detectStaticMode() returns true. Idempotent
       * (safe to invoke multiple times).
       */
      function activateStaticMode() {
        document.documentElement.dataset.factstackMode = 'static';
        // Hide Re-analyze button — clicking it would just alert. Easier
        // to remove the affordance than to explain why it's broken.
        const reanalyze = document.getElementById('reanalyze');
        if (reanalyze) reanalyze.style.display = 'none';
        // Replace the file-count chip with a calm "demo" hint. The
        // status-line slot in the footer carries the longer message.
        const status = document.getElementById('status-line');
        if (status && !status.dataset.staticBannerShown) {
          status.textContent = 'Static demo · run factstack ui /your/project for live analysis';
          status.dataset.tone = 'ok';
          status.dataset.staticBannerShown = '1';
        }
        // Replace the parse-state dot's pulsing color with a steady
        // muted tone so the demo doesn't pretend to be live.
        const dot = document.querySelector('footer .dot-pulse');
        if (dot) {
          dot.classList.remove('dot-pulse');
          dot.style.background = 'var(--fg-subtle)';
        }
      }

      // ============================ LIVE UPDATES (SSE) ====================
      // When served by `factstack ui --watch`, the server publishes analysis
      // events to /api/events. We subscribe, coalesce updates within the
      // server-side 500ms debounce window, and re-render with a pulse on
      // the changed tree nodes (parity with the React port's design).
      //
      // Editorial status-bar treatment: "Updated N files · Ms ago" in a
      // calm tone; amber when the connection drops; red after 3 retries.
      (async function wireLiveUpdates() {
        if (!location.protocol.startsWith('http')) return;
        // Probe for a real analyzer server. On a static host (Netlify,
        // GitHub Pages, S3) the SPA-fallback redirect serves index.html
        // for unknown paths — content-type comes back as text/html
        // instead of text/event-stream. When that's the case we set
        // STATIC_MODE, hide the Re-analyze button, drop the SSE
        // connect, and show a one-line banner explaining the demo
        // is read-only.
        const isStatic = await detectStaticMode();
        window.__STATIC_MODE = isStatic;
        if (isStatic) {
          activateStaticMode();
          return;
        }
        const status = document.getElementById('status-line') || document.querySelector('[role="status"][aria-live]');
        let es = null;
        let retries = 0;
        let lastUpdateAt = 0;

        function setStatus(text, tone) {
          if (!status) return;
          status.textContent = text;
          status.dataset.tone = tone;
        }

        function connect() {
          try { es?.close(); } catch (_) {}
          try {
            es = new EventSource('/api/events');
          } catch (_) { scheduleRetry(); return; }
          es.addEventListener('open', () => { retries = 0; });
          es.addEventListener('update', async (ev) => {
            try {
              const payload = JSON.parse(ev.data || '{}');
              lastUpdateAt = Date.now();
              // Fetch the fresh /data/factstack.json and diff file-paths so
              // we know which tree rows to pulse.
              const before = new Set(flattenPaths(DATA?.tree));
              const fresh = await fetch('/data/factstack.json', { cache: 'no-store' }).then((r) => r.json());
              const after = new Set(flattenPaths(fresh.tree));
              DATA = fresh;
              SELECTED_FILE = null;
              if (typeof GRAPH_VIEW !== 'undefined') GRAPH_VIEW.dirty = true;
              if (typeof DAG_STATE !== 'undefined') DAG_STATE.dirty = true;
              smoothSwap(() => renderAll());
              // Pulse changed/added paths (limit 10 to stay under the
              // view-transition-name uniqueness budget).
              const changed = [...after].filter((p) => !before.has(p)).slice(0, 10);
              for (const p of changed) {
                const row = document.querySelector(`[data-path="${cssEscape(p)}"]`);
                if (!row) continue;
                row.classList.add('fs-pulse');
                // Matches the CSS animation duration (animations_spec row 9).
                setTimeout(() => row.classList.remove('fs-pulse'), 450);
              }
              const reason = payload.reason === 'watch' ? 'auto-update' : 'analyzed';
              setStatus(`${reason} · ${changed.length} file${changed.length === 1 ? '' : 's'} touched · just now`, 'ok');
            } catch (e) {
              console.warn('live update failed', e);
            }
          });
          es.addEventListener('error', () => {
            // Bail FIRST on terminal failure — otherwise scheduleRetry
            // queues a zombie reconnect that overwrites the "Watch failed"
            // status ~4s later. Then compute backoff before incrementing
            // so retry #1 = 1s, #2 = 2s. Max 3 attempts total.
            if (retries >= 2) {
              setStatus('Watch failed. Run `factstack watch` again.', 'error');
              try { es?.close(); } catch (_) {}
              retries++;
              return;
            }
            setStatus('Watch disconnected — retrying…', 'warn');
            scheduleRetry();
            retries++;
          });
        }

        function scheduleRetry() {
          const delay = Math.min(1000 * Math.pow(2, retries), 8000);
          setTimeout(connect, delay);
        }

        function flattenPaths(tree) {
          const out = [];
          (function walk(n) {
            if (!n) return;
            for (const f of (n.files || [])) out.push(f.path);
            for (const c of (n.children || [])) walk(c);
          })(tree);
          return out;
        }

        function cssEscape(s) {
          return (window.CSS && window.CSS.escape) ? window.CSS.escape(s) : s.replace(/"/g, '\\"');
        }

        connect();
      })();

      // ============================ OPEN FOLDER ===========================
      // File System Access API — Chrome/Edge only. Falls back to alert if
      // unavailable. Performs a shallow client-side walk (no tree-sitter)
      // and rebuilds the dataset from the picked folder.
      const openBtn = $('#open-folder');
      // Clicking the top-nav project chip copies the absolute project path
      // to the clipboard. Originally this opened the File System Access API
      // picker (showDirectoryPicker), but that bypassed the running CLI's
      // server-bound `root` and caused confusing drift after Re-analyze:
      // the picker swapped the visible DATA, but Re-analyze still hit
      // /api/reanalyze which re-walked the SERVER's original target. To
      // switch projects, restart `factstack ui /path/to/other` — the
      // tooltip + status message make this clear.
      const projChip = $('#project-chip');
      if (projChip) projChip.addEventListener('click', async () => {
        const fullPath = (DATA?.project?.root || '').replace(/\\/g, '/');
        if (!fullPath) return;
        try {
          await navigator.clipboard.writeText(fullPath);
          setStatus(`Copied · ${fullPath}`, 'ok');
        } catch (_) {
          // Older browsers — show the path in a status line so the user
          // can at least see it.
          setStatus(`Path: ${fullPath}`, 'ok');
        }
      });
      openBtn.addEventListener('click', async () => {
        if (!('showDirectoryPicker' in window)) {
          alert(
            "Your browser doesn't support the File System Access API yet.\n\n" +
            "This demo uses it to read a folder directly. In the shipped CLI, you'd run:\n\n" +
            "    factstack /path/to/project\n\n" +
            "Try this page in Chrome or Edge to open a folder here."
          );
          return;
        }
        let handle;
        try {
          handle = await window.showDirectoryPicker();
        } catch (e) { return; /* user cancelled */ }

        openBtn.disabled = true;
        const txt = openBtn.querySelector('span');
        const orig = txt?.textContent;
        if (txt) txt.textContent = 'scanning…';
        try {
          const dataset = await scanHandle(handle);
          DATA = dataset;
          SELECTED_FILE = null;
          // New project → re-fit the dependency graph on next render.
          GRAPH_VIEW.dirty = true;
          COLLAPSED.clear();
          renderAll();
        } catch (e) {
          console.error(e);
          alert('Scan failed: ' + (e.message || e));
        } finally {
          openBtn.disabled = false;
          if (txt) txt.textContent = orig || 'Open';
        }
      });

      // ------------------------------------------------------------------
      // Shallow client-side walker (File System Access API) + AST import
      // extraction via @babel/parser (loaded lazily from esm.sh). When the
      // CDN is unavailable we still show the tree + rollups — just without
      // import edges.
      // ------------------------------------------------------------------
      let _babelParser = null;
      async function getBabelParser() {
        if (_babelParser) return _babelParser;
        try {
          _babelParser = (await import('https://esm.sh/@babel/parser@7.25.6')).parse;
        } catch (e) {
          console.warn('babel parser unavailable — graph edges disabled', e);
          _babelParser = null;
        }
        return _babelParser;
      }
      const IMPORT_EXTS = new Set(['.ts','.tsx','.mts','.cts','.js','.jsx','.mjs','.cjs']);
      function extractImportsFromSource(parse, source, ext) {
        if (!parse || !IMPORT_EXTS.has(ext)) return [];
        const jsx = ext.endsWith('x');
        const plugins = ['importAssertions', 'decorators-legacy'];
        if (ext.startsWith('.t')) plugins.push('typescript');
        if (jsx) plugins.push('jsx');
        let ast; try {
          ast = parse(source, { sourceType: 'module', allowImportExportEverywhere: true, errorRecovery: true, plugins });
        } catch { return []; }
        const out = [];
        const body = ast?.program?.body || [];
        for (const n of body) {
          if (!n) continue;
          if (n.type === 'ImportDeclaration' && typeof n.source?.value === 'string') {
            out.push({ specifier: n.source.value, kind: n.importKind === 'type' ? 'type-import' : 'import' });
          } else if ((n.type === 'ExportNamedDeclaration' || n.type === 'ExportAllDeclaration') && typeof n.source?.value === 'string') {
            out.push({ specifier: n.source.value, kind: n.exportKind === 'type' ? 'type-import' : 'import' });
          }
        }
        (function walk(n) {
          if (!n || typeof n !== 'object') return;
          if (n.type === 'CallExpression' && n.callee?.type === 'Import') {
            const a = n.arguments?.[0]; if (a?.type === 'StringLiteral') out.push({ specifier: a.value, kind: 'dynamic-import' });
          }
          if (n.type === 'CallExpression' && n.callee?.type === 'Identifier' && n.callee.name === 'require') {
            const a = n.arguments?.[0]; if (a?.type === 'StringLiteral') out.push({ specifier: a.value, kind: 'import' });
          }
          for (const k of Object.keys(n)) {
            if (k === 'loc' || k === 'start' || k === 'end' || k === 'range') continue;
            const v = n[k];
            if (Array.isArray(v)) for (const c of v) walk(c);
            else if (v && typeof v === 'object' && typeof v.type === 'string') walk(v);
          }
        })(ast);
        // Dedupe
        const seen = new Set(); const dedup = [];
        for (const x of out) { const k = x.specifier + '|' + x.kind; if (!seen.has(k)) { seen.add(k); dedup.push(x); } }
        return dedup;
      }
      const RESOLVE_EXTS = ['', '.ts', '.tsx', '.mts', '.cts', '.js', '.jsx', '.mjs', '.cjs', '.json'];
      const RESOLVE_INDEX = ['index.ts', 'index.tsx', 'index.js', 'index.jsx', 'index.mjs'];
      function dirnameP(p) { const i = p.lastIndexOf('/'); return i < 0 ? '' : p.slice(0, i); }
      function normP(base, rel) {
        const parts = base === '' ? [] : base.split('/');
        for (const seg of rel.split('/')) {
          if (!seg || seg === '.') continue;
          if (seg === '..') parts.pop(); else parts.push(seg);
        }
        return parts.join('/');
      }
      function probeP(base, fileSet) {
        for (const e of RESOLVE_EXTS) if (fileSet.has(base + e)) return base + e;
        for (const i of RESOLVE_INDEX) if (fileSet.has(base + '/' + i)) return base + '/' + i;
        if (base.endsWith('.js')) {
          const ts = base.slice(0, -3) + '.ts'; if (fileSet.has(ts)) return ts;
          const tsx = base.slice(0, -3) + '.tsx'; if (fileSet.has(tsx)) return tsx;
        }
        return null;
      }
      function resolveSpecP(spec, importer, fileSet, workspaces) {
        if (!spec) return null;
        if (spec.startsWith('node:') || NODE_BUILTINS_SET.has(spec)) return null;
        if (spec.startsWith('./') || spec.startsWith('../')) return probeP(normP(dirnameP(importer), spec), fileSet);
        let ws = null;
        for (const w of workspaces.values()) {
          if (spec === w.name || spec.startsWith(w.name + '/')) if (!ws || w.name.length > ws.name.length) ws = w;
        }
        if (!ws) return null;
        const rest = spec.slice(ws.name.length).replace(/^\//, '');
        if (!rest) return (ws.entry && fileSet.has(ws.entry)) ? ws.entry : (probeP(ws.dir + '/src/index', fileSet) || probeP(ws.dir + '/index', fileSet));
        return probeP(ws.dir + '/src/' + rest, fileSet) || probeP(ws.dir + '/' + rest, fileSet);
      }
      const NODE_BUILTINS_SET = new Set(['assert','async_hooks','buffer','child_process','cluster','console','crypto','dns','events','fs','fs/promises','http','http2','https','module','net','os','path','perf_hooks','process','stream','stream/promises','timers','tls','url','util','vm','worker_threads','zlib','sqlite']);

      const ALWAYS_EXCLUDE = new Set(['node_modules','dist','build','.next','.turbo','.cache','__pycache__','.venv','.git','vendor','target','coverage','.pnpm-store','.vscode','.idea']);
      const EXT_LANG = {
        '.ts': { id:'typescript', label:'TypeScript', iconColor:'#3178c6', tag:'TS' },
        '.tsx': { id:'typescript', label:'TypeScript', iconColor:'#3178c6', tag:'TSX' },
        '.js': { id:'javascript', label:'JavaScript', iconColor:'#f7df1e', tag:'JS' },
        '.jsx': { id:'javascript', label:'JavaScript', iconColor:'#f7df1e', tag:'JSX' },
        '.mjs': { id:'javascript', label:'JavaScript', iconColor:'#f7df1e', tag:'MJS' },
        '.py': { id:'python', label:'Python', iconColor:'#3776ab', tag:'PY' },
        '.json': { id:'json', label:'JSON', iconColor:'#cbd5e1', tag:'JSON' },
        '.yaml': { id:'yaml', label:'YAML', iconColor:'#cb171e', tag:'YAML' },
        '.yml': { id:'yaml', label:'YAML', iconColor:'#cb171e', tag:'YML' },
        '.toml': { id:'toml', label:'TOML', iconColor:'#9c4221', tag:'TOML' },
        '.md': { id:'markdown', label:'Markdown', iconColor:'#60a5fa', tag:'MD' },
        '.html': { id:'html', label:'HTML', iconColor:'#e34f26', tag:'HTML' },
        '.css': { id:'css', label:'CSS', iconColor:'#1572b6', tag:'CSS' },
      };

      async function scanHandle(dirHandle, relPath = '', ctx) {
        const isRoot = !ctx;
        ctx = ctx || { allFiles: [], parse: await getBabelParser(), packageJsons: [] };
        const node = { name: dirHandle.name, path: relPath, files: [], children: [] };
        let ignorePatterns = [];
        // Parse .gitignore inside this folder
        try {
          const giHandle = await dirHandle.getFileHandle('.gitignore');
          const gi = await giHandle.getFile();
          const content = await gi.text();
          ignorePatterns = content.split('\n').map((l) => l.trim()).filter((l) => l && !l.startsWith('#'));
        } catch {}

        for await (const [name, entry] of dirHandle.entries()) {
          if (ALWAYS_EXCLUDE.has(name)) continue;
          if (ignorePatterns.some((p) => p === name || (p.startsWith('*.') && name.endsWith(p.slice(1))))) continue;

          const childRel = relPath ? `${relPath}/${name}` : name;
          if (entry.kind === 'directory') {
            const sub = await scanHandle(entry, childRel, ctx);
            if (sub.files.length || sub.children.length) node.children.push(sub);
          } else {
            try {
              const file = await entry.getFile();
              if (file.size > 1024 * 1024) continue;
              const text = await file.text();
              if (text.includes('\0')) continue;
              const ext = '.' + name.split('.').pop().toLowerCase();
              const lang = EXT_LANG[ext] || null;
              const tokens = Math.max(1, Math.round(text.length / 3.5));
              const loc = text.split('\n').length;
              const todos = (text.match(/\b(TODO|FIXME|HACK|XXX)\b/g) || []).length;
              const imports = extractImportsFromSource(ctx.parse, text, ext);
              const fileEntry = {
                name, path: childRel, ext, language: lang,
                size: file.size, loc, tokens, todos, status: 'ok', mtime: file.lastModified,
                gzip: null, imports,
              };
              if (name === 'package.json') {
                try { ctx.packageJsons.push({ path: childRel, text }); } catch {}
              }
              node.files.push(fileEntry);
              ctx.allFiles.push(fileEntry);
            } catch {}
          }
        }
        node.files.sort((a, b) => a.name.localeCompare(b.name));
        node.children.sort((a, b) => a.name.localeCompare(b.name));
        if (!isRoot) return node;
        return rootifyDataset(node, ctx);
      }

      function rootifyDataset(rootNode, ctx) {
        // rollup
        const rollup = (n) => {
          let size = 0, tokens = 0, files = 0, loc = 0, todos = 0;
          for (const f of n.files) { size += f.size; tokens += f.tokens; files++; loc += f.loc; todos += f.todos; }
          for (const c of n.children) { const sub = rollup(c); size += sub.size; tokens += sub.tokens; files += sub.files; loc += sub.loc; todos += sub.todos; c.rollup = sub; }
          return { size, tokens, files, loc, todos };
        };
        const totals = rollup(rootNode);
        // languages
        const langMap = new Map();
        const walk = (n) => {
          for (const f of n.files) {
            if (!f.language) continue;
            const k = f.language.id;
            if (!langMap.has(k)) langMap.set(k, { ...f.language, loc: 0, tokens: 0, files: 0 });
            const r = langMap.get(k);
            r.loc += f.loc; r.tokens += f.tokens; r.files++;
          }
          for (const c of n.children) walk(c);
        };
        walk(rootNode);
        const languages = [...langMap.values()].sort((a, b) => b.loc - a.loc);

        // Build edges from AST imports → resolved paths. Mirrors
        // scan.mjs / packages/graph exactly. Pure client-side.
        const fileSet = new Set((ctx?.allFiles || []).map((f) => f.path));
        const workspaces = new Map();
        for (const pj of (ctx?.packageJsons || [])) {
          let j; try { j = JSON.parse(pj.text); } catch { continue; }
          if (typeof j?.name !== 'string' || !j.name) continue;
          const dir = dirnameP(pj.path);
          const mainRaw = (typeof j.module === 'string' && j.module) || (typeof j.main === 'string' && j.main) || null;
          const entry = typeof mainRaw === 'string' ? ((mainRaw.replace(/^\.\//, '')) ? (dir ? dir + '/' + mainRaw.replace(/^\.\//, '') : mainRaw.replace(/^\.\//, '')) : null) : null;
          workspaces.set(j.name, { name: j.name, dir, entry });
        }
        const edges = [];
        const seenEdge = new Set();
        for (const f of (ctx?.allFiles || [])) {
          if (!Array.isArray(f.imports) || !f.imports.length) continue;
          for (const imp of f.imports) {
            const to = resolveSpecP(imp.specifier, f.path, fileSet, workspaces);
            if (!to || to === f.path) continue;
            const kind = imp.kind === 'dynamic-import' ? 'dynamic-import' : imp.kind === 'type-import' ? 'type-import' : 'import';
            const key = f.path + '|' + to + '|' + kind;
            if (seenEdge.has(key)) continue;
            seenEdge.add(key);
            edges.push({ from: f.path, to, kind });
          }
        }

        return {
          generatedAt: new Date().toISOString(),
          project: {
            name: rootNode.name,
            // The File System Access API hides absolute paths for privacy,
            // so use the folder name as the "root" display value — better
            // than a stale empty string.
            root: rootNode.name,
            languages,
            frameworks: [],
          },
          summary: {
            oneLiner: `${rootNode.name} — ${totals.files} files, ${edges.length} import edges`,
            description: `Scanned ${rootNode.name} via the File System Access API. Real AST extraction via @babel/parser (loaded from esm.sh) produced ${edges.length} resolved import edges across ${totals.files} files. Framework detection is limited to what the shipped CLI provides.`,
            capabilities: [],
            health: { broken: 0, stale: 0, todos: totals.todos, secrets: 0 },
          },
          stats: { files: totals.files, loc: totals.loc, size: totals.size, gzip: 0, tokens: totals.tokens },
          tree: rootNode,
          edges,
          entryPoints: [],
          risks: [],
        };
      }

      // ============================ BACKDROP ANIMATOR =====================
      // ASMR-like smooth wander: each blob's (tx, ty, scale, rotation) is a
      // sum of two sines with incommensurable periods — the composite
      // trajectory never repeats in any human timeframe. Feels random yet
      // perfectly continuous and soothing. Disabled when the user has asked
      // for reduced motion.
      (function animateBackdrop() {
        const blobs = [...document.querySelectorAll('#backdrop .blob')];
        if (!blobs.length) return;
        const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduced) return;

        // Per-blob coefficients — primes-ish to avoid resonance
        const coeffs = blobs.map((_, i) => {
          const seed = i * 37 + 13;
          return {
            fx1: 0.00009 + i * 0.00004,   // very slow primary x
            fx2: 0.00017 + i * 0.00006,   // overtone x
            fy1: 0.00011 + i * 0.00003,
            fy2: 0.00021 + i * 0.00005,
            fs:  0.00013 + i * 0.00004,   // scale pulse
            fr:  0.00005 + i * 0.00002,   // rotation — extremely slow
            px: seed * 0.73,
            py: seed * 1.29,
            ps: seed * 0.47,
            pr: seed * 1.91,
            ampX: 8 + (i % 2) * 4,        // vw — modest drift so blobs keep their corner anchors
            ampY: 6 + ((i + 1) % 2) * 4,  // vh
            ampS: 0.08 + i * 0.01,
          };
        });

        let rafId = 0;
        let start = performance.now();
        function tick(now) {
          const t = now - start;
          for (let i = 0; i < blobs.length; i++) {
            const c = coeffs[i];
            const tx = (Math.sin(t * c.fx1 + c.px) * 0.65 + Math.sin(t * c.fx2 + c.px * 2) * 0.35) * c.ampX;
            const ty = (Math.cos(t * c.fy1 + c.py) * 0.65 + Math.cos(t * c.fy2 + c.py * 2) * 0.35) * c.ampY;
            const scale = 1 + Math.sin(t * c.fs + c.ps) * c.ampS;
            const rot = Math.sin(t * c.fr + c.pr) * 30;
            blobs[i].style.transform = `translate(${tx.toFixed(2)}vw, ${ty.toFixed(2)}vh) scale(${scale.toFixed(3)}) rotate(${rot.toFixed(1)}deg)`;
          }
          rafId = requestAnimationFrame(tick);
        }
        rafId = requestAnimationFrame(tick);

        // Pause the animator when the tab is hidden to save CPU/GPU. The
        // Page Visibility API fires `visibilitychange` on tab-switch, minimize,
        // and (on mobile) app-backgrounding. Re-synchronise `start` on resume
        // so blobs don't jump discontinuously.
        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(rafId);
            rafId = 0;
          } else if (!rafId) {
            start = performance.now() - ((performance.now() - start) % 1e9);
            rafId = requestAnimationFrame(tick);
          }
        });
      })();

      // ============================ BOOT ==================================
      await loadDefault();
      renderAll();
    </script>
  </body>
</html>
