          </button>`;
        themeCard.innerHTML = `
          <div class="flex items-baseline justify-between gap-3 mb-1">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-[var(--fg-subtle)]">Theme</h2>
            <span class="chip chip-muted">also: <kbd class="mono text-[0.625rem] px-1 py-px rounded border border-[var(--border)]">⌘J</kbd> to toggle</span>
          </div>
          <p class="text-sm text-[var(--fg-muted)] mb-4">Light mode is tinted paper off-white; dark is oklch midnight. Both WCAG AA across tokens.</p>
          <div role="radiogroup" aria-label="Theme" class="grid sm:grid-cols-2 gap-2">
            ${tRow('light', 'Light', 'Paper off-white base with warm colored washes. Default.')}
            ${tRow('dark',  'Dark',  'Oklch midnight with tuned language colors and hairlines.')}
          </div>
        `;
        wrap.append(themeCard);

        p.append(wrap);
      }

      function renderFiles() {
        const p = $('#panel-files');
        p.innerHTML = '';
        const f = SELECTED_FILE;
        if (!f) {
          p.append(h('div', { class: 'max-w-4xl mx-auto content-cap' },
            h('div', { class: 'surface rounded-lg p-6 text-center text-[var(--fg-muted)]' }, 'Select a file in the tree to see its outline.'),
          ));
          return;
        }
        const wrap = h('div', { class: 'max-w-4xl mx-auto content-cap' });
        const crumbs = h('div', { class: 'flex items-center gap-2 text-xs text-[var(--fg-subtle)] mb-3 mono truncate' });
        crumbs.textContent = f.path.split('/').join(' / ');
        wrap.append(crumbs);
        wrap.append(h('h1', { class: 'text-xl font-semibold mb-1' }, f.name));
        const meta = h('div', { class: 'flex flex-wrap items-center gap-2 mb-4' });
        const statusClass = f.status === 'broken' ? 'danger' : f.status === 'stale' ? 'warn' : 'ok';
        meta.innerHTML = `<span class="chip chip-${statusClass}">${f.status}</span><span class="text-xs text-[var(--fg-muted)]">${f.language?.label || 'Unknown'} · ${f.loc} LOC · <span class="mono">${fmtBytes(f.size)}</span>${f.gzip ? ' · <span class="mono">' + fmtBytes(f.gzip) + '</span> gzip' : ''} · <span class="mono">${fmtTok(f.tokens)} tok</span></span>`;
        wrap.append(meta);

        wrap.append(renderFilesPaneContent(f, LOCAL_TAB));
        p.append(wrap);

        // Reflect the active local tab + TODOs count on the local tab bar.
        syncLocalTabUI(f);
      }

      function syncLocalTabUI(f) {
        const bar = $('nav[aria-label="Primary navigation"]')?.parentElement; // cheap no-op; keep signature consistent
        const todosChip = $('#local-todos-chip');
        if (todosChip && f) todosChip.textContent = (f.todoEntries?.length ?? f.todos ?? 0);
        $$('[role="tablist"][aria-label="File view"] [role="tab"]').forEach((t) => {
          const key = t.dataset.localTab;
          t.setAttribute('aria-selected', String(key === LOCAL_TAB));
        });
      }

      // Files pane — flat editorial treatment. Each tab renders content
      // directly on the page surface; hairline rules separate concerns.
      // Only the Preview tab keeps a container (because the code block
      // needs a visual frame). Everything else is prose + `<dl>` pairs.
      function renderFilesPaneContent(f, tab) {
        const wrap = h('div', { class: 'space-y-5' });
        const mkLabel = (t) => { const el = h('div', { class: 'ed-label' }, t); return el; };

        switch (tab) {
          case 'preview': {
            wrap.append(mkLabel('Preview'));
            const frame = h('pre', {
              class: 'mono text-xs',
              style: {
                background: 'var(--code-bg)', padding: '12px 14px', borderRadius: '8px',
                border: '1px solid var(--border)', maxHeight: '60dvh', overflow: 'auto',
                whiteSpace: 'pre', lineHeight: '1.55', tabSize: '2',
              },
            });
            // Only the served CLI (`factstack ui`) exposes /api/file.
            // file:// loads have no server. Static hosts (Netlify) have
            // an SPA fallback that returns the dashboard HTML for /api/*
            // — so we ALSO check window.__STATIC_MODE which the live-
            // update detector sets at startup.
            const served = location.protocol.startsWith('http');
            const staticMode = window.__STATIC_MODE === true;
            if (!served || staticMode) {
              frame.textContent = `// ${f.path}\n// Source preview is only available when served by the CLI.\n// Run \`factstack ui /path/to/your/project\` to enable.`;
              wrap.append(frame);
              break;
            }
            frame.textContent = 'loading…';
            wrap.append(frame);
            fetch('/api/file?path=' + encodeURIComponent(f.path), { cache: 'no-store' })
              .then((r) => r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status + ' · ' + r.statusText)))
              .then((text) => {
                // Cap what we actually show — browsers choke on 50k-line single <pre>.
                const capped = text.length > 120_000 ? text.slice(0, 120_000) + '\n\n// … truncated (120 KB cap)' : text;
                frame.textContent = capped;
              })
              .catch((e) => { frame.textContent = `// failed to load ${f.path}\n// ${e?.message || e}`; });
            break;
          }
          case 'imports': {
            wrap.append(mkLabel('Imports'));
            // Real import edges come from DATA.edges (AST-extracted). A
            // file's imports are the edges where `from === f.path`.
            const outs = (DATA.edges || []).filter((e) => e.from === f.path);
            if (!outs.length) {
              const prose = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem' } });
              prose.textContent = 'No outgoing imports detected.';
              wrap.append(prose);
              break;
            }
            const ul = h('ul', { class: 'space-y-1', style: { listStyle: 'none', padding: 0, margin: 0 } });
            for (const edge of outs) {
              const li = h('li', { class: 'text-xs' });
              const kindChip = edge.kind === 'type-import' ? 'type' : edge.kind === 'dynamic-import' ? 'dynamic' : '';
              li.innerHTML = '<span class="mono">' + escapeHtml(edge.to) + '</span>' +
                (kindChip ? ' <span class="chip chip-muted" style="text-transform:lowercase">' + kindChip + '</span>' : '');
              ul.append(li);
            }
            wrap.append(ul);
            break;
          }
          case 'callers': {
            wrap.append(mkLabel('Callers'));
            const ins = (DATA.edges || []).filter((e) => e.to === f.path);
            if (!ins.length) {
              const prose = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem' } });
              prose.textContent = 'No callers detected. This file is unreachable from any imported entry point, or is an entry point itself.';
              wrap.append(prose);
              break;
            }
            const ul = h('ul', { class: 'space-y-1', style: { listStyle: 'none', padding: 0, margin: 0 } });
            for (const edge of ins) {
              const li = h('li', { class: 'text-xs mono' });
              li.textContent = edge.from;
              ul.append(li);
            }
            wrap.append(ul);
            break;
          }
          case 'todos': {
            const entries = f.todoEntries || [];
            if (!entries.length) {
              wrap.append(mkLabel('TODOs'));
              const prose = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem' } });
              prose.textContent = 'No TODO / FIXME / HACK / XXX / NOTE comments found in this file.';
              wrap.append(prose);
            } else {
              const label = h('div', { class: 'flex items-baseline justify-between' });
              label.innerHTML = `
                <span class="ed-label">TODOs in this file</span>
                <span class="chip chip-warn">${entries.length}</span>
              `;
              wrap.append(label);
              const sevFor = (kind) => ({ TODO: 'chip-warn', FIXME: 'chip-danger', HACK: 'chip-danger', XXX: 'chip-danger', NOTE: 'chip-info' }[kind] || 'chip-muted');
              const ul = h('ul', { style: { listStyle: 'none', padding: 0, margin: 0 } });
              for (const t of entries) {
                const li = h('li', { style: {
                  display: 'grid',
                  gridTemplateColumns: '68px 52px 1fr',
                  alignItems: 'baseline',
                  gap: '0.75rem',
                  padding: '0.625rem 0',
                  borderTop: '1px solid var(--hairline)',
                } });
                li.innerHTML = `
                  <span class="chip ${sevFor(t.kind)}">${escapeHtml(t.kind)}</span>
                  <span class="mono text-xs text-[var(--fg-subtle)] text-right">:${t.line}</span>
                  <span class="text-sm" style="color:var(--fg);line-height:1.55">${escapeHtml(t.text) || '<em class="text-[var(--fg-subtle)]">(no description)</em>'}</span>
                `;
                ul.append(li);
              }
              wrap.append(ul);
            }
            break;
          }
          case 'tests': {
            wrap.append(mkLabel('Tests'));
            const prose = h('p', { class: 'ed-prose', style: { fontSize: '0.9375rem' } });
            prose.textContent = 'Production cross-references test files (Vitest, Playwright, Pytest) back to their subject files. The prototype does not infer tests.';
            wrap.append(prose);
            break;
          }
          case 'outline':
          default: {
            // Editorial description list with hairline separators.
            wrap.append(mkLabel('File info'));
            const dl = h('dl', { style: {
              display: 'grid',
              gridTemplateColumns: '10rem 1fr',
              columnGap: '1.25rem',
              rowGap: 0,
              margin: 0,
            } });
            const pairs = [
              ['Extension', `<span class="mono">${escapeHtml(f.ext || '—')}</span>`],
              ['Language', `${escapeHtml(f.language?.label || 'Unknown')}`],
              ['Bytes', `<span class="mono">${fmtBytes(f.size)}</span>`],
              ...(f.gzip ? [['Gzip', `<span class="mono">${fmtBytes(f.gzip)}</span>`]] : []),
              ['LOC', `<span class="mono">${f.loc}</span>`],
              ['Tokens (cl100k approx)', `<span class="mono">${fmtTok(f.tokens)}</span>`],
              ['TODO / FIXME count', `<span class="mono">${f.todoEntries?.length ?? f.todos ?? 0}</span>`],
              ['Last modified', `<span class="mono text-xs">${new Date(f.mtime || Date.now()).toLocaleString()}</span>`],
            ];
            pairs.forEach(([k, v], i) => {
              const border = i === 0 ? '' : 'border-top:1px solid var(--hairline);';
              dl.insertAdjacentHTML('beforeend',
                `<dt style="${border}padding:0.5rem 0;color:var(--fg-subtle);font-size:0.8125rem">${escapeHtml(k)}</dt>` +
                `<dd style="${border}padding:0.5rem 0;margin:0;color:var(--fg);font-size:0.875rem">${v}</dd>`
              );
            });
            wrap.append(dl);
            wrap.append(h('hr', { class: 'ed-rule', style: { margin: '1.5rem 0' } }));
            wrap.append(mkLabel('Outline'));
            // Outline tree — VS Code-style symbol list. When served by
            // `factstack ui`, the /api/outline endpoint parses the file
            // with @babel/parser and returns a hierarchical list.
            const outlineBox = h('div', { class: 'outline-box' });
            const served = location.protocol.startsWith('http');
            const staticMode = window.__STATIC_MODE === true;
            if (!served || staticMode) {
              outlineBox.innerHTML = '<p class="ed-prose" style="font-size:0.9375rem">Outline is populated live by <span class="mono">factstack ui</span>. The hosted demo only ships the bundled artifact \u2014 run the CLI on your own project for outlines, source previews, and re-analysis.</p>';
              wrap.append(outlineBox);
              break;
            }
            outlineBox.innerHTML = '<p class="mono" style="font-size:0.75rem;color:var(--fg-subtle)">loading outline…</p>';
            wrap.append(outlineBox);
            fetch('/api/outline?path=' + encodeURIComponent(f.path))
              .then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
              .then((data) => {
                if (!data.outline || !data.outline.length) {
                  outlineBox.innerHTML = '<p class="ed-prose" style="font-size:0.9375rem">No declarations detected.</p>';
                  return;
                }
                outlineBox.innerHTML = '';
                outlineBox.append(renderOutlineTree(data.outline));
              })
              .catch((e) => {
                outlineBox.innerHTML = '<p class="ed-prose" style="font-size:0.9375rem;color:var(--fg-muted)">Could not load outline: ' + escapeHtml(e?.message || String(e)) + '</p>';
              });
            break;
          }
        }
        return wrap;
      }

      // ============================ LIBRARY ================================
      // Per-file readable purpose. The Files tab is a developer outline
      // (declarations + preview); Library is a CXO/AI-agent-friendly
      // explanation: WHAT does this file do, WHO uses it, WHAT does it
      // depend on. All synthesized deterministically from existing
      // analyzer data — no LLM, no invented prose.
      //
      // Layout: two-pane. LHS is a vertical list of source files grouped
      // by inferred role (Pages, Components, State, Backend, Utilities,
      // Styles, Other). Click a file → RHS shows its explanation card.
      // First-render selects the largest file by tokens — the most
      // important place to start understanding any project.
      let LIBRARY_SELECTED = null;
      let LIBRARY_SEARCH = '';

      /** Quick-lookup map from language id → language metadata (color,
       *  label, tag). Refreshed by `refreshLangsById()` on every render
       *  pass before the LHS list rebuild — cheap (≤10 entries) but
       *  called many times during library re-render. Declared here at
       *  the top of the library state block so all callers in this
       *  IIFE see the same instance. */
      const LANGS_BY_ID = new Map();
      function refreshLangsById() {
        LANGS_BY_ID.clear();
        for (const l of DATA?.project?.languages || []) LANGS_BY_ID.set(l.id, l);
      }

      function renderLibrary() {
        const p = $('#panel-library');
        if (!p) return;
        // Wrap the body in a try/catch so an unexpected artifact shape
        // (e.g. an analyzer field that becomes null on a future version)
        // surfaces as a readable message instead of leaving the panel
        // blank. Defensive but cheap — runs once per render.
        try { return _renderLibraryInner(p); } catch (e) {
          p.innerHTML = '<div class="p-8 text-[var(--fg-muted)]">Library failed to render: ' + (e?.message || 'unknown error') + '. Re-analyze the project; if the problem persists, file an issue with the project shape.</div>';
        }
      }
      function _renderLibraryInner(p) {
        // CRITICAL: every other render fn in this file (renderRoutes,
        // renderRisks, renderHistory, renderConfig, etc.) starts with
        // p.innerHTML = ''. Without it, this function APPENDS a new
        // copy of the library on every call — and the search input's
        // change handler calls renderLibrary() per keystroke, plus
        // renderAll() fires on every SSE re-analyze. A 5-keystroke
        // search would stack 6 library copies on top of each other.
        p.innerHTML = '';

        // ── filter the file list ──────────────────────────────────────
        // Walk the tree, take leaves with a meaningful language, skip
        // dotfiles and lockfiles (they exist for the analyzer to know
        // about, but they're not "files that do something" in the
        // CXO/agent sense).
        const all = libraryFiles(DATA.tree, []);
        const NOISE = new Set(['gitignore', 'lockfile', 'dotenv']);
        const code = all.filter((f) => !NOISE.has(languageId(f))
          && !/^\./.test(f.name)
          && !/(?:^|\/)package-lock\.json$|pnpm-lock\.yaml$|yarn\.lock$/.test(f.path));

        if (!code.length) {
          p.append(h('div', { class: 'p-8 text-[var(--fg-muted)] text-center' },
            'No code files to explain. The analyzer found only configs and assets in this project.'));
          return;
        }

        // ── group by role ─────────────────────────────────────────────
        const ORDER = ['Pages & Routes', 'Components', 'State', 'API & Backend', 'Hooks', 'Utilities', 'Styles', 'Config', 'Other'];
        const groups = new Map(ORDER.map((g) => [g, []]));
        for (const f of code) {
          const role = inferFileRole(f);
          (groups.get(role) || groups.get('Other')).push(f);
        }
        // Sort each group by tokens desc — biggest file first.
        for (const arr of groups.values()) arr.sort((a, b) => (b.tokens ?? 0) - (a.tokens ?? 0));

        // First-render selection: biggest file in the first non-empty
        // group, since that's usually the project's center of mass.
        if (!LIBRARY_SELECTED) {
          for (const g of ORDER) {
            const arr = groups.get(g);
            if (arr && arr.length) { LIBRARY_SELECTED = arr[0].path; break; }
          }
        }

        // ── two-pane layout ───────────────────────────────────────────
        const grid = h('div', { class: 'flex h-full' });
        const left = h('aside', { class: 'shrink-0 border-r border-[var(--border)] overflow-y-auto', style: 'width:22rem;max-width:35vw', 'aria-label': 'Library file index' });
        // Visually-hidden heading so screen readers announce the
        // sidebar as a navigation landmark instead of an unstructured
        // list of buttons.
        const srHeading = h('h2', { class: 'sr-only' }, 'Library files');
        left.append(srHeading);
        const right = h('section', { class: 'flex-1 overflow-y-auto p-5 sm:p-8' });

        // Header + search
        const head = h('div', { class: 'sticky top-0 z-10 px-4 pt-4 pb-3 bg-[color-mix(in_oklab,var(--bg)_88%,transparent)] backdrop-blur-md border-b border-[var(--border)]' });
        head.append(h('div', { class: 'ed-label mb-1', style: 'font-size:0.625rem' }, 'LIBRARY'));
        head.append(h('div', { class: 'text-sm font-medium mb-2' }, code.length + ' files explained'));
        const search = h('input', {
          type: 'search',
          placeholder: 'Filter…',
          value: LIBRARY_SEARCH,
          'aria-label': 'Filter files',
          class: 'w-full px-2 py-1 rounded text-sm bg-[var(--surface-2)] border border-[var(--border)] focus:outline-none focus:ring-2 focus:ring-[var(--accent)]',
        });
        // Debounce search input — every keystroke fires `input`, but
        // re-rendering the entire library on every key would walk the
        // file tree, recompute role buckets, and re-render the RHS
        // explanation card on every press. 120ms is long enough to
        // coalesce typing yet short enough to feel live.
        clearTimeout(search.__t);
        search.addEventListener('input', (e) => {
          const value = e.target.value.toLowerCase();
          clearTimeout(search.__t);
          search.__t = setTimeout(() => {
            LIBRARY_SEARCH = value;
            renderLibrary();
            // re-focus the search box after re-render so typing is uninterrupted
            const reFocused = $('#panel-library input[type="search"]');
            if (reFocused) {
              reFocused.focus();
              // restore caret position to end of value (re-render replaces the node)
              const len = reFocused.value.length;
              reFocused.setSelectionRange(len, len);
            }
          }, 120);
        });
        head.append(search);
        left.append(head);

        // Group sections
        const list = h('div', { class: 'pb-6' });
        for (const g of ORDER) {
          const arr = (groups.get(g) || []).filter((f) =>
            !LIBRARY_SEARCH || f.path.toLowerCase().includes(LIBRARY_SEARCH));
          if (!arr.length) continue;
          const section = h('div', { class: 'mt-4' });
          section.append(h('div', { class: 'px-4 py-1 text-[0.625rem] uppercase tracking-wider text-[var(--fg-subtle)] font-semibold' }, g + ' · ' + arr.length));
          for (const f of arr) {
            const isSel = f.path === LIBRARY_SELECTED;
            const row = h('button', {
              type: 'button',
              class: 'w-full text-left flex items-center gap-2 px-4 py-1.5 hover:bg-[var(--surface-2)] focus:outline-none focus:bg-[var(--surface-2)] ' + (isSel ? 'bg-[color-mix(in_oklab,var(--accent)_12%,transparent)] border-l-2 border-[var(--accent)]' : 'border-l-2 border-transparent'),
              'aria-current': isSel ? 'true' : undefined,
            });
            const langId = languageId(f);
            const lang = langId ? LANGS_BY_ID.get(langId) : null;
            const tag = lang?.tag || (typeof langId === 'string' && langId.length ? langId.slice(0, 4).toUpperCase() : '?');
            // Defensive: iconColor flows from the analyzer today (closed
            // hard-coded list, all safe), but a future analyzer could
            // accept user-provided language metadata. Validate against a
            // tight allowlist before interpolating into a `style` attr
            // to prevent attribute-break / XSS via crafted color values.
            const safeIconColor = isSafeColor(lang?.iconColor) ? lang.iconColor : 'var(--fg-muted)';
            row.innerHTML = `
              <span class="mono text-[10px] font-semibold w-7 shrink-0" style="color:${safeIconColor}">${escapeHtml(tag)}</span>
              <span class="text-sm flex-1 truncate" title="${escapeHtml(f.path)}">${escapeHtml(f.name)}</span>
              <span class="text-[10px] mono text-[var(--fg-subtle)] shrink-0">${fmtTok(f.tokens || 0)}</span>
            `;
            row.addEventListener('click', () => {
              LIBRARY_SELECTED = f.path;
              renderLibrary();
            });
            section.append(row);
          }
          list.append(section);
        }
        left.append(list);

        // Right pane: explanation card for the selected file.
        const sel = code.find((f) => f.path === LIBRARY_SELECTED) || code[0];
        right.append(renderLibraryExplanation(sel));

        grid.append(left, right);
        p.append(grid);
      }

      /** Walk the prototype tree → flat array of file leaves. */
      function libraryFiles(node, acc) {
        if (!node) return acc;
        for (const f of node.files || []) acc.push(f);
        for (const c of node.children || []) libraryFiles(c, acc);
        return acc;
      }

      /**
       * Normalize the file's language identifier to a string. The viz
       * tree's `language` field is sometimes a string ("typescript"),
       * sometimes a `{ id, label }` object, sometimes `null` for files
       * the analyzer couldn't classify. This helper unwraps all three
       * shapes so the rest of the Library code can treat the result
       * as a plain string-or-empty.
       */
      function languageId(f) {
        const v = f && f.language;
        if (!v) return '';
        if (typeof v === 'string') return v;
        if (typeof v === 'object' && typeof v.id === 'string') return v.id;
        return '';
      }

      /**
       * Allowlist colors that are safe to interpolate into a `style`
       * attribute. Accepts:
       *   - hex (`#rgb`, `#rrggbb`, `#rrggbbaa`)
       *   - rgb()/rgba()/hsl()/hsla()/oklch()/oklab() functional forms
       *     using only digits, dots, percent, comma, slash, whitespace,
       *     and the function name itself
       *   - `var(--token)` references (most defensive — preferred)
       *
       * Rejects anything containing quotes, semicolons, or backslashes
       * that could break out of the attribute or escape a CSS string.
       */
      function isSafeColor(s) {
        if (!s || typeof s !== 'string') return false;
        if (/^var\(--[\w-]+\)$/.test(s)) return true;
        if (/^#[0-9a-f]{3,8}$/i.test(s)) return true;
        if (/^(?:rgb|rgba|hsl|hsla|oklch|oklab)\([\d.,%\s\/-]+\)$/i.test(s)) return true;
        return false;
      }


      /**
       * Map a file to a coarse role bucket. The order of checks matters:
       * a file under `src/pages/` that exports a React component should
       * land in "Pages & Routes" not "Components", so we test path-based
       * conventions before content-based ones.
       *
       * Why these buckets: a CXO scanning a codebase needs to know
       * "what shapes the user experience" (Pages), "what are the moving
       * parts" (Components), "where's the data" (State / API), and
       * "what's plumbing" (Hooks, Utilities, Styles, Config). Anything
       * left over is "Other" — we never invent a category.
       */
      function inferFileRole(f) {
        const p = (f.path || '').toLowerCase();
        // Original-case path is needed for regexes that test for
        // PascalCase or camelCase markers (e.g. `useFoo.ts`). The
        // lowercased copy `p` is for case-insensitive folder checks.
        const original = f.path || '';
        const lang = languageId(f);
        if (lang === 'css' || /\.(css|scss|sass|less|stylus)$/.test(p)) return 'Styles';
        if (/(?:^|\/)(?:config|configs)\//.test(p) || /\.config\.(?:js|ts|mjs|cjs)$/.test(p)) return 'Config';
        if (/(?:^|\/)(?:pages|routes|views|screens)\//.test(p)) return 'Pages & Routes';
        if (/(?:^|\/)hooks\//.test(p) || /(?:^|\/)use[A-Z]\w+\.(?:t|j)sx?$/.test(original)) return 'Hooks';
        if (/(?:^|\/)(?:components|widgets|elements|ui)\//.test(p)) return 'Components';
        // State management folders. Catches Redux Toolkit (`redux/slices`),
        // generic state buckets, and the modern store libraries that
        // each have their own folder convention: zustand, jotai, valtio,
        // recoil, mobx. If a project uses an unconventional folder name,
        // the content-based fallback below still picks it up via
        // declaration kinds.
        if (/(?:^|\/)(?:redux|store|stores|state|slices|reducers|atoms|zustand|jotai|valtio|recoil|mobx)\//.test(p)) return 'State';
        if (/(?:^|\/)(?:api|server|backend|services|controllers|handlers|functions)\//.test(p)) return 'API & Backend';
        if (/(?:^|\/)(?:utils|util|lib|libs|helpers|shared|common)\//.test(p)) return 'Utilities';
        // Content-based fallback: if it exports a React-shaped default,
        // call it a Component. The outline data carries declarations.
        const decls = f.declarations || [];
        if (decls.some((d) => d.kind === 'component')) return 'Components';
        if (decls.some((d) => d.kind === 'hook')) return 'Hooks';
        return 'Other';
      }

      /**
       * Compose the per-file explanation card. Sources, in order of
       * trust:
       *   1. The first leading docstring on a top-level declaration
       *      (the human-written intent — most reliable when present).
       *   2. The role bucket + filename + import shape (deterministic
       *      template — never invented, only synthesized from facts).
       *   3. A bare "no description available" fallback.
       *
       * Surface routes if any, callers if any, declarations if any.
       * Every prose claim links to evidence the user can verify.
       */
      function renderLibraryExplanation(f) {
        if (!f) return h('div', { class: 'text-[var(--fg-muted)]' }, 'Select a file.');

        const wrap = h('article', { class: 'max-w-3xl mx-auto' });

        // Breadcrumb path
        const crumbs = h('div', { class: 'mono text-xs text-[var(--fg-subtle)] mb-2 truncate', title: f.path }, f.path.split('/').join(' / '));
        wrap.append(crumbs);

        // Headline + role chip
        const role = inferFileRole(f);
        const head = h('div', { class: 'flex items-baseline gap-3 flex-wrap mb-3' });
        head.append(h('h1', { class: 'text-2xl font-semibold' }, f.name));
        head.append(h('span', { class: 'chip chip-info text-xs' }, role));
        wrap.append(head);

        // Meta line
        const langId = languageId(f);
        const lang = langId ? LANGS_BY_ID.get(langId) : null;
        const meta = h('div', { class: 'flex flex-wrap items-center gap-3 text-xs text-[var(--fg-muted)] mb-5' });
        meta.innerHTML = `
          <span class="mono">${escapeHtml(lang?.label || langId || 'unknown')}</span>
          <span>·</span>
          <span><span class="num">${f.loc ?? 0}</span> LOC</span>
          <span>·</span>
          <span class="mono"><span class="num">${fmtTok(f.tokens ?? 0)}</span> tokens</span>
          ${f.gzip ? `<span>·</span><span class="mono">${fmtBytes(f.gzip)} gzip</span>` : ''}
          <span>·</span>
          <span class="chip chip-${f.status === 'broken' ? 'danger' : f.status === 'stale' ? 'warn' : 'ok'} text-[10px]">${escapeHtml(f.status || 'ok')}</span>
        `;
        wrap.append(meta);

        // Purpose paragraph — the heart of this view.
        const purpose = synthesizePurpose(f, role);
        const purposePara = h('p', { class: 'ed-prose text-base leading-relaxed mb-6', style: 'max-width:60ch' });
        purposePara.innerHTML = purpose.html;
        wrap.append(purposePara);

        // Routes served by this file (if any)
        const routes = (DATA.routes || []).filter((r) => r.handlerFile === f.path);
        if (routes.length) {
          wrap.append(h('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[var(--fg-muted)] mt-6 mb-2' }, `Serves ${routes.length} route${routes.length === 1 ? '' : 's'}`));
          const list = h('div', { class: 'surface rounded-md overflow-hidden mb-4' });
          for (const r of routes) {
            const row = h('div', { class: 'flex items-center gap-3 p-2 border-b border-[var(--border)] last:border-0' });
            row.innerHTML = `
              <span class="chip chip-info mono text-[10px]">${escapeHtml(r.method || 'GET')}</span>
              <span class="mono text-sm flex-1 truncate">${escapeHtml(r.path)}</span>
              <span class="text-[10px] text-[var(--fg-subtle)]">${escapeHtml(r.framework)}</span>
            `;
            list.append(row);
          }
          wrap.append(list);
        }

        // Top-level declarations (functions, classes, components, hooks)
        const decls = (f.declarations || []).filter((d) => d.exported || d.kind === 'component' || d.kind === 'hook');
        if (decls.length) {
          wrap.append(h('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[var(--fg-muted)] mt-6 mb-2' }, `Exports ${decls.length} symbol${decls.length === 1 ? '' : 's'}`));
          const list = h('div', { class: 'space-y-2 mb-4' });
          for (const d of decls.slice(0, 12)) {
            const card = h('div', { class: 'surface rounded-md p-3' });
            card.innerHTML = `
              <div class="flex items-center gap-2 mb-1">
                <span class="chip chip-muted mono text-[10px]">${escapeHtml(d.kind)}</span>
                <span class="mono text-sm font-medium">${escapeHtml(d.name)}</span>
                <span class="text-[10px] text-[var(--fg-subtle)] ml-auto">L${d.startLine}</span>
              </div>
              ${d.docstring ? `<p class="text-sm text-[var(--fg-muted)] leading-relaxed">${escapeHtml(d.docstring)}</p>` : ''}
            `;
            list.append(card);
          }
          if (decls.length > 12) {
            list.append(h('div', { class: 'text-xs text-[var(--fg-subtle)] text-center pt-1' }, `+ ${decls.length - 12} more in the Files tab`));
          }
          wrap.append(list);
        }

        // Imports — what does this file depend on?
        // Three buckets:
        //   - `local`     — relative or absolute file paths (`./foo`, `../bar`)
        //   - `workspace` — bare specifiers the resolver matched to a
        //                   project file (so `@my-org/utils` resolved
        //                   to `packages/utils/src/index.ts` is workspace,
        //                   but `@reduxjs/toolkit` resolved to nothing
        //                   stays external).
        //   - `external`  — bare specifiers the resolver couldn't match
        //                   (npm/pypi/cargo packages).
        //
        // Defensive: skip imports without a string `source` so a future
        // schema field that defaults to null doesn't crash the render.
        if ((f.imports || []).length) {
          const groups = { local: [], workspace: [], external: [] };
          for (const imp of f.imports) {
            const src = imp && imp.source;
            if (typeof src !== 'string' || !src) continue;
            if (src.startsWith('.') || src.startsWith('/')) {
              groups.local.push(imp);
            } else if (imp.resolved && typeof imp.resolved === 'string') {
              groups.workspace.push(imp);
            } else {
              groups.external.push(imp);
            }
          }
          wrap.append(h('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[var(--fg-muted)] mt-6 mb-2' },
            `Imports ${(f.imports || []).length} module${(f.imports || []).length === 1 ? '' : 's'}`));
          const importsBox = h('div', { class: 'surface rounded-md p-4 mb-4 space-y-2' });
          if (groups.external.length) {
            const li = h('div', { class: 'text-sm' });
            li.innerHTML = `<span class="text-[var(--fg-muted)] text-xs uppercase tracking-wide mr-2">External</span>` +
              groups.external.slice(0, 12).map((i) => `<span class="mono text-xs inline-block bg-[var(--surface-2)] rounded px-1.5 py-0.5 mr-1 mb-1">${escapeHtml(i.source)}</span>`).join('') +
              (groups.external.length > 12 ? `<span class="text-xs text-[var(--fg-subtle)]">+ ${groups.external.length - 12} more</span>` : '');
            importsBox.append(li);
          }
          if (groups.local.length) {
            const li = h('div', { class: 'text-sm' });
            li.innerHTML = `<span class="text-[var(--fg-muted)] text-xs uppercase tracking-wide mr-2">Local</span>` +
              groups.local.slice(0, 8).map((i) => `<span class="mono text-xs inline-block bg-[var(--surface-2)] rounded px-1.5 py-0.5 mr-1 mb-1">${escapeHtml(i.source)}</span>`).join('') +
              (groups.local.length > 8 ? `<span class="text-xs text-[var(--fg-subtle)]">+ ${groups.local.length - 8} more</span>` : '');
            importsBox.append(li);
          }
          if (groups.workspace.length) {
            const li = h('div', { class: 'text-sm' });
            li.innerHTML = `<span class="text-[var(--fg-muted)] text-xs uppercase tracking-wide mr-2">Workspace</span>` +
              groups.workspace.map((i) => `<span class="mono text-xs inline-block bg-[var(--surface-2)] rounded px-1.5 py-0.5 mr-1 mb-1">${escapeHtml(i.source)}</span>`).join('');
            importsBox.append(li);
          }
          wrap.append(importsBox);
        }

        // Used by — reverse edges from the dependency graph.
        const callers = (DATA.edges || []).filter((e) => e.to === f.path).map((e) => e.from);
        if (callers.length) {
          wrap.append(h('h2', { class: 'text-sm font-semibold uppercase tracking-wide text-[var(--fg-muted)] mt-6 mb-2' },
            `Used by ${callers.length} file${callers.length === 1 ? '' : 's'}`));
          const list = h('div', { class: 'surface rounded-md p-3 mb-4' });
          list.innerHTML = callers.slice(0, 15).map((c) =>
            `<div class="mono text-xs text-[var(--fg-muted)] truncate" title="${escapeHtml(c)}">${escapeHtml(c)}</div>`
          ).join('') + (callers.length > 15 ? `<div class="text-xs text-[var(--fg-subtle)] mt-1">+ ${callers.length - 15} more</div>` : '');
          wrap.append(list);
        } else if ((f.imports || []).length) {
          // Imports stuff but nobody imports it → likely entrypoint or
          // dead code. Worth surfacing as evidence either way.
          wrap.append(h('div', { class: 'mt-6 text-sm text-[var(--fg-muted)] italic' },
            'No other files import this. It\'s either an entry point reached by the runtime, or unreachable code.'));
        }

        return wrap;
      }

      /**
       * Synthesize the lead paragraph for the file. Pure data, no LLM:
       *   - If the first declaration has a docstring, lead with that —
       *     it's the author's own intent.
       *   - Otherwise, build a sentence from role + name + import-shape:
       *       "{Filename} is a {role-template}. It imports {top external}
       *        and exports {top symbols}."
       *   - Always frame it as evidence, not invention. We never write
       *     prose that isn't directly traceable to data on disk.
       */
      function synthesizePurpose(f, role) {
        const decls = f.declarations || [];
        const firstDoc = decls.find((d) => d.docstring && d.docstring.length > 20)?.docstring;
        if (firstDoc) {
          return { html: '<span class="text-[var(--fg-muted)] text-xs uppercase tracking-wide mr-2">Author note</span>' + escapeHtml(firstDoc) };
        }

        // Evidence-conditional templates. Don't claim "used elsewhere"
        // unless we can see callers; don't claim "page-level route"
        // unless agent.routes points a route at this file. Falls back
        // to the simpler shape when evidence is missing.
        const callerCount = (DATA?.edges || []).filter((e) => e.to === f.path).length;
        const hasRoute = (DATA?.routes || []).some((r) => r.handlerFile === f.path);
        const ROLE_TEMPLATES = {
          'Pages & Routes':   hasRoute ? 'a page-level route component' : 'a page-shaped component',
          'Components':       callerCount > 0 ? 'a reusable UI component' : 'a UI component',
          'State':            'state management (a store, slice, or reducer)',
          'API & Backend':    hasRoute ? 'a server-side handler or backend service' : 'a backend module',
          'Hooks':            callerCount > 0 ? 'a custom React hook used in ' + callerCount + ' file' + (callerCount === 1 ? '' : 's') : 'a custom React hook',
          'Utilities':        callerCount > 0 ? 'a utility module — used in ' + callerCount + ' other file' + (callerCount === 1 ? '' : 's') : 'a utility module',
          'Styles':           'a stylesheet',
          'Config':           'a configuration module',
          'Other':            'a source file',
        };
        const tmpl = ROLE_TEMPLATES[role] || 'a source file';

        const exportedSyms = decls.filter((d) => d.exported || d.kind === 'component' || d.kind === 'hook');
        const exportNames = exportedSyms.slice(0, 3).map((d) => d.name);
        const externalImports = (f.imports || [])
          .map((i) => i && i.source)
          .filter((s) => typeof s === 'string' && s && !s.startsWith('.') && !s.startsWith('/'));
        const topExternals = [...new Set(externalImports)].slice(0, 3);

        let html = `<strong>${escapeHtml(f.name)}</strong> is ${tmpl}`;
        if (exportNames.length) {
          html += ` that exports <span class="mono text-sm">${exportNames.map((n) => escapeHtml(n)).join('</span>, <span class="mono text-sm">')}</span>`;
        }
        if (topExternals.length) {
          html += `. It builds on <span class="mono text-sm">${topExternals.map((n) => escapeHtml(n)).join('</span>, <span class="mono text-sm">')}</span>`;
        }
        html += '.';
        return { html };
      }

        naming.innerHTML = `

                <div class="absolute left-7 top-1 bottom-1 w-px bg-[var(--border)]" aria-hidden="true"></div>

              </li>
              <li class="flex gap-4 items-baseline">
                <span class="chip chip-muted mono text-xs shrink-0">v0.3</span>
                <span class="text-[var(--fg-muted)]">SQLite index, VS Code &amp; Antigravity extension hosting the static UI in a webview.</span>

        `;
        wrap.append(roadmap);

        // ── FOOTER ────────────────────────────────────────────────────
        const footer = h('section', { class: 'px-6 sm:px-12 py-10 border-t border-[var(--border)] text-center text-sm text-[var(--fg-muted)]' });
        footer.innerHTML = `
          <p>FACTS is open source. Built for the kinds of builders who care whether the thing actually works.</p>

        p.append(wrap);

      }

      // ============================ WIRING ================================
      function renderAll() {
        $('#project-name').textContent = DATA.project?.name || '…';
        // Top-nav project chip — name + full path (path is right-truncated
        // via dir=rtl so the tail of the path stays visible, which is what
        // users actually recognize).
        const projName = DATA.project?.name || 'Untitled';
        const projRoot = DATA.project?.root || '.';
        const chipName = $('#project-chip-name');
        const chipPath = $('#project-chip-path');
        if (chipName) chipName.textContent = projName;
        if (chipPath) {
          const fullPath = String(projRoot).replace(/\\/g, '/');
          chipPath.textContent = fullPath;
          // Native browser tooltip on hover so the full path is always
          // accessible even when the chip is truncated. Updated per
          // render so a server-driven swap (e.g. mid-watch reanalyze)

          chipPath.setAttribute('title', fullPath);

        $('#bundle-size').textContent = fmtBytes(DATA.stats?.gzip || 0);

        $('#fits-context').className = 'chip ' + (fits ? 'chip-ok' : 'chip-warn');
        $('#fits-context').textContent = fits ? 'yes' : 'too large';
        $('#risks-count-chip').textContent = (DATA.risks?.length || 0);
        $('#risks-count-chip').className = 'chip ' + ((DATA.risks?.length || 0) > 0 ? 'chip-warn' : 'chip-muted') + ' ml-1';
        $('#local-todos-chip').textContent = (DATA.summary?.health?.todos || 0);
        const rootStr = DATA.project?.root?.replace(/\\/g, '/').split('/').slice(-2).join('/') || DATA.project?.name || '';
        $('#status-root').textContent = rootStr;
        $('#status-health').innerHTML = `<span class="text-[var(--${DATA.summary?.health?.broken ? 'danger' : 'fg-muted'})]">${DATA.summary?.health?.broken || 0} broken</span> · <span class="text-[var(--warn)]">${DATA.summary?.health?.todos || 0} TODOs</span> · <span class="text-[var(--ok)]">${DATA.summary?.health?.secrets || 0} secrets</span>`;

        // Index files for delegated click lookup (tree row clicks use data-path).
        indexFiles(DATA.tree || { files: [], children: [] });

        // Tree
        const t = $('#tree');
        t.innerHTML = '';
        if (DATA.tree && (DATA.tree.files?.length || DATA.tree.children?.length)) {
          renderTree(t, DATA.tree, 0);
        } else {
          t.append(h('div', { class: 'p-3 text-xs text-[var(--fg-muted)]' }, 'No files to show.'));
        }

        // Cache language metadata for quick LHS row icon lookups.
        // Cheap (≤10 entries) but called many times during library re-render.
        refreshLangsById();

        renderOverview();
        renderGraph();
        renderDag();
        renderFiles();
        renderLibrary();
        renderRoutes();
        renderRisks();
        renderHistory();
