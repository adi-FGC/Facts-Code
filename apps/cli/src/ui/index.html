        }
        wrap.addEventListener('pointerdown', (ev) => {
          if (ev.target.closest('.dep-ctrl')) return;
          if (ev.pointerType === 'mouse' && ev.button !== 0) return;
          activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
          wrap.setPointerCapture(ev.pointerId);
          if (activePointers.size === 1) {
            dragging = true; didDrag = false;
            dragStartX = ev.clientX; dragStartY = ev.clientY;
          } else if (activePointers.size === 2) {
            // Second finger down → switch from pan to pinch. Cancel any
            // in-flight single-pointer drag.
            dragging = false;
            const p = computePinch();
            if (!p) return;
            const rect = wrap.getBoundingClientRect();
            pinchState = {
              dist: p.dist,
              cx: p.cx - rect.left,
              cy: p.cy - rect.top,
              zoom0: GRAPH_VIEW.zoom,
              panX0: GRAPH_VIEW.panX,
              panY0: GRAPH_VIEW.panY,
              worldX: (p.cx - rect.left - GRAPH_VIEW.panX) / GRAPH_VIEW.zoom,
              worldY: (p.cy - rect.top - GRAPH_VIEW.panY) / GRAPH_VIEW.zoom,
            };
          }
        });
        wrap.addEventListener('pointermove', (ev) => {
          if (!activePointers.has(ev.pointerId)) return;
          activePointers.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
          if (activePointers.size === 2 && pinchState) {
            const p = computePinch();
            if (!p) return;
            const rect = wrap.getBoundingClientRect();
            const cx = p.cx - rect.left, cy = p.cy - rect.top;
            const scale = p.dist / pinchState.dist;
            const nextZoom = Math.max(0.2, Math.min(4, pinchState.zoom0 * scale));
            // Keep the initial pinch midpoint anchored over its original
            // world position — standard map/Figma pinch behavior.
            GRAPH_VIEW.zoom = nextZoom;
            GRAPH_VIEW.panX = cx - pinchState.worldX * nextZoom;
            GRAPH_VIEW.panY = cy - pinchState.worldY * nextZoom;
            applyTransform();
            return;
          }
          if (!dragging) return;
          const dx = ev.clientX - dragStartX;
          const dy = ev.clientY - dragStartY;
          if (!didDrag && (Math.abs(dx) + Math.abs(dy)) < 4) return;
          didDrag = true;
          wrap.style.cursor = 'grabbing';
          GRAPH_VIEW.panX += dx;
          GRAPH_VIEW.panY += dy;
          dragStartX = ev.clientX; dragStartY = ev.clientY;
          applyTransform();
        });
        function endPointer(ev) {
          activePointers.delete(ev.pointerId);
          if (activePointers.size < 2) pinchState = null;
          if (activePointers.size === 0) { dragging = false; wrap.style.cursor = 'grab'; }
        }
        wrap.addEventListener('pointerup', endPointer);
        wrap.addEventListener('pointercancel', endPointer);
        wrap.addEventListener('lostpointercapture', endPointer);
        // Block the SVG's click when a drag actually happened, so the user
        // doesn't accidentally toggle a folder while panning.
        svgEl.addEventListener('click', (ev) => {
          if (didDrag) { ev.stopPropagation(); ev.preventDefault(); didDrag = false; }
        }, true);

        // Wheel handler — plain scroll NEVER zooms (too easy to trigger
        // by accident). Zoom only fires under Ctrl/Meta, and its origin
        // is the LAST SELECTED NODE's world position (or the viewport
        // center if nothing has been focused). When there's no modifier
        // the event bubbles — the page scrolls, the graph stays still.
        wrap.addEventListener('wheel', (ev) => {
          const modifier = ev.ctrlKey || ev.metaKey;
          if (!modifier) return;
          ev.preventDefault();
          const rect = wrap.getBoundingClientRect();
          // Anchor point in viewport coordinates. Prefer the last focused
          // node; fall back to viewport center.
          let cx = rect.width / 2, cy = rect.height / 2;
          const anchor = GRAPH_VIEW.focusedId ? byId.get(GRAPH_VIEW.focusedId) : null;
          if (anchor) {
            cx = GRAPH_VIEW.panX + anchor.x * GRAPH_VIEW.zoom;
            cy = GRAPH_VIEW.panY + anchor.y * GRAPH_VIEW.zoom;
          }
          const worldX = (cx - GRAPH_VIEW.panX) / GRAPH_VIEW.zoom;
          const worldY = (cy - GRAPH_VIEW.panY) / GRAPH_VIEW.zoom;
          const step = ev.deltaY > 0 ? 0.88 : 1 / 0.88;
          const next = Math.max(0.2, Math.min(4, GRAPH_VIEW.zoom * step));
          GRAPH_VIEW.zoom = next;
          GRAPH_VIEW.panX = cx - worldX * next;
          GRAPH_VIEW.panY = cy - worldY * next;
          applyTransform();
        }, { passive: false });

        // Control buttons — +, −, fit, 1:1. All button-driven transforms
        // tween so the camera moves feel intentional, not teleporting.
        // +/− / reset zoom around the viewport center for predictability.
        ctrl.addEventListener('click', (ev) => {
          const b = ev.target.closest('.dep-btn'); if (!b) return;
          ev.stopPropagation();
          const act = b.getAttribute('data-act');
          if (act === 'fit') { fitToView(420); return; }
          const rect = wrap.getBoundingClientRect();
          const cx = rect.width / 2, cy = rect.height / 2;
          const worldX = (cx - GRAPH_VIEW.panX) / GRAPH_VIEW.zoom;
          const worldY = (cy - GRAPH_VIEW.panY) / GRAPH_VIEW.zoom;
          let nextZoom = GRAPH_VIEW.zoom;
          if (act === 'in') nextZoom = Math.min(4, GRAPH_VIEW.zoom * 1.2);
          else if (act === 'out') nextZoom = Math.max(0.2, GRAPH_VIEW.zoom / 1.2);
          else if (act === 'reset') nextZoom = 1;
          const nextX = cx - worldX * nextZoom;
          const nextY = cy - worldY * nextZoom;
          tweenView(nextX, nextY, nextZoom, 260);
        });
      }
      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

      // ============================ DAG (Sugiyama) ===========================
      //
      // Project-wide module dependency graph, drawn directly to <canvas>.
      //
      //  Layout  : four-phase Sugiyama —
      //              (1) break cycles by dropping edges in known SCCs,
      //              (2) assign layers via Kahn's longest-path,
      //              (3) reduce crossings with barycenter sweeps,
      //              (4) space nodes evenly inside their layer (x = index × COL_W).
      //  Render  : HTML5 canvas, theme tokens resolved via getComputedStyle;
      //            a MutationObserver on <html data-theme> re-reads + repaints
      //            so light/dark toggles land instantly.
      //  Input   : one click  → toggle collapse of node + all descendants.
      //            two clicks → open file in Files pane (dblclick cancels the
      //            pending single click).
      //            drag      → pan.
      //            Ctrl/⌘+scroll → zoom anchored on cursor.
      //
      // Module-level state so collapsed nodes and view transform survive
      // re-renders (theme toggle, window resize, smoothSwap).
      const DAG_STATE = {
        collapsed: new Set(),
        panX: 0, panY: 0, zoom: 1, dirty: true,
        hover: null,
      };

      // Tokens we read from CSS. Cached so every frame isn't a full style
      // resolution; refreshed on theme toggle.
      const DAG_TOKENS = {
        bg: '#fff',
        fg: '#000',
        fgMuted: '#555',
        fgSubtle: '#888',
        surface1: '#fafafa',
        surface2: '#f0f0f0',
        border: 'rgba(0,0,0,0.1)',
        accent: '#08703f',
        info: '#2563eb',
        warn: '#b45309',
        danger: '#b91c1c',
        ok: '#2f855a',
      };
      function refreshDagTokens() {
        const r = getComputedStyle(document.documentElement);
        DAG_TOKENS.bg       = r.getPropertyValue('--bg').trim()       || DAG_TOKENS.bg;
        DAG_TOKENS.fg       = r.getPropertyValue('--fg').trim()       || DAG_TOKENS.fg;
        DAG_TOKENS.fgMuted  = r.getPropertyValue('--fg-muted').trim() || DAG_TOKENS.fgMuted;
        DAG_TOKENS.fgSubtle = r.getPropertyValue('--fg-subtle').trim()|| DAG_TOKENS.fgSubtle;
        DAG_TOKENS.surface1 = r.getPropertyValue('--surface-1').trim()|| DAG_TOKENS.surface1;
        DAG_TOKENS.surface2 = r.getPropertyValue('--surface-2').trim()|| DAG_TOKENS.surface2;
        DAG_TOKENS.border   = r.getPropertyValue('--border').trim()   || DAG_TOKENS.border;
        DAG_TOKENS.accent   = r.getPropertyValue('--accent').trim()   || DAG_TOKENS.accent;
        DAG_TOKENS.info     = r.getPropertyValue('--info').trim()     || DAG_TOKENS.info;
        DAG_TOKENS.warn     = r.getPropertyValue('--warn').trim()     || DAG_TOKENS.warn;
        DAG_TOKENS.danger   = r.getPropertyValue('--danger').trim()   || DAG_TOKENS.danger;
        DAG_TOKENS.ok       = r.getPropertyValue('--ok').trim()       || DAG_TOKENS.ok;
      }

      // ── Sugiyama layout ─────────────────────────────────────────────────
      //
      // Returns:
      //   nodes:    [{ id, path, name, layer, col, x, y, w, h,
      //                langColor, status, tokens, edgesIn, edgesOut }]
      //   edges:    [{ from, to, kind, back }]
      //   layers:   [[nodeId, ...], ...] grouped by layer
      //   width/height in layout coords
      function buildDagLayout(data) {
        // ---- 1. Collect every file that participates in at least one edge.
        //         Isolated files would pollute the view with orphans.
        const fileIndex = new Map();
        (function walk(n) {
          for (const f of (n.files || [])) fileIndex.set(f.path, f);
          for (const c of (n.children || [])) walk(c);
        })(data.tree);

        const edges = (data.edges || []).filter((e) =>
          fileIndex.has(e.from) && fileIndex.has(e.to) && e.from !== e.to);

        const activePaths = new Set();
        for (const e of edges) { activePaths.add(e.from); activePaths.add(e.to); }

        // Cycle-involved edges that we should treat as back-edges for
        // layering purposes. We take the SCC membership from data.graph.cycles
        // (if present). Any edge crossing within an SCC becomes back.
        const sccByNode = new Map();
        const sccs = (data.graph?.cycles || data.cycles || []);
        for (let i = 0; i < sccs.length; i++) {
          for (const id of sccs[i]) sccByNode.set(id, i);
        }
        const edgesTyped = edges.map((e) => {
          const back = sccByNode.has(e.from) && sccByNode.get(e.from) === sccByNode.get(e.to);
          return { from: e.from, to: e.to, kind: e.kind || 'import', back };
        });

        // Respect per-node collapse: collapsed nodes hide their outgoing
        // edges AND their descendants. Descendant = reachable via forward
        // (non-back) edges.
        const hidden = new Set();
        const adjFwd = new Map();
        for (const e of edgesTyped) if (!e.back) {
          if (!adjFwd.has(e.from)) adjFwd.set(e.from, []);
          adjFwd.get(e.from).push(e.to);
        }
        for (const id of DAG_STATE.collapsed) {
          if (!activePaths.has(id)) continue;
          const stack = [...(adjFwd.get(id) || [])];
          while (stack.length) {
            const x = stack.pop();
            if (hidden.has(x)) continue;
            if (x === id) continue;
            hidden.add(x);
            for (const y of (adjFwd.get(x) || [])) stack.push(y);
          }
        }
        const visible = [...activePaths].filter((p) => !hidden.has(p));
        const visibleSet = new Set(visible);

        // ---- 2. Layer assignment — Kahn's longest-path topological.
        const indeg = new Map();
        const adj   = new Map();
        for (const id of visible) { indeg.set(id, 0); adj.set(id, []); }
        for (const e of edgesTyped) {
          if (e.back) continue;
          if (!visibleSet.has(e.from) || !visibleSet.has(e.to)) continue;
          adj.get(e.from).push(e.to);
          indeg.set(e.to, indeg.get(e.to) + 1);
        }
        const layer = new Map();
        const queue = [];
        for (const id of visible) if (indeg.get(id) === 0) { layer.set(id, 0); queue.push(id); }
        while (queue.length) {
          const u = queue.shift();
          const L = layer.get(u);
          for (const v of (adj.get(u) || [])) {
            layer.set(v, Math.max(layer.get(v) || 0, L + 1));
            indeg.set(v, indeg.get(v) - 1);
            if (indeg.get(v) === 0) queue.push(v);
          }
        }
        // Any node still without a layer is inside a cycle we couldn't fully
        // break — park it at layer 0. Its back-edges still render.
        for (const id of visible) if (!layer.has(id)) layer.set(id, 0);

        // ---- 3. Crossing reduction — barycenter sweeps.
        const maxLayer = Math.max(0, ...layer.values());
        const layers = Array.from({ length: maxLayer + 1 }, () => []);
        for (const id of visible) layers[layer.get(id)].push(id);
        // Start with a stable alpha sort for determinism.
        for (const L of layers) L.sort();

        const neighborsUp   = new Map();
        const neighborsDown = new Map();
        for (const id of visible) { neighborsUp.set(id, []); neighborsDown.set(id, []); }
        for (const e of edgesTyped) {
          if (e.back) continue;
          if (!visibleSet.has(e.from) || !visibleSet.has(e.to)) continue;
          neighborsUp.get(e.to).push(e.from);
          neighborsDown.get(e.from).push(e.to);
        }

        function barycenterSweep() {
          // Down pass: reorder each L>0 layer by median of L-1 parents.
          for (let li = 1; li < layers.length; li++) {
            const prev = layers[li - 1];
            const pos = new Map(prev.map((id, i) => [id, i]));
            layers[li].sort((a, b) => median(neighborsUp.get(a), pos) - median(neighborsUp.get(b), pos));
          }
          // Up pass: reorder each layer by median of L+1 children.
          for (let li = layers.length - 2; li >= 0; li--) {
            const next = layers[li + 1];
            const pos = new Map(next.map((id, i) => [id, i]));
            layers[li].sort((a, b) => median(neighborsDown.get(a), pos) - median(neighborsDown.get(b), pos));
          }
        }
        function median(ids, pos) {
          if (!ids || !ids.length) return Number.MAX_SAFE_INTEGER / 2;
          const vals = ids.map((x) => pos.has(x) ? pos.get(x) : null).filter((x) => x != null);
          if (!vals.length) return Number.MAX_SAFE_INTEGER / 2;
          vals.sort((a, b) => a - b);
          return vals[Math.floor(vals.length / 2)];
        }
        for (let i = 0; i < 6; i++) barycenterSweep();

        // ---- 4. Assign x coordinates. Evenly spaced per layer, centered.
        const NODE_W = 172, NODE_H = 34, COL_W = NODE_W + 28, ROW_H = 86;
        const widestLayer = Math.max(...layers.map((L) => L.length));
        const width = widestLayer * COL_W;

        const nodes = new Map();
        for (let li = 0; li < layers.length; li++) {
          const L = layers[li];
          const layerWidth = L.length * COL_W;
          const xOffset = (width - layerWidth) / 2;
          for (let ci = 0; ci < L.length; ci++) {
            const id = L[ci];
            const f = fileIndex.get(id);
            nodes.set(id, {
              id,
              path: id,
              name: f?.name || id.split('/').pop(),
              layer: li,
              col: ci,
              x: xOffset + ci * COL_W + NODE_W / 2,
              y: li * ROW_H + NODE_H / 2 + 40,
              w: NODE_W,
              h: NODE_H,
              langColor: f?.language?.iconColor || DAG_TOKENS.fgSubtle,
              langTag: f?.language?.tag || '·',
              status: f?.status || 'ok',
              tokens: f?.tokens || 0,
              hasChildren: (neighborsDown.get(id) || []).length > 0,
              collapsed: DAG_STATE.collapsed.has(id),
            });
          }
        }

        const layoutEdges = edgesTyped.filter((e) =>
          nodes.has(e.from) && nodes.has(e.to)
        );

        const height = (maxLayer + 1) * ROW_H + 80;
        return { nodes, layers, edges: layoutEdges, width, height };
      }

      // ── Draw + interaction ──────────────────────────────────────────────
      function renderDag() {
        const p = $('#panel-dag');
        p.innerHTML = '';
        const hasEdges = Array.isArray(DATA?.edges) && DATA.edges.length > 0;

        const head = h('header', { class: 'dep-graph-head' });
        head.append(h('h1', { class: 'text-xl font-semibold tracking-tight mb-1' }, 'Module DAG'));
        head.append(h('p', { class: 'dep-graph-lead text-sm text-[var(--fg-muted)] max-w-2xl leading-relaxed' },
          hasEdges
            ? 'Every module that participates in an import edge, arranged as a Sugiyama-style directed acyclic graph. Click a node to collapse its downstream subtree; click again to restore. Double-click to open the file. Ctrl/⌘+scroll to zoom.'
            : 'No import edges in this analysis yet. Run `factstack analyze` to extract AST edges across the codebase.'));
        p.append(head);

        if (!hasEdges) return;

        refreshDagTokens();

        const wrap = h('div', {
          class: 'dep-wrap rounded-xl',
          style: {
            position: 'absolute',
            inset: '0',
            background: 'var(--surface-1)',
            border: '1px solid var(--border)',
            boxShadow: 'var(--shadow-sm)',
            overflow: 'hidden',
            touchAction: 'none',
            userSelect: 'none',
            cursor: 'grab',
          },
        });
        const canvas = h('canvas', { style: { display: 'block', width: '100%', height: '100%' } });
        wrap.append(canvas);
        const ctrl = h('div', {
          class: 'dep-ctrl glass',
          style: {
            position: 'absolute', right: '14px', bottom: '14px', zIndex: 5,
            display: 'flex', gap: '4px', alignItems: 'center',
            padding: '4px 6px', borderRadius: '12px',
            fontFamily: 'JetBrains Mono, monospace', fontSize: '0.75rem',
          },
        });
        ctrl.innerHTML =
          '<button type="button" class="dep-btn" data-act="out" aria-label="Zoom out">−</button>'
          + '<span class="dag-zoom-val" style="min-width:3.25em;text-align:center;font-variant-numeric:tabular-nums">100%</span>'
          + '<button type="button" class="dep-btn" data-act="in" aria-label="Zoom in">+</button>'
          + '<span aria-hidden="true" style="width:1px;height:18px;background:var(--border);margin:0 2px"></span>'
          + '<button type="button" class="dep-btn" data-act="fit" aria-label="Fit to view">Fit</button>'
          + '<button type="button" class="dep-btn" data-act="reset" aria-label="Reset zoom">1:1</button>'
          + '<span aria-hidden="true" style="width:1px;height:18px;background:var(--border);margin:0 2px"></span>'
          + '<button type="button" class="dep-btn" data-act="clear" aria-label="Expand all" title="Expand all">Reset</button>';

        // Outer positioned container so the controller floats over canvas.
        // `width: 100%` is set explicitly — the panel is a plain block so
        // it doesn't otherwise stretch to fill.
        const outer = h('div', {
          style: {
            position: 'relative',
            width: '100%',
            height: 'min(calc(100dvh - 210px), 960px)',
            minHeight: '440px',
            display: 'block',
            margin: '0 20px 20px',
            maxWidth: 'calc(100% - 40px)',
          },
        });
        outer.append(wrap);
        outer.append(ctrl);
        p.append(outer);

        let layout = buildDagLayout(DATA);
        let devicePixelRatio = window.devicePixelRatio || 1;

        function resizeCanvas() {
          const rect = wrap.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          devicePixelRatio = window.devicePixelRatio || 1;
          canvas.width  = Math.round(rect.width  * devicePixelRatio);
          canvas.height = Math.round(rect.height * devicePixelRatio);
          canvas.style.width  = rect.width + 'px';
          canvas.style.height = rect.height + 'px';
          drawDag();
        }
        function fitToView() {
          const rect = wrap.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          const inset = 32;
          const z = Math.min(1.2, Math.max(0.2,
            Math.min((rect.width - inset * 2) / Math.max(layout.width, 1),
                     (rect.height - inset * 2) / Math.max(layout.height, 1))));
          DAG_STATE.zoom = z;
          DAG_STATE.panX = (rect.width - layout.width * z) / 2;
          DAG_STATE.panY = (rect.height - layout.height * z) / 2;
          drawDag();
        }

        function drawDag() {
          const ctx = canvas.getContext('2d');
          const W = canvas.width, H = canvas.height;
          ctx.save();
          ctx.clearRect(0, 0, W, H);
          // Transform into layout space, with DPR scaling and pan/zoom.
          ctx.scale(devicePixelRatio, devicePixelRatio);
          ctx.translate(DAG_STATE.panX, DAG_STATE.panY);
          ctx.scale(DAG_STATE.zoom, DAG_STATE.zoom);

          // Edges first so nodes paint over them.
          for (const e of layout.edges) {
            const a = layout.nodes.get(e.from);
            const b = layout.nodes.get(e.to);
            if (!a || !b) continue;
            const sameLayer = a.layer === b.layer;
            const startY = a.y + a.h / 2;
            const endY   = b.y - b.h / 2;
            ctx.beginPath();
            if (e.back) {
              // Back-edge: accent red-ish dashed curve.
              ctx.setLineDash([5, 5]);
              ctx.strokeStyle = mixColor(DAG_TOKENS.danger, 0.55);
            } else if (sameLayer) {
              ctx.setLineDash([]);
              ctx.strokeStyle = mixColor(DAG_TOKENS.warn, 0.55);
            } else {
              ctx.setLineDash([]);
              ctx.strokeStyle = mixColor(DAG_TOKENS.fg, 0.18);
            }
            ctx.lineWidth = 1;
            // Straight-ish S-curve vertically.
            const midY = (startY + endY) / 2;
            ctx.moveTo(a.x, startY);
            ctx.bezierCurveTo(a.x, midY, b.x, midY, b.x, endY);
            ctx.stroke();
            // Arrow head on forward edges.
            if (!e.back && !sameLayer) {
              const angle = Math.atan2(endY - midY, b.x - a.x);
              const ax = b.x, ay = endY;
              ctx.setLineDash([]);
              ctx.beginPath();
              ctx.moveTo(ax, ay);
              ctx.lineTo(ax - 6 * Math.cos(angle - Math.PI / 6), ay - 6 * Math.sin(angle - Math.PI / 6));
              ctx.lineTo(ax - 6 * Math.cos(angle + Math.PI / 6), ay - 6 * Math.sin(angle + Math.PI / 6));
              ctx.closePath();
              ctx.fillStyle = mixColor(DAG_TOKENS.fg, 0.22);
              ctx.fill();
            }
          }
          ctx.setLineDash([]);

          // Nodes.
          for (const n of layout.nodes.values()) {
            const isHover = DAG_STATE.hover === n.id;
            const radius  = 8;
            const x0 = n.x - n.w / 2, y0 = n.y - n.h / 2;
            roundRect(ctx, x0, y0, n.w, n.h, radius);
            ctx.fillStyle = DAG_TOKENS.surface1;
            ctx.fill();
            ctx.lineWidth = isHover ? 2 : 1;
            ctx.strokeStyle = isHover ? DAG_TOKENS.accent : DAG_TOKENS.border;
            ctx.stroke();
            // Status stripe on the left.
            const stripeColor = n.status === 'broken' ? DAG_TOKENS.danger
                              : n.status === 'stale'  ? DAG_TOKENS.warn
                              : DAG_TOKENS.accent;
            roundRect(ctx, x0 + 1, y0 + 1, 3, n.h - 2, 1.5);
            ctx.fillStyle = stripeColor;
            ctx.fill();
            // Language chip.
            const chipX = x0 + 14, chipY = n.y, chipR = 10;
            ctx.beginPath();
            ctx.arc(chipX, chipY, chipR, 0, Math.PI * 2);
            ctx.fillStyle = mixWith(n.langColor, DAG_TOKENS.surface1, 0.85);
            ctx.fill();
            ctx.lineWidth = 1.25;
            ctx.strokeStyle = n.langColor;
            ctx.stroke();
            ctx.font = '700 8.5px JetBrains Mono, monospace';
            ctx.fillStyle = n.langColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(n.langTag.slice(0, 4), chipX, chipY + 0.5);
            // Name.
            ctx.font = '500 12px Urbanist, system-ui, sans-serif';
            ctx.fillStyle = DAG_TOKENS.fg;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            const nameX = chipX + chipR + 8;
            const nameMaxW = n.w - (nameX - x0) - 8 - (n.collapsed || n.hasChildren ? 20 : 0);
            ctx.fillText(truncateToWidth(ctx, n.name, nameMaxW), nameX, n.y - 5);
            // Meta (layer + tokens).
            ctx.font = '9.5px JetBrains Mono, monospace';
            ctx.fillStyle = DAG_TOKENS.fgSubtle;
            const meta = 'L' + n.layer + (n.tokens ? ' · ' + fmtTok(n.tokens) + 't' : '');
            ctx.fillText(meta, nameX, n.y + 7);
            // Collapse badge.
            if (n.collapsed) {
              const badgeX = x0 + n.w - 10, badgeY = n.y;
              ctx.beginPath();
              ctx.arc(badgeX, badgeY, 7, 0, Math.PI * 2);
              ctx.fillStyle = mixColor(DAG_TOKENS.accent, 0.22);
              ctx.fill();
              ctx.strokeStyle = DAG_TOKENS.accent;
              ctx.lineWidth = 1;
              ctx.stroke();
              ctx.font = '700 9px JetBrains Mono, monospace';
              ctx.fillStyle = DAG_TOKENS.accent;
              ctx.textAlign = 'center';
              ctx.textBaseline = 'middle';
              ctx.fillText('+', badgeX, badgeY + 0.5);
            }
          }
          ctx.restore();

          // Zoom text.
          const zEl = ctrl.querySelector('.dag-zoom-val');
          if (zEl) zEl.textContent = Math.round(DAG_STATE.zoom * 100) + '%';
        }

        // ── Hit testing ───────────────────────────────────────────────────
        function clientToWorld(ev) {
          const rect = canvas.getBoundingClientRect();
          const sx = ev.clientX - rect.left;
          const sy = ev.clientY - rect.top;
          return {
            x: (sx - DAG_STATE.panX) / DAG_STATE.zoom,
            y: (sy - DAG_STATE.panY) / DAG_STATE.zoom,
          };
        }
        function nodeAt(pt) {
          for (const n of layout.nodes.values()) {
            if (pt.x >= n.x - n.w / 2 && pt.x <= n.x + n.w / 2 &&
                pt.y >= n.y - n.h / 2 && pt.y <= n.y + n.h / 2) return n;
          }
          return null;
        }

        // ── Click vs double-click ─────────────────────────────────────────
        let clickTimer = null;
        let pendingId = null;
        function singleClick(id) {
          if (DAG_STATE.collapsed.has(id)) DAG_STATE.collapsed.delete(id);
          else DAG_STATE.collapsed.add(id);
          layout = buildDagLayout(DATA);
          drawDag();
        }
        function doubleClick(id) {
          const f = FILES_BY_PATH.get(id);
          if (f) smoothSwap(() => selectFile(f));
        }
        canvas.addEventListener('click', (ev) => {
          const n = nodeAt(clientToWorld(ev));
          if (!n) {
            if (clickTimer) { clearTimeout(clickTimer); clickTimer = null; pendingId = null; }
            return;
          }
          // Second click on the same node → dblclick path.
          if (pendingId === n.id && clickTimer) {
            clearTimeout(clickTimer); clickTimer = null; pendingId = null;
            doubleClick(n.id);
            return;
          }
          pendingId = n.id;
          clickTimer = setTimeout(() => { clickTimer = null; pendingId = null; singleClick(n.id); }, 240);
        });

        // Hover — just tracks the id for the draw loop; no re-layout.
        canvas.addEventListener('mousemove', (ev) => {
          const n = nodeAt(clientToWorld(ev));
          const newId = n ? n.id : null;
          if (newId !== DAG_STATE.hover) {
            DAG_STATE.hover = newId;
            canvas.style.cursor = newId ? 'pointer' : (drag ? 'grabbing' : 'grab');
            drawDag();
          }
        });
        canvas.addEventListener('mouseleave', () => {
          if (DAG_STATE.hover !== null) { DAG_STATE.hover = null; drawDag(); }
        });

        // ── Pan ───────────────────────────────────────────────────────────
        let drag = null, dragDist = 0;
        canvas.addEventListener('pointerdown', (ev) => {
          if (ev.button !== 0 && ev.pointerType === 'mouse') return;
          const n = nodeAt(clientToWorld(ev));
          if (n) return;        // let click-handler own node interactions
          drag = { sx: ev.clientX, sy: ev.clientY };
          dragDist = 0;
          canvas.setPointerCapture(ev.pointerId);
          wrap.style.cursor = 'grabbing';
        });
        canvas.addEventListener('pointermove', (ev) => {
          if (!drag) return;
          const dx = ev.clientX - drag.sx, dy = ev.clientY - drag.sy;
          drag.sx = ev.clientX; drag.sy = ev.clientY;
          dragDist += Math.abs(dx) + Math.abs(dy);
          DAG_STATE.panX += dx; DAG_STATE.panY += dy;
          drawDag();
        });
        function endDrag() {
          drag = null; wrap.style.cursor = 'grab';
        }
        canvas.addEventListener('pointerup', endDrag);
        canvas.addEventListener('pointercancel', endDrag);
        canvas.addEventListener('lostpointercapture', endDrag);

        // ── Wheel zoom (Ctrl/⌘+scroll only) ───────────────────────────────
        canvas.addEventListener('wheel', (ev) => {
          if (!ev.ctrlKey && !ev.metaKey) return;
          ev.preventDefault();
          const rect = canvas.getBoundingClientRect();
          const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
          const worldX = (cx - DAG_STATE.panX) / DAG_STATE.zoom;
          const worldY = (cy - DAG_STATE.panY) / DAG_STATE.zoom;
          const step = ev.deltaY > 0 ? 0.88 : 1 / 0.88;
          const next = Math.max(0.2, Math.min(4, DAG_STATE.zoom * step));
          DAG_STATE.zoom = next;
          DAG_STATE.panX = cx - worldX * next;
          DAG_STATE.panY = cy - worldY * next;
          drawDag();
        }, { passive: false });

        // ── Controller buttons ────────────────────────────────────────────
        ctrl.addEventListener('click', (ev) => {
          const b = ev.target.closest('.dep-btn'); if (!b) return;
          ev.stopPropagation();
          const act = b.getAttribute('data-act');
          if (act === 'fit') { fitToView(); return; }
          if (act === 'clear') {
            DAG_STATE.collapsed.clear();
            layout = buildDagLayout(DATA);
            drawDag();
            return;
          }
          const rect = canvas.getBoundingClientRect();
          const cx = rect.width / 2, cy = rect.height / 2;
          const worldX = (cx - DAG_STATE.panX) / DAG_STATE.zoom;
          const worldY = (cy - DAG_STATE.panY) / DAG_STATE.zoom;
          let nextZoom = DAG_STATE.zoom;
          if (act === 'in') nextZoom = Math.min(4, DAG_STATE.zoom * 1.2);
          else if (act === 'out') nextZoom = Math.max(0.2, DAG_STATE.zoom / 1.2);
          else if (act === 'reset') nextZoom = 1;
          DAG_STATE.zoom = nextZoom;
          DAG_STATE.panX = cx - worldX * nextZoom;
          DAG_STATE.panY = cy - worldY * nextZoom;
          drawDag();
        });

        // ── Theme reactivity ─────────────────────────────────────────────
        const themeObserver = new MutationObserver(() => {
          refreshDagTokens();
          drawDag();
        });
        themeObserver.observe(document.documentElement, {
          attributes: true, attributeFilter: ['data-theme'],
        });

        // ── First paint via ResizeObserver + visibility watcher ────────
        // #panel-dag starts hidden (display:none), which keeps wrap's box
        // zeroed. The RO fires when the panel gets a non-zero layout, and
        // the MutationObserver catches the tab toggle in case RO doesn't
        // notice (browser-dependent when going display:none → block).
        const paint = () => {
          const rect = wrap.getBoundingClientRect();
          if (!rect.width || !rect.height) return;
          resizeCanvas();
          if (DAG_STATE.dirty) {
            fitToView();
            DAG_STATE.dirty = false;
          } else {
            drawDag();
          }
        };
        new ResizeObserver(paint).observe(wrap);
        // Tab becoming visible is the one time we unconditionally refit —
        // handles the case where an earlier paint() fired with a narrow
        // rect (e.g. visibilityState=hidden, or user first lands on the
        // Overview tab). Without this, the zoom stays clamped at 20%.
        new MutationObserver(() => {
          if (p.classList.contains('hidden')) return;
          setTimeout(() => {
            const rect = wrap.getBoundingClientRect();
            if (!rect.width || !rect.height) return;
            resizeCanvas();
            fitToView();
            DAG_STATE.dirty = false;
          }, 16);
        }).observe(p, { attributes: true, attributeFilter: ['class'] });
        // One immediate try in case we're already visible.
        setTimeout(paint, 16);
      }

      // Canvas rounded-rect helper (path only; caller fills/strokes).
      function roundRect(ctx, x, y, w, h, r) {
        const rr = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + rr, y);
        ctx.arcTo(x + w, y,     x + w, y + h, rr);
        ctx.arcTo(x + w, y + h, x,     y + h, rr);
        ctx.arcTo(x,     y + h, x,     y,     rr);
        ctx.arcTo(x,     y,     x + w, y,     rr);
        ctx.closePath();
      }
      // Canvas truncate-by-width helper.
      function truncateToWidth(ctx, text, maxW) {
        if (ctx.measureText(text).width <= maxW) return text;
        const ell = '…';
        let lo = 0, hi = text.length;
        while (lo < hi) {
          const mid = Math.floor((lo + hi + 1) / 2);
          if (ctx.measureText(text.slice(0, mid) + ell).width <= maxW) lo = mid;
          else hi = mid - 1;
        }
        return text.slice(0, lo) + ell;
      }
      // Returns `color` mixed with page bg at `alpha`. Works with any
      // oklch/hex/rgb string because canvas understands them verbatim.
      function mixColor(color, alpha) {
        // `color-mix()` isn't canvas-native, but rgba hex strings are.
        // Cheap shortcut: if it's already rgba() or #rgba, leave it alone;
        // otherwise synth a CSS.supports-aware color-mix via CSS.
        return `color-mix(in oklab, ${color} ${Math.round(alpha * 100)}%, transparent)`;
      }
      function mixWith(color, other, alpha) {
        return `color-mix(in oklab, ${color} ${Math.round((1 - alpha) * 100)}%, ${other} ${Math.round(alpha * 100)}%)`;
      }

      /* VS Code-style outline tree. Renders OutlineNode[] recursively,
         each row = icon glyph + name + signature, with line number on
         the RHS. Clicking a row scrolls to that line in the preview pane. */
      const OUTLINE_GLYPH = {
        'function':       { g: 'ƒ', c: 'var(--info)' },
        'arrow-function': { g: '→', c: 'var(--info)' },
        'method':         { g: 'm', c: 'var(--accent)' },
        'class':          { g: 'C', c: 'var(--warn)' },
        'interface':      { g: 'I', c: 'var(--info)' },
        'type':           { g: 'T', c: 'var(--accent)' },
        'enum':           { g: 'E', c: 'var(--warn)' },
        'variable':       { g: 'v', c: 'var(--fg-muted)' },
        'property':       { g: '·', c: 'var(--fg-muted)' },
        'import':         { g: '↓', c: 'var(--fg-subtle)' },
        'export':         { g: '↑', c: 'var(--fg-subtle)' },
        'region':         { g: '§', c: 'var(--fg-subtle)' },
      };
      function renderOutlineTree(nodes) {
        const ul = h('ul', { class: 'outline-list', style: { listStyle: 'none', padding: 0, margin: 0 } });
        for (const n of nodes) ul.append(renderOutlineRow(n, 0));
        return ul;
      }
      function renderOutlineRow(n, depth) {
        const li = h('li', { class: 'outline-item' });
        const glyph = OUTLINE_GLYPH[n.kind] || { g: '·', c: 'var(--fg-subtle)' };
        const row = h('button', {
          type: 'button',
          class: 'outline-row',
          'data-line': String(n.line || ''),
          style: { paddingLeft: (8 + depth * 14) + 'px' },
        });
        row.innerHTML =
          '<span class="outline-glyph" style="color:' + glyph.c + '">' + glyph.g + '</span>' +
          '<span class="outline-name">' + escapeHtml(n.name || '(anonymous)') + '</span>' +
          (n.signature ? '<span class="outline-sig mono">' + escapeHtml(n.signature.slice(0, 60)) + '</span>' : '') +
          '<span class="outline-line mono">L' + (n.line || '?') + '</span>';
        li.append(row);
        if (n.children && n.children.length) {
          const sub = h('ul', { class: 'outline-list', style: { listStyle: 'none', padding: 0, margin: 0 } });
          for (const c of n.children) sub.append(renderOutlineRow(c, depth + 1));
          li.append(sub);
        }
        return li;
      }

      // History — editorial empty state. No sparklines (audit M2); one
      // sentence that explains what trend data WILL appear here after
      // multiple analyses.
      function renderHistory() {
        const p = $('#panel-history');
        p.innerHTML = '';
        const wrap = h('article', { class: 'max-w-[64rem] mx-auto' });
        const history = Array.isArray(DATA.history) ? DATA.history : [];
        if (history.length < 2) {
          wrap.innerHTML = `
            <div class="ed-dateline" style="margin-bottom:0.75rem">HISTORY &middot; trend data</div>
            <h1 class="ed-head" style="font-size:clamp(1.75rem, 3.2vw, 2.5rem);margin-bottom:0.5rem">
              ${history.length === 0 ? 'No snapshots yet.' : 'Just one snapshot so far.'}
            </h1>
            <p class="ed-prose" style="font-size:1rem;max-width:62ch">
              Run <span class="mono">factstack analyze</span> across multiple commits or days and this page plots how token cost, risks, TODO count, and file count move over time.
              Each analysis writes a snapshot into <span class="mono">.facts/snapshots/</span>; the sparklines below pick up automatically once two or more exist.
            </p>
          `;
          p.append(wrap);
          return;
        }
        // Sparkline builder — simple SVG polyline, auto-scaled.
        function spark(series, color) {
          if (!series.length) return '';
          const max = Math.max(...series, 1);
          const min = Math.min(...series);
          const span = Math.max(max - min, 1);
          const w = 220, hh = 40, step = w / Math.max(series.length - 1, 1);
          const pts = series.map((v, i) => {
            const x = (i * step).toFixed(1);
            const y = (hh - ((v - min) / span) * (hh - 4) - 2).toFixed(1);
            return x + ',' + y;
          }).join(' ');
          const last = series[series.length - 1];
          return '<svg width="' + w + '" height="' + hh + '" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="' + color + '" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + ((series.length - 1) * step).toFixed(1) + '" cy="' + (hh - ((last - min) / span) * (hh - 4) - 2).toFixed(1) + '" r="2.5" fill="' + color + '"/></svg>';
        }
        const row = (label, values, unit, color) => {
          const first = values[0], last = values[values.length - 1];
          const delta = last - first;
          const pct = first ? ((delta / first) * 100) : 0;
          const arrow = delta === 0 ? '→' : delta > 0 ? '↑' : '↓';
          const signed = (delta >= 0 ? '+' : '') + (Math.abs(delta) >= 1000 ? (delta / 1000).toFixed(1) + 'K' : delta);
          return `<tr style="border-bottom:1px solid var(--border)">
              <td style="padding:14px 0;font-family:var(--font-display);font-weight:600">${label}</td>
              <td style="padding:14px 16px" class="mono">${fmtNum(last)}${unit}</td>
              <td style="padding:14px 16px;color:${delta > 0 ? 'var(--warn)' : delta < 0 ? 'var(--ok)' : 'var(--fg-muted)'}" class="mono">${arrow} ${signed} (${pct.toFixed(1)}%)</td>
              <td style="padding:10px 0;text-align:right">${spark(values, color)}</td>
            </tr>`;
        };
        const fmtNum = (n) => n >= 1_000_000 ? (n/1e6).toFixed(1)+'M' : n >= 1000 ? (n/1000).toFixed(1)+'K' : String(n);
        const firstAt = new Date(history[0].at).toLocaleString();
        const lastAt = new Date(history[history.length - 1].at).toLocaleString();
        wrap.innerHTML = `
          <div class="ed-dateline" style="margin-bottom:0.75rem">HISTORY &middot; ${history.length} snapshots</div>
          <h1 class="ed-head" style="font-size:clamp(1.75rem, 3.2vw, 2.5rem);margin-bottom:0.5rem">How the codebase moved.</h1>
          <p class="ed-prose" style="font-size:1rem;max-width:62ch;margin-bottom:1.5rem">
            ${firstAt} &mdash; ${lastAt}.
            Each analysis writes a snapshot into <span class="mono">.facts/snapshots/</span>; the sparklines plot every one.
          </p>
          <table style="width:100%;border-collapse:collapse;font-size:0.875rem">
            <thead>
              <tr style="border-bottom:1px solid var(--hairline)">
                <th style="padding:8px 0;text-align:left" class="ed-label">Metric</th>
                <th style="padding:8px 16px;text-align:left" class="ed-label">Latest</th>
                <th style="padding:8px 16px;text-align:left" class="ed-label">Since first</th>
                <th style="padding:8px 0;text-align:right" class="ed-label">Trend</th>
              </tr>
            </thead>
            <tbody>
              ${row('Files', history.map((h) => h.files), '', 'var(--info)')}
              ${row('LOC', history.map((h) => h.loc), '', 'var(--accent)')}
              ${row('Tokens', history.map((h) => h.tokens), '', 'var(--accent)')}
              ${row('Risks', history.map((h) => h.risks), '', 'var(--danger)')}
              ${row('TODOs', history.map((h) => h.todos), '', 'var(--warn)')}
            </tbody>
          </table>
        `;
        p.append(wrap);
      }

        const sizeCard = h('section', { class: 'surface rounded-xl p-5' });
        sizeCard.innerHTML = `

          </div>
          <p class="text-sm text-[var(--fg-muted)] mb-4">Multiplier on the root <span class="mono">font-size</span>. Container queries re-flow components so nothing clips.</p>
          <input id="config-font-slider" type="range" min="0.85" max="1.35" step="0.05" value="${fs}" class="w-full accent-[var(--accent)]" aria-label="Font size multiplier"/>
          <div class="flex justify-between text-[0.6875rem] text-[var(--fg-subtle)] mt-2">
            <span>Compact</span><span>Default</span><span>Large</span><span>Extra Large</span>
          </div>
        `;
        wrap.append(sizeCard);

        // Theme — live control, not passive text (audit L2).
        const themeCard = h('section', { class: 'surface rounded-xl p-5' });
        const tRow = (val, label, desc) => `
          <button role="radio" aria-checked="${theme === val}" data-theme-opt="${val}"
                  class="text-left rounded-lg p-4 border transition-colors"

            <div class="flex items-center gap-2 mb-1">

              <span class="chip ${theme === val ? 'chip-ok' : 'chip-muted'} ml-auto">${theme === val ? 'Active' : 'Select'}</span>
