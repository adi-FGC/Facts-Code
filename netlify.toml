###############################################################################
# Netlify configuration — FACTS public demo
#
# What gets deployed: the Remix v3 React app at `apps/ui-remix/`.
# The legacy single-file prototype lives at `legacy/prototype/` and is
# no longer the deploy target — it's reference material while the new
# app finishes porting (see apps/ui-remix/TASKS.md).
#
# The hosted demo is read-only — no /api/reanalyze, no SSE, no /api/file.
# Visitors get FACTS's own analysis baked into the HTML at build time
# (78 KB inline). The CLI (`factstack ui /your/project`) remains the
# live, interactive entry point with re-analyze + watch.
###############################################################################

[build]
  base    = "."
  publish = "apps/ui-remix/dist"
  # `pnpm install` + filtered build keeps the deploy fast — Netlify
  # caches node_modules between runs and only rebuilds the @factstack
  # workspace deps the UI app actually consumes.
  # OPD-3: pin the same pnpm CI validates (package.json packageManager: 11.3.0)
  # so Netlify's frozen-lockfile install matches. OPD-5: build:static emits no
  # source maps (the default `build` mode does), so production doesn't publicly
  # serve the full TypeScript source — matching the Cloudflare deploy.
  command = "corepack enable && corepack use pnpm@11.3.0 && pnpm install --frozen-lockfile && pnpm --filter @factstack/ui-remix build:static"

[build.environment]
  # Pin Node high enough for Remix v3 + Vite 8. Remix 3 requires >=24.3.0.
  NODE_VERSION = "24"

###############################################################################
# Caching:
#   - HTML stays uncached so Remix-app updates ship instantly. The inline
#     dataset is embedded in /index.html; same rule applies.
#   - Hashed asset URLs (Vite emits `assets/index-*.js` with content hashes)
#     are immutable and get the long-term cache.
###############################################################################

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

###############################################################################
# Security headers — baseline hardening; the SPA doesn't accept any
# server-side user input. Adjust if you embed third-party scripts later.
###############################################################################

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    X-Frame-Options           = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Mirror of apps/ui-remix/public/_headers (Cloudflare) — MUST stay byte-equal
    # to that file's CSP; check-bundle-size.mjs fails the build if the two drift.
    # script-src pins the inline no-flash theme boot script by SHA-256 (verified
    # at build); connect-src allows the OSV CVE API + GitHub (the in-browser
    # GitHub-repo scanner fetches the tree/blobs from api.github.com +
    # raw.githubusercontent.com, governed by THIS page CSP since the scan runs in
    # a Web Worker); style/font-src allow Google Fonts; worker-src covers the worker.
    Content-Security-Policy   = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'sha256-mep93d+TYbqkTXigp7/se25JNnDPP4lUmN1PshDxS+o='; worker-src 'self' blob:; connect-src 'self' https://api.osv.dev https://api.github.com https://raw.githubusercontent.com; manifest-src 'self'"

###############################################################################
# SPA-style fallback: client-side routing in React Router v7 owns paths
# like /graph, /files, /library, etc. Unknown paths serve index.html so
# the router can take over.
###############################################################################

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
