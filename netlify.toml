###############################################################################
# Netlify configuration — FACTS public demo
#
# What gets deployed: the Remix v3 app at `apps/ui-remix/` (its own VDOM
# runtime, not React). The primary host is Cloudflare Pages
# (factstack.pages.dev, docs/DEPLOY.md); this Netlify site is an older
# mirror (its live build predates 2026-09-23 — see docs/DEPLOY.md § Netlify).
# The legacy single-file prototype lives at `legacy/prototype/` and is
# no longer the deploy target — it's reference material while the new
# app finishes porting (see apps/ui-remix/TASKS.md).
#
# The hosted demo is read-only — no /api/reanalyze, no SSE, no /api/file.
# Visitors get FACTS's own analysis baked into index.html at build time
# (~700 KB inline; doc bodies load on demand from /data/docs/, see
# inject-data.mjs). The CLI (`factstack ui /your/project`) remains the
# live, interactive entry point with re-analyze + watch.
###############################################################################

[build]
base = "."
publish = "apps/ui-remix/dist"
# `pnpm install` + filtered build keeps the deploy fast — Netlify
# caches node_modules between runs and only rebuilds the @factstack
# workspace deps the UI app actually consumes.
# OPD-3: pin the same pnpm CI validates (package.json packageManager: 12.9.1)
# so Netlify's frozen-lockfile install matches. OPD-5: build:static emits no
# source maps (the default `build` mode does), so production doesn't publicly
# serve the full TypeScript source — matching the Cloudflare deploy.
# The trailing `gen-fb-config.mjs --require` is the publish gate deploy:cf
# has too: build:static only WARNS when no Firebase web config is found, and
# a site published without dist/mcp-auth-config.json breaks MCP sign-in. fb.mjs
# is gitignored, so this site needs FACTS_FB_WEB_CONFIG in its Netlify env;
# without it the build fails and Netlify keeps serving the previous deploy.
command = "corepack enable && corepack use pnpm@12.9.1 && pnpm install --frozen-lockfile && pnpm --filter @factstack/ui-remix build:static && node apps/ui-remix/scripts/gen-fb-config.mjs --require"

[build.environment]
# Pin Node high enough for Remix v3 + Vite 8. Remix 3 requires >=24.3.0.
NODE_VERSION = "24"

###############################################################################
# Caching:
#   - HTML stays uncached so Remix-app updates ship instantly. The inline
#     dataset is embedded in /index.html; same rule applies.
#   - Hashed asset URLs (Vite emits `assets/index-*.js` with content hashes)
#     and the content-addressed dataset sections (/data/sections/*) are
#     immutable and get the long-term cache.
###############################################################################

[[headers]]
for = "/*.html"
[headers.values]
# must-revalidate keeps a redeploy instant. No stale-while-revalidate: next to
# must-revalidate it never applies (HTML_CACHE_CONTROL in
# apps/ui-remix/scripts/lib/cf-headers.mjs). Mirrors the `/*.html` rule in
# apps/ui-remix/public/_headers. Clean URLs (`/`, `/review`) never match
# `/*.html`: their cache rules are generated into dist/_headers
# (generate-discovery.mjs), which Netlify applies too, under this file — so
# they are deliberately NOT repeated here. check-bundle-size.mjs simulates
# both hosts (apps/ui-remix/scripts/lib/cf-headers.mjs + netlify-headers.mjs)
# and fails the build when any path's Cache-Control or CSP differs between them.
Cache-Control = "public, max-age=0, must-revalidate"

# Self-hosted woff2 (apps/ui-remix/src/styles/fonts.css). Content never changes
# under a given name — replacing a face means a new filename, not new bytes.
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Access-Control-Allow-Origin = "*"

[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Agent-discovery + data endpoints. .json/.txt/.xml auto-infer correctly; the
# pack (no extension) and the manifest need explicit types. Data + discovery
# files revalidate so a fresh `factstack analyze` + redeploy ships instantly.
[[headers]]
for = "/factstack.pack"
[headers.values]
Content-Type = "text/plain; charset=utf-8"
Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
for = "/site.webmanifest"
[headers.values]
Content-Type = "application/manifest+json"
[[headers]]
for = "/data/*"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
# Content-addressed dataset sections (performance#5; written only by
# `inject-data.mjs --split-sections`, off by default): a name never gets new
# bytes, so immutable. Mirrors the /data/sections/* rule in _headers; BELOW
# /data/* so its Cache-Control replaces that rule's (later value wins here).
[[headers]]
for = "/data/sections/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

###############################################################################
# Security headers — baseline hardening; the SPA doesn't accept any
# server-side user input. Adjust if you embed third-party scripts later.
###############################################################################

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
X-Frame-Options = "DENY"
Strict-Transport-Security = "max-age=31536000; includeSubDomains"
Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
# Mirror of apps/ui-remix/public/_headers (Cloudflare) — MUST stay byte-equal
# to that file's CSP; check-bundle-size.mjs fails the build if the two drift.
# script-src pins the inline no-flash theme boot script by SHA-256 (verified
# at build); connect-src allows the OSV CVE API + GitHub (the in-browser
# GitHub-repo scanner fetches the tree/blobs from api.github.com +
# raw.githubusercontent.com, governed by THIS page CSP since the scan runs in
# a Web Worker); fonts are self-hosted from /fonts (v0.3.13), so no
# third-party font or style origin appears here; worker-src covers the worker. SEC-3: style-src has NO 'unsafe-inline' — the
# css() runtime injects via adopted stylesheets and all inline style= props
# were converted to css() classes / SVG presentation attributes (guarded by
# check-bundle-size.mjs, which also asserts style-src parity with _headers).
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self' 'sha256-mep93d+TYbqkTXigp7/se25JNnDPP4lUmN1PshDxS+o='; worker-src 'self' blob:; connect-src 'self' https://api.osv.dev https://api.github.com https://raw.githubusercontent.com; manifest-src 'self'"

# Scoped CSP for the MCP Google sign-in page ONLY (Firebase SDK from gstatic +
# Google popup + POST to the local loopback). Kept separate so the main app CSP
# above stays strict. Must stay byte-equal to the /mcp-auth* blocks in
# apps/ui-remix/public/_headers — check-bundle-size.mjs enforces the parity.
#
# BOTH keys, and both BELOW `/*`: Netlify serves the page at `/mcp-auth.html`
# and at the clean `/mcp-auth`, and for the same header a later netlify.toml
# rule replaces an earlier one — and netlify.toml replaces dist/_headers. With
# only the .html key here, `/*` above overrode the _headers /mcp-auth block and
# the clean URL got the strict app CSP, which blocks the Firebase SDK (seen
# live 2026-09-24). apps/ui-remix/scripts/lib/netlify-headers.mjs models this; the build
# fails if either URL would get anything but the scoped policy.
[[headers]]
for = "/mcp-auth.html"
[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com http://127.0.0.1:* http://localhost:*; frame-src https://facts-stack.firebaseapp.com https://accounts.google.com"

[[headers]]
for = "/mcp-auth"
[headers.values]
Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com http://127.0.0.1:* http://localhost:*; frame-src https://facts-stack.firebaseapp.com https://accounts.google.com"

###############################################################################
# SPA-style fallback: the app's client-side router (src/lib/routes.ts) owns
# paths like /review, /files, /docs, etc. Unknown paths serve index.html so
# the router can take over. Not forced, so an existing file (the data,
# /mcp-auth-config.json, /mcp-auth.html) is always served as itself.
###############################################################################

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
